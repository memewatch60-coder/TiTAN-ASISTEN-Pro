<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 1.5s infinite; }
        @keyframes blink-gold { 0%, 100% { border-color: rgba(255,215,0,0.1); } 50% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); } }
        #face-video { width: 100%; height: 160px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; margin-bottom: 10px; }
        .floating-msg { position: fixed; top: 110px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); max-width: 220px; font-size: 9px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        canvas.mini-chart { height: 60px !important; width: 100% !important; }
    </style>
</head>
<body>

<div id="notif-area"></div>

<div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] overflow-y-auto p-6 flex flex-col items-center">
    <div class="w-full max-w-sm text-center mt-4">
        <img src="https://i.ibb.co/9H0pL7H/94672.png" alt="TITAN LOGO" class="w-32 h-32 mx-auto mb-4 rounded-2xl border border-white/10 shadow-2xl">
        <h1 class="titan-font text-3xl text-yellow-500 mb-1 tracking-tighter uppercase">Titan V.13</h1>
        <p class="text-[8px] tracking-[4px] opacity-50 mb-8 uppercase font-black">Military-Grade Security</p>
        
        <div id="auth-box" class="space-y-4">
            <input type="text" id="auth-phone" placeholder="NO TELEPON TELEGRAM" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
            
            <div id="biometric-mod" class="hidden space-y-2">
                <video id="face-video" class="hidden" autoplay muted playsinline></video>
                <button onclick="startFaceScan()" id="scan-btn" class="w-full py-3 bg-blue-600 rounded-xl text-[10px] titan-font shadow-lg uppercase">Scan Wajah (Biometric)</button>
            </div>

            <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
            
            <div class="grid grid-cols-2 gap-2">
                <button onclick="handleAuth('LOGIN')" class="py-4 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase active:scale-95 transition-all">Masuk</button>
                <button onclick="toggleAuth()" id="toggle-btn" class="py-4 bg-white/5 border border-white/10 text-white titan-font text-[10px] rounded-xl uppercase">Daftar</button>
            </div>
            
            <button onclick="masterBypass()" class="w-full py-2 text-[8px] opacity-20 uppercase tracking-[3px]">Master Access Otoritas</button>
        </div>
    </div>
</div>

<div id="custom-alert" class="fixed inset-0 z-[10001] flex items-center justify-center p-6 hidden">
    <div class="absolute inset-0 bg-black/95 backdrop-blur-xl"></div>
    <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 relative text-center">
        <div class="w-16 h-16 bg-yellow-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-yellow-500/20 text-yellow-500">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h3 class="titan-font text-[11px] text-white mb-2 uppercase tracking-widest">TITAN V13 SYSTEM</h3>
        <div id="alert-content" class="text-[10px] text-white/70 mb-6 leading-relaxed"></div>
        <button onclick="closeAlert()" class="w-full py-3 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase">Konfirmasi</button>
    </div>
</div>

<header class="p-4 flex justify-between items-center bg-black/80 border-b border-yellow-500/10 backdrop-blur-lg sticky top-0 z-50">
    <div onclick="showRealModeCheck()" class="cursor-pointer bg-white/5 p-2 px-3 rounded-2xl flex items-center gap-2 border border-white/10">
        <div id="mode-dot" class="w-2 h-2 rounded-full bg-emerald-500 pulse-live"></div>
        <span id="mode-text" class="titan-font text-[9px] font-black uppercase">Training Mode</span>
    </div>
    <div class="flex items-center gap-2">
        <button onclick="toggleLang()" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-xs">
            <span id="ui-flag">🇮🇩</span>
        </button>
        <button onclick="wipeState(true)" class="text-rose-500 bg-rose-500/10 w-8 h-8 rounded-lg border border-rose-500/20">
            <i class="fa-solid fa-power-off text-sm"></i>
        </button>
    </div>
</header>

<main class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
    <section class="p-5">
        <div class="glass-premium p-6 relative overflow-hidden">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[8px] uppercase font-black opacity-40">Capital Management (<span id="perc-stat">0.00%</span>)</p>
            </div>
            <h2 id="cap-main" class="titan-font text-3xl text-yellow-500 font-black mb-4 tracking-tighter">Rp 0</h2>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                    <p class="text-[7px] opacity-50 uppercase mb-1">Scalp (40%)</p>
                    <p id="b-scalp" class="text-[9px] font-bold text-emerald-400">Rp 0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                    <p class="text-[7px] opacity-50 uppercase mb-1">Smart (39%)</p>
                    <p id="b-smart" class="text-[9px] font-bold text-blue-400">Rp 0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                    <p class="text-[7px] opacity-50 uppercase mb-1">Moon (21%)</p>
                    <p id="b-moon" class="text-[9px] font-bold text-violet-400">Rp 0</p>
                </div>
            </div>
        </div>
    </section>

    <section class="px-5 mb-10 h-[65vh]">
        <div class="grid grid-cols-3 gap-4 h-full">
            <div class="flex flex-col">
                <h3 class="titan-font text-[9px] text-yellow-500 mb-4 uppercase text-center font-black">Analysis</h3>
                <div id="list-analysis" class="flex-1 overflow-y-auto no-scrollbar space-y-4"></div>
            </div>
            <div class="flex flex-col">
                <h3 class="titan-font text-[9px] text-blue-500 mb-4 uppercase text-center font-black">Execution</h3>
                <div id="list-execution" class="flex-1 overflow-y-auto no-scrollbar space-y-4"></div>
            </div>
            <div class="flex flex-col">
                <div class="flex flex-col items-center mb-4 gap-1">
                    <h3 class="titan-font text-[9px] text-emerald-500 uppercase font-black">History</h3>
                    <button id="excel-btn" class="hidden text-[7px] bg-emerald-500/10 text-emerald-500 px-1 border border-emerald-500/20 rounded font-bold uppercase">XLSX</button>
                </div>
                <div id="list-history" class="flex-1 overflow-y-auto no-scrollbar space-y-2"></div>
            </div>
        </div>
    </section>
</main>

<footer class="fixed bottom-0 left-0 right-0 p-4 bg-black/95 border-t border-white/5 z-50">
    <div class="flex justify-around items-center max-w-md mx-auto relative">
        <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-ranking-star"></i><span class="text-[8px]">LIVE</span></button>
        <button id="tg-group-link" class="flex flex-col items-center gap-1 text-sky-400"><i class="fa-brands fa-telegram text-2xl"></i><span class="text-[8px]">GROUP</span></button>
        <div onclick="smartScanTrigger()" class="w-14 h-14 bg-yellow-500 rounded-full flex items-center justify-center -mt-10 shadow-lg shadow-yellow-500/30 border-8 border-[#020308] cursor-pointer active:scale-90 transition-all"><i class="fa-solid fa-bolt text-black text-xl"></i></div>
        <button class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-brain"></i><span class="text-[8px]">AI SCAN</span></button>
        <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-shield-check"></i><span class="text-[8px]">SECURE</span></button>
    </div>
</footer>

<div id="modal-vault" class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-8 hidden backdrop-blur-2xl">
    <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/40 text-center">
        <i class="fa-solid fa-vault text-3xl text-yellow-500 mb-4"></i>
        <h3 class="titan-font text-sm text-yellow-500 mb-1 uppercase tracking-widest font-black">Initialize Vault</h3>
        <p class="text-[8px] opacity-40 mb-8 uppercase tracking-widest">Min: 1.000.000 | Max: 1.000.000.000</p>
        <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-4 rounded-xl mb-8 titan-font text-2xl text-center text-yellow-500 border border-white/10 outline-none">
        <button onclick="finalizeCapital()" class="w-full py-5 bg-yellow-500 text-black font-black rounded-xl titan-font text-[10px] uppercase shadow-lg tracking-widest">Activate Engine</button>
    </div>
</div>

<script>
(function() {
    const MASTER_CFG = {
        MK: "MahadhareV13Master",
        TG: "https://t.me/+8uJ78T4VDHJkOTRl"
    };

    let state = {
        authMode: 'LOGIN', face: false, isMaster: false,
        status: 'STANDART', mode: 'TRAINING',
        initCap: 0, capProfit: 0, buckets: { scalp: 0, smart: 0, moon: 0 },
        cards: [], log: []
    };

    // --- ABSOLUTE MASTER PRIORITY LOGIN ---
    window.handleAuth = function() {
        const ph = document.getElementById('auth-phone').value;
        const ps = document.getElementById('auth-pass').value;

        if (ps === MASTER_CFG.MK) { 
            return autoEnter('Master'); 
        }
        
        // Logika login Standart...
        if (ph === localStorage.getItem('titan_ph') && ps === localStorage.getItem('titan_ps')) {
            return autoEnter(ph);
        }
        showCustomAlert("Akses Ditolak. Periksa Nomor/Password.");
    }

    window.masterBypass = function() { autoEnter('Master'); }

    function autoEnter(u) {
        document.getElementById('auth-screen').style.display = 'none';
        
        if(u === 'Master') { 
            state.status = 'ELITE'; 
            state.isMaster = true; 
            state.mode = 'REAL'; 
            // Update UI Header untuk Master
            document.getElementById('mode-text').innerText = "REAL MODE";
            document.getElementById('mode-dot').className = "w-2 h-2 rounded-full bg-yellow-500 pulse-live";
            document.getElementById('mode-text').className = "titan-font text-[9px] font-black uppercase text-yellow-500";
        }
        
        // PAKSA VAULT JIKA MODAL MASIH 0
        if(state.initCap === 0) {
            const vaultModal = document.getElementById('modal-vault');
            vaultModal.classList.remove('hidden');
            vaultModal.style.zIndex = "10002";
        }
        startEngine();
    }

    // --- BUCKET & VAULT LOGIC ---
    window.finalizeCapital = function() {
        const v = parseInt(document.getElementById('vault-input').value);
        if(isNaN(v) || v < 1000000) return showCustomAlert("Modal Minimal 1JT IDR.");
        
        state.initCap = v; 
        state.capProfit = 0; // Capital Management mulai dari 0
        state.buckets = { scalp: v*0.4, smart: v*0.39, moon: v*0.21 };
        
        document.getElementById('modal-vault').classList.add('hidden');
        smartNotif("Mesin TITAN V13 Aktif. Saldo terbagi.");
        renderUI();
    }

    async function startEngine() {
        try {
            const limit = (state.status === 'ELITE') ? 45 : 12;
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page='+limit+'&sparkline=true');
            const data = await res.json();
            processMarket(data);
        } catch (e) { console.warn("API Error"); }
        setTimeout(startEngine, 8000);
    }

    function processMarket(coins) {
        coins.forEach(coin => {
            if(Math.random() > 0.85 && state.cards.length < 15) {
                if(!state.cards.find(c => c.coinId === coin.id)) {
                    state.cards.push({
                        id: Date.now() + Math.random(), coinId: coin.id, name: coin.symbol.toUpperCase(),
                        entry: coin.current_price, current: coin.current_price, status: 'ANALYSIS',
                        img: coin.image, spark: coin.sparkline_in_7d.price.slice(-20),
                        strat: ['SMART', 'SCALP', 'MOONSHOT'][Math.floor(Math.random()*3)],
                        platform: (state.status === 'ELITE') ? 'REAL MODE' : 'TRAINING'
                    });
                }
            } else {
                let card = state.cards.find(c => c.coinId === coin.id);
                if(card) card.current = coin.current_price;
            }
        });
        renderUI();
    }

    function renderUI() {
        document.getElementById('cap-main').innerText = formatIDR(state.capProfit);
        document.getElementById('b-scalp').innerText = formatIDR(state.buckets.scalp);
        document.getElementById('b-smart').innerText = formatIDR(state.buckets.smart);
        document.getElementById('b-moon').innerText = formatIDR(state.buckets.moon);
        
        const aDiv = document.getElementById('list-analysis');
        const eDiv = document.getElementById('list-execution');
        aDiv.innerHTML = ''; eDiv.innerHTML = '';

        state.cards.forEach(c => {
            const pnl = ((c.current / c.entry) - 1) * 100;
            const html = `
                <div class="glass-premium p-4 flex flex-col gap-2 animate-fade-in ${c.status === 'EXECUTION' ? 'blink-execute' : ''}">
                    <div class="flex justify-between items-center">
                        <img src="${c.img}" class="w-6 h-6 rounded-full border border-white/10">
                        <div class="text-right"><p class="text-[9px] titan-font">${c.name}/IDR</p></div>
                    </div>
                    <div class="text-center">
                        <p class="text-[10px] titan-font ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl.toFixed(2)}%</p>
                        <p class="text-[6px] opacity-40 uppercase">${c.platform}</p>
                    </div>
                    <canvas id="chart-${c.id}" class="mini-chart"></canvas>
                    ${c.status === 'ANALYSIS' ? `<button onclick="handleAction(${c.id}, 'LOCK')" class="w-full py-2 bg-yellow-500 text-black text-[8px] font-black rounded-lg uppercase">Lock</button>` : `<div class="flex gap-1"><button class="flex-1 py-2 bg-emerald-500 text-[8px] font-bold rounded-lg uppercase">TP</button><button class="flex-1 py-2 bg-rose-500 text-[8px] font-bold rounded-lg uppercase">SL</button></div>`}
                </div>`;
            if(c.status === 'ANALYSIS') aDiv.innerHTML += html; else eDiv.innerHTML += html;
            setTimeout(() => drawMiniChart(c.id, c.spark, pnl >= 0), 100);
        });
    }

    window.showCustomAlert = function(c) { document.getElementById('alert-content').innerHTML = c; document.getElementById('custom-alert').classList.remove('hidden'); }
    window.closeAlert = function() { document.getElementById('custom-alert').classList.add('hidden'); }
    window.wipeState = function(hard) { if(hard) { localStorage.clear(); sessionStorage.clear(); location.reload(); } }
    function smartNotif(t) { const el = document.createElement('div'); el.className = "floating-msg titan-font text-yellow-500"; el.innerHTML = t; document.getElementById('notif-area').appendChild(el); setTimeout(()=>el.remove(), 4000); }
    function formatIDR(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v); }
    function drawMiniChart(id, data, profit) {
        const ctx = document.getElementById(`chart-${id}`).getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: data.map((_,i)=>i), datasets: [{ data: data, borderColor: profit ? '#10b981' : '#f43f5e', borderWidth: 1.5, fill: false, tension: 0.4, pointRadius: 0 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } });
    }
})();
</script>
</body>
</html>
