<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 1s infinite; }
        @keyframes blink-gold { 0%, 100% { border-color: rgba(255,215,0,0.1); } 50% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); } }
        .floating-msg { position: fixed; top: 110px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); max-width: 220px; font-size: 9px; animation: slideIn 0.3s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        #face-video { width: 100%; height: 180px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; }
        canvas.mini-chart { height: 60px !important; width: 100% !important; }
        /* Hot Zone Effect */
        .hot-zone-pulse { animation: hot-pulse 0.8s infinite; }
        @keyframes hot-pulse { 0% { background: rgba(244, 63, 94, 0.1); } 50% { background: rgba(244, 63, 94, 0.4); } 100% { background: rgba(244, 63, 94, 0.1); } }
    </style>
</head>
<body>

    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] overflow-y-auto p-6 flex flex-col items-center">
        <div class="w-full max-w-sm text-center mt-8">
            <h1 class="titan-font text-3xl text-yellow-500 mb-1 tracking-tighter">TITAN V.13</h1>
            <p class="text-[8px] tracking-[4px] opacity-50 mb-8 uppercase font-black">Mahadhare Gold Security</p>
            
            <div id="auth-box" class="space-y-4">
                <input type="text" id="auth-phone" placeholder="NOMOR TELEPON TELEGRAM" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
                <div id="reg-extra" class="hidden space-y-4">
                    <video id="face-video" class="hidden" autoplay muted playsinline></video>
                    <button onclick="startFaceScan()" id="scan-btn" class="w-full py-3 bg-blue-600 rounded-xl text-[10px] titan-font shadow-lg">SCAN WAJAH (BIOMETRIC)</button>
                </div>
                <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="handleAuth()" id="login-btn" class="py-4 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase">Login</button>
                    <button onclick="toggleAuth()" id="toggle-btn" class="py-4 bg-white/5 border border-white/10 text-white titan-font text-[10px] rounded-xl uppercase">Daftar</button>
                </div>
            </div>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-black/80 border-b border-yellow-500/10 backdrop-blur-lg sticky top-0 z-50">
        <div onclick="showRealModeCheck()" class="cursor-pointer bg-white/5 p-2 px-3 rounded-2xl flex items-center gap-2 border border-white/10">
            <div id="mode-dot" class="w-2 h-2 rounded-full bg-emerald-500 pulse-live"></div>
            <span id="mode-text" class="titan-font text-[9px] font-black uppercase">Training Mode</span>
            <span id="rank-badge" class="ml-2 px-2 py-0.5 bg-yellow-500/20 text-yellow-500 text-[7px] rounded-full border border-yellow-500/30">0 XP</span>
        </div>
        <div class="flex items-center gap-2">
            <span id="btc-guard" class="text-[8px] text-emerald-400 font-bold hidden"><i class="fa-solid fa-shield-bitcoin"></i> GUARD</span>
            <button onclick="location.reload()" class="text-rose-500 bg-rose-500/10 w-8 h-8 rounded-lg border border-rose-500/20"><i class="fa-solid fa-power-off text-sm"></i></button>
        </div>
    </header>

    <main class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
        <section class="p-5">
            <div class="glass-premium p-6 relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-[8px] uppercase font-black opacity-40 tracking-[2px]">Capital Management (<span id="perc-stat">0%</span>)</p>
                    <p id="target-info" class="text-[8px] text-yellow-500 font-bold uppercase"></p>
                </div>
                <h2 id="cap-main" class="titan-font text-3xl text-yellow-500 font-black mb-4 tracking-tighter">Rp 0</h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Scalp (40%)</p>
                        <p id="b-scalp" class="text-[9px] font-bold text-emerald-400">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Smart (39%)</p>
                        <p id="b-smart" class="text-[9px] font-bold text-blue-400">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Moonshot (21%)</p>
                        <p id="b-moon" class="text-[9px] font-bold text-violet-400">Rp 0</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="px-5 space-y-10 pb-40">
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="titan-font text-[10px] text-yellow-500 flex items-center gap-2 uppercase tracking-widest"><i class="fa-solid fa-chart-line"></i> Mata Dewa Analysis</h3>
                    <div id="execute-all-btn" class="hidden">
                        <button onclick="executeAllSignals()" class="text-[8px] bg-yellow-500 text-black px-3 py-1 rounded-lg font-black uppercase">Execute All (ELITE)</button>
                    </div>
                </div>
                <div id="list-analysis" class="space-y-4"></div>
            </section>
            <section><h3 class="titan-font text-[10px] text-blue-500 mb-4 flex items-center gap-2 uppercase tracking-widest"><i class="fa-solid fa-bolt"></i> Execution</h3><div id="list-execution" class="space-y-4"></div></section>
        </div>
    </main>

    <script>
        // --- MASTER CONFIG ---
        const MASTER_CONFIG = {
            ADMIN_PHONE: "081241955337",
            MASTER_KEY: "MahadhareV13Master",
            BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4",
            CI: "-1003254379333",
            GOAL_TARGET: 0.10 // 10%
        };

        let state = {
            xp: 0, rank: 'Standard',
            initCap: 0, capProfit: 0, 
            buckets: { scalp: 0, smart: 0, moon: 0 },
            cards: [], log: [],
            isBtcDrop: false,
            failedAuth: 0, blocked: false
        };

        // --- 1. KEAMANAN & ANTI-BREACH ---
        window.addEventListener('keydown', (e) => {
            if(e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73)) {
                alert("SECURITY BREACH DETECTED. SELF-DESTRUCT INITIATED.");
                localStorage.clear();
                location.reload();
            }
        });

        async function handleAuth() {
            const ph = document.getElementById('auth-phone').value;
            const ps = document.getElementById('auth-pass').value;

            if (ph === MASTER_CONFIG.ADMIN_PHONE && ps === MASTER_CONFIG.MASTER_KEY) {
                return proceedLogin();
            }
            
            state.failedAuth++;
            if(state.failedAuth >= 3) {
                state.blocked = true;
                alert("AKUN DIBLOKIR. HUBUNGI MASTER.");
            } else {
                alert(`Login Gagal. Sisa percobaan: ${3 - state.failedAuth}`);
            }
        }

        async function startFaceScan() {
            const vid = document.getElementById('face-video');
            vid.classList.remove('hidden');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            vid.srcObject = stream;
            setTimeout(() => {
                stream.getTracks().forEach(t => t.stop());
                vid.classList.add('hidden');
                alert("Biometric Validated.");
            }, 4000);
        }

        function proceedLogin() {
            document.getElementById('auth-screen').style.display = 'none';
            // Trigger Modal Vault Initial
            document.getElementById('modal-vault').classList.remove('hidden');
        }

        // --- 2. MATA DEWA ENGINE & BTC GUARD ---
        async function fetchMarketData() {
            // Cek BTC Guard (Simulasi penurunan 2%)
            const btcRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&include_24hr_change=true');
            const btcData = await btcRes.json();
            if(btcData.bitcoin.idr_24h_change < -2) {
                state.isBtcDrop = true;
                document.getElementById('btc-guard').classList.remove('hidden');
            } else {
                state.isBtcDrop = false;
                document.getElementById('btc-guard').classList.add('hidden');
            }

            if(state.isBtcDrop) return; // Hentikan sinyal baru jika BTC Drop

            // Fetch Meme Coins & Top Coins
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&ids=pepe,dogecoin,bonk,shiba-inu,bitcoin,ethereum&sparkline=true');
            const coins = await res.json();
            processMataDewa(coins);
        }

        function processMataDewa(coins) {
            // Cek Goal Lock 10%
            const total = state.capProfit + state.buckets.scalp + state.buckets.smart + state.buckets.moon;
            if (((total / state.initCap) - 1) >= MASTER_CONFIG.GOAL_TARGET) {
                smartNotif("GOAL 10% REACHED. SYSTEM LOCKED.");
                return;
            }

            coins.forEach(coin => {
                // Simulasi RSI < 35 & Volume Spike
                if(Math.random() > 0.85 && state.cards.length < 5) {
                    addSignal(coin);
                }
            });
            renderUI();
        }

        // --- 3. BUCKET LOGIC (40:39:21) & AUTO COMPOUNDING ---
        function finalizeCapital() {
            const v = parseInt(document.getElementById('vault-input').value);
            state.initCap = v;
            state.buckets.scalp = v * 0.40;
            state.buckets.smart = v * 0.39;
            state.buckets.moon = v * 0.21;
            document.getElementById('modal-vault').classList.add('hidden');
            setInterval(fetchMarketData, 10000);
            renderUI();
        }

        // Reset & Compound pada jam 00:00
        setInterval(() => {
            const now = new Date();
            if(now.getHours() === 0 && now.getMinutes() === 0) {
                const total = state.buckets.scalp + state.buckets.smart + state.buckets.moon + state.capProfit;
                state.initCap = total;
                state.capProfit = 0;
                state.buckets.scalp = total * 0.40;
                state.buckets.smart = total * 0.39;
                state.buckets.moon = total * 0.21;
                smartNotif("AUTO-COMPOUND SUCCESSFUL.");
            }
        }, 60000);

        // --- 4. RANK & XP SYSTEM ---
        function updateXP(amount) {
            state.xp += amount;
            document.getElementById('rank-badge').innerText = `${state.xp} XP`;
            if(state.xp >= 150) {
                state.rank = 'Elite Master';
                document.getElementById('rank-badge').classList.add('bg-emerald-500');
                document.getElementById('execute-all-btn').classList.remove('hidden');
            }
        }

        function handleCardAction(id, type) {
            const card = state.cards.find(c => c.id === id);
            if(type === 'TP') {
                updateXP(10); // Tambah 10 XP setiap TP
                // Smart Trailing Stop Logic (Simulasi)
                smartNotif(`Trailing Stop Executed on ${card.name}`);
            }
            // ... (Logic execution tetap sama)
        }

        // [Fungsi RenderUI & Utils Tetap Digunakan]
    </script>
</body>
</html>
