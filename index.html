<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD SUPREME</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700;900&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --rose: #f43f5e; --violet: #8b5cf6; --glass: rgba(10, 10, 18, 0.98); }
        
        * { font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; }
        body { background: #010204; color: #e2e8f0; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        
        /* Layout Utama */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255, 215, 0, 0.1); border-radius: 1.5rem; }
        .m-grad { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); }
        
        /* Grid 3 Kolom - Dibuat Melebar & Seimbang */
        .titan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; padding: 0 1.5rem; flex: 1; overflow: hidden; margin-bottom: 100px; }
        .column-box { background: rgba(255, 255, 255, 0.02); border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; height: 100%; }
        .column-header { text-align: center; padding: 1.2rem; border-bottom: 1px solid rgba(255, 215, 0, 0.1); font-weight: 900; letter-spacing: 0.2em; font-size: 11px; position: relative; }
        .column-content { flex: 1; overflow-y: auto; padding: 1rem; scrollbar-width: none; }
        .column-content::-webkit-scrollbar { display: none; }

        /* Card Design - Melebar & Jelas */
        .premium-card { background: rgba(255, 255, 255, 0.04); border-radius: 1.2rem; border: 1px solid rgba(255, 255, 255, 0.08); padding: 1.2rem; margin-bottom: 1rem; transition: 0.3s; width: 100%; }
        .mini-chart-box { height: 70px; width: 100%; margin: 10px 0; }
        
        /* Notifikasi Mengambang */
        .floating-msg { position: fixed; top: 120px; right: 25px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 15px 25px; border-radius: 12px; border-left: 5px solid var(--gold); font-size: 12px; animation: slideIn 0.4s ease-out; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        @keyframes slideIn { from { transform: translateX(150%); } to { transform: translateX(0); } }

        /* Scanning & Auth */
        #f-scan { position: fixed; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .v-box { width: 280px; height: 280px; border: 4px solid var(--violet); border-radius: 50%; overflow: hidden; position: relative; }
        .v-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--violet); animation: scan 2s infinite linear; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        .hot-zone { border: 2px solid var(--rose) !important; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0%, 100% { box-shadow: 0 0 5px var(--rose); } 50% { box-shadow: 0 0 20px var(--rose); } }
    </style>
</head>
<body onmousedown="rAct()">

    <audio id="s-ching" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>
    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[5000] bg-[#010204] flex items-center justify-center p-6 text-center">
        <div class="w-full max-w-sm glass-premium p-10 border-white/5">
            <i class="fa-solid fa-eye text-6xl text-yellow-500 mb-6 animate-pulse"></i>
            <h2 class="titan-font text-3xl text-white mb-10">TITAN <span class="text-yellow-500">V13</span></h2>
            <div class="space-y-4">
                <input type="tel" id="u-phone" placeholder="TELEGRAM PHONE" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white font-bold outline-none focus:border-yellow-500">
                <input type="password" id="u-pass" placeholder="ACCESS KEY" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white font-bold outline-none focus:border-yellow-500">
                <button onclick="doLgn()" class="w-full py-6 m-grad rounded-3xl titan-font text-[10px] uppercase text-white shadow-2xl active:scale-95 transition-all">Initialize Authority</button>
            </div>
        </div>
    </div>

    <div id="f-scan">
        <div class="v-box"><video id="v-cam" class="w-full h-full object-cover grayscale" autoplay playsinline></video><div class="v-line"></div></div>
        <h3 class="titan-font text-white mt-10 uppercase text-xs animate-pulse tracking-widest">Biometric Identity Sync...</h3>
    </div>

    <div id="app" class="hidden app-container">
        <header class="p-6 flex justify-between items-center bg-black/40 border-b border-white/5 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl m-grad flex items-center justify-center titan-font font-black italic shadow-lg">T</div>
                <div>
                    <h1 class="titan-font text-xl font-black italic tracking-tighter">TITAN <span class="text-yellow-500">V13</span></h1>
                    <p id="rank-badge" class="text-[8px] font-black text-emerald-500 uppercase tracking-widest">Standard Member</p>
                </div>
            </div>
            <div class="flex gap-4 items-center">
                <div class="px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-[10px] font-black">
                    <span id="idle-val" class="text-rose-500">300s</span>
                </div>
                <button onclick="lOut()" class="text-rose-500 bg-rose-500/10 p-3 rounded-xl border border-rose-500/20"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </header>

        <div class="px-6 py-6">
            <div class="glass-premium p-6 border-white/5">
                <div class="grid grid-cols-2 gap-8 mb-4">
                    <div>
                        <p class="text-[9px] opacity-40 uppercase font-black mb-1">Capital Portfolio (IDR)</p>
                        <input type="number" id="base-input" onchange="uMdl()" class="bg-transparent text-2xl titan-font font-black w-full text-white outline-none" value="1000000">
                    </div>
                    <div class="text-right">
                        <p class="text-[9px] opacity-40 uppercase font-black mb-1">Total Realized P&L</p>
                        <p id="v-pl" class="text-2xl titan-font font-black text-emerald-400">Rp 0</p>
                    </div>
                </div>
                <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden">
                    <div id="g-bar" class="h-full m-grad transition-all duration-1000" style="width:0%"></div>
                </div>
                <div class="flex justify-between mt-2 text-[8px] font-black opacity-40 uppercase">
                    <span>Daily Progress 10%</span>
                    <span id="g-perc">0%</span>
                </div>
            </div>
        </div>

        <div class="titan-grid">
            <div class="column-box">
                <div class="column-header titan-font text-yellow-500">MATA DEWA</div>
                <div id="col-active" class="column-content"></div>
            </div>
            <div class="column-box">
                <div class="column-header titan-font text-emerald-400">
                    EXECUTE 
                    <button onclick="sellAll()" class="absolute right-4 top-4 text-rose-500 animate-pulse"><i class="fa-solid fa-fire"></i></button>
                </div>
                <div id="col-exec" class="column-content"></div>
            </div>
            <div class="column-box">
                <div class="column-header titan-font text-violet-400">HISTORY</div>
                <div id="col-hist" class="column-content"></div>
            </div>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 bg-black/95 border-t border-white/5 p-6 flex justify-between items-center z-[2000] backdrop-blur-xl">
            <button onclick="exportExcel()" class="text-2xl text-emerald-500 opacity-50 hover:opacity-100 transition-all"><i class="fa-solid fa-file-excel"></i></button>
            <div class="flex gap-16 text-center">
                <div><p class="text-[8px] opacity-40 font-black">ACTIVE</p><p id="c-b" class="text-2xl titan-font font-black text-yellow-500">0</p></div>
                <div><p class="text-[8px] opacity-40 font-black">NETWORK</p><p id="q-val" class="text-2xl titan-font font-black text-violet-400">0/1100</p></div>
            </div>
            <button onclick="smartNotif('Network Synchronized')" class="text-2xl text-yellow-500"><i class="fa-solid fa-eye"></i></button>
        </nav>
    </div>

    <div id="p-over" class="fixed inset-0 z-[20000] bg-black/98 hidden flex items-center justify-center p-8 backdrop-blur-3xl">
        <div class="glass-premium p-10 w-full max-w-xs border-yellow-500/20 text-center shadow-2xl">
            <h3 class="titan-font text-lg text-yellow-500 mb-2 uppercase italic">Elite Authorization</h3>
            <p id="p-tmr" class="text-[10px] text-rose-500 font-black mb-8">Valid: 05:00</p>
            <input type="password" id="p-in" maxlength="6" placeholder="••••••" class="bg-white/5 border border-white/10 p-5 rounded-3xl text-center text-4xl titan-font font-black w-full text-white outline-none focus:border-yellow-500">
            <button onclick="vPin()" class="w-full py-5 mt-6 m-grad rounded-3xl font-black text-[10px] uppercase text-white shadow-xl active:scale-95">Verify Authority</button>
            <button onclick="clPin()" class="mt-6 text-[10px] font-black uppercase text-white/30">Abort</button>
        </div>
    </div>

    <script>
        const MASTER_NUM = "081241955337", MASTER_KEY = "MahadhareV13Master";
        let lAct = Date.now(), tRem = 300, tInt = null;
        let state = JSON.parse(localStorage.getItem('t_state')) || { 
            memCount: 0, sigs: {}, hist: [], 
            ledg: { p: 0, d: 0, b: 1000000, xp: 0 } 
        };

        function save() { localStorage.setItem('t_state', JSON.stringify(state)); }
        function rAct() { lAct = Date.now(); }
        function formatIDR(v) { return new Intl.FormatNumber('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v); }

        function smartNotif(m, u = false) {
            const area = document.getElementById('notif-area'), el = document.createElement('div');
            el.className = 'floating-msg titan-font text-yellow-500';
            el.innerHTML = `<i class="fa-solid fa-bolt mr-3"></i> ${m}`;
            area.appendChild(el); if(u) document.getElementById('s-ching').play();
            setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(30px)'; setTimeout(()=>el.remove(), 400); }, 4000);
        }

        async function startEngine() {
            try {
                const r = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=50&sparkline=true`);
                const data = await r.json();
                proc(data); renColumns(data);
            } catch(e) { console.error("Sync Error"); }
            setTimeout(startEngine, 10000);
        }

        function proc(data) {
            if(state.ledg.d >= 10) return;
            data.forEach(c => {
                const prices = c.sparkline_in_7d.price, cp = c.current_price;
                const rsi = (prices.slice(-15).reduce((a,b)=>a+b,0) / 15) < cp ? 40 : 30; // Simple RSI Simulation

                if(!state.sigs[c.id] && rsi < 35) {
                    state.sigs[c.id] = { id: c.id, sym: c.symbol.toUpperCase(), ent: cp, lastPrice: cp, max: cp, status: 'ANALYSIS', img: c.image, spark: prices.slice(-20) };
                }
                if(state.sigs[c.id]) {
                    let s = state.sigs[c.id];
                    s.lastPrice = cp; s.max = Math.max(s.max, cp);
                    if(s.status === 'EXEC') {
                        if(cp <= s.max * 0.985) finSell(c.id, "TRAILING STOP", cp);
                        else if(cp <= s.ent * 0.97) finSell(c.id, "AUTO STOP LOSS", cp);
                    }
                }
            });
            save();
        }

        function sellAll() {
            const active = Object.keys(state.sigs).filter(id => state.sigs[id].status === 'EXEC');
            if(active.length === 0) return smartNotif("No active positions");
            if(confirm("PANIC SELL ALL?")) {
                active.forEach(id => finSell(id, "PANIC SELL", state.sigs[id].lastPrice));
                smartNotif("All Positions Liquidated", true);
            }
        }

        function finSell(id, type, cp) {
            if(!state.sigs[id]) return;
            const s = state.sigs[id], gain = ((cp - s.ent)/s.ent)*100, profitVal = (gain/100) * (state.ledg.b * 0.1);
            state.ledg.p += profitVal; state.ledg.d = (state.ledg.p / state.ledg.b) * 100; state.ledg.xp += 15;
            state.hist.unshift({...s, type, gain, exit: cp, profit: profitVal, finalTime: new Date().toLocaleTimeString()});
            document.getElementById('s-ching').play(); delete state.sigs[id]; save(); uUI();
        }

        function renColumns(data) {
            const colA = document.getElementById('col-active'), colE = document.getElementById('col-exec'), colH = document.getElementById('col-hist');
            colA.innerHTML = ''; colE.innerHTML = ''; colH.innerHTML = '';
            
            const activeSigs = Object.values(state.sigs).filter(x => x.status === 'ANALYSIS');
            if(activeSigs.length > 0) {
                const isElite = state.ledg.xp >= 150, btn = document.createElement('button');
                btn.onclick = execAll;
                btn.className = `w-full py-4 mb-4 rounded-2xl titan-font text-[9px] text-white ${isElite ? 'm-grad animate-pulse shadow-xl' : 'bg-white/10 opacity-40'}`;
                btn.innerHTML = isElite ? `<i class="fa-solid fa-crown mr-2"></i> EXECUTE ALL` : `<i class="fa-solid fa-lock mr-2"></i> ELITE MASTER ONLY`;
                colA.appendChild(btn);
            }
            activeSigs.forEach(s => colA.appendChild(createCard(s, data, 'active')));
            Object.values(state.sigs).filter(x => x.status === 'EXEC').forEach(s => colE.appendChild(createCard(s, data, 'exec')));
            state.hist.slice(0, 10).forEach(s => colH.appendChild(createCard(s, data, 'hist')));
        }

        function createCard(s, data, type) {
            const live = data.find(x => x.id === s.id), cp = live ? live.current_price : (s.exit || s.ent), pnl = ((cp - s.ent)/s.ent)*100;
            const el = document.createElement('div');
            el.className = `premium-card shadow-lg ${pnl >= 4 ? 'hot-zone' : ''}`;
            el.innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex gap-4 items-center">
                        <img src="${s.img}" class="w-10 h-10 rounded-full border border-white/10">
                        <div>
                            <p class="titan-font text-xs font-black text-white">${s.sym}</p>
                            <p class="text-[9px] text-yellow-500/60 font-black mt-1 uppercase">IDR ${cp.toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="titan-font text-sm font-black ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-500'}">
                            ${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}%
                        </p>
                    </div>
                </div>
                <div class="mini-chart-box"><canvas id="chart-${type}-${s.id}-${s.finalTime || ''}"></canvas></div>
                ${type === 'active' ? `<button onclick="initLock('${s.id}')" class="w-full py-3 mt-2 rounded-2xl titan-font text-[9px] bg-yellow-500 text-black font-black hover:bg-white transition-all">LOCK SIGNAL</button>` : ''}
                ${type === 'exec' ? `
                    <div class="grid grid-cols-2 gap-3 mt-2">
                        <button onclick="finSell('${s.id}', 'TP', ${cp})" class="py-3 rounded-2xl bg-emerald-500 text-black titan-font text-[8px] font-black">TP</button>
                        <button onclick="finSell('${s.id}', 'SL', ${cp})" class="py-3 rounded-2xl bg-rose-500 text-white titan-font text-[8px] font-black">SL</button>
                    </div>` : ''}
                ${type === 'hist' ? `<p class="text-[7px] text-center opacity-40 font-black mt-2 uppercase tracking-widest">${s.type} @ ${s.finalTime}</p>` : ''}
            `;
            setTimeout(() => drawMiniChart(`chart-${type}-${s.id}-${s.finalTime || ''}`, s.spark, pnl >= 0), 50);
            return el;
        }

        function drawMiniChart(id, spark, profit) { 
            const canvas = document.getElementById(id); if(!canvas) return;
            new Chart(canvas.getContext('2d'), { type: 'line', data: { labels: spark.map((_,i)=>i), datasets: [{ data: spark, borderColor: profit ? '#10b981' : '#f43f5e', borderWidth: 2, tension: 0.4, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } }); 
        }

        async function doLgn() {
            const ph = document.getElementById('u-phone').value, ps = document.getElementById('u-pass').value;
            if(ph === MASTER_NUM || ps === MASTER_KEY) return lgnOk(ph);
            const ud = JSON.parse(localStorage.getItem(`u_${ph}`));
            if(ud && ud.p === ps) lgnOk(ph); else startBiometric(ph, ps);
        }

        async function startBiometric(ph, ps) {
            const scan = document.getElementById('f-scan'), cam = document.getElementById('v-cam');
            scan.style.display = 'flex';
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true }); cam.srcObject = stream;
                setTimeout(() => { 
                    state.memCount++; localStorage.setItem(`u_${ph}`, JSON.stringify({p:ps, xp:0})); 
                    stream.getTracks().forEach(t => t.stop()); scan.style.display = 'none'; lgnOk(ph); 
                }, 4000);
            } catch(e) { scan.style.display='none'; smartNotif("Camera Access Denied", true); }
        }

        function lgnOk(ph) { 
            localStorage.setItem('t_sess', ph); 
            document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); 
            uUI(); startEngine(); smartNotif("System Initialized");
        }

        function initLock(id) { state.sigs[id].status = 'EXEC'; document.getElementById('p-over').classList.remove('hidden'); startTmr(); }
        function startTmr() { tRem = 300; clearInterval(tInt); tInt = setInterval(() => { tRem--; document.getElementById('p-tmr').innerText = `Valid: ${Math.floor(tRem/60)}:${(tRem%60).toString().padStart(2,'0')}`; if(tRem <= 0) clPin(); }, 1000); }
        function vPin() { clPin(); smartNotif("Authority Verified"); }
        function clPin() { clearInterval(tInt); document.getElementById('p-over').classList.add('hidden'); }
        function uMdl() { state.ledg.b = parseInt(document.getElementById('base-input').value); save(); uUI(); }
        function uUI() {
            document.getElementById('v-pl').innerText = "Rp " + Math.floor(state.ledg.p).toLocaleString(); 
            document.getElementById('g-perc').innerText = Math.floor(state.ledg.d) + "%"; 
            document.getElementById('g-bar').style.width = Math.min(state.ledg.d * 10, 100) + "%";
            document.getElementById('q-val').innerText = state.memCount + "/1100"; 
            document.getElementById('c-b').innerText = Object.values(state.sigs).filter(x => x.status === 'EXEC').length;
            const rank = document.getElementById('rank-badge');
            if(state.ledg.xp >= 150) rank.innerText = "ELITE MASTER 🎖️";
            save();
        }

        function execAll() {
            if (state.ledg.xp < 150) return;
            Object.values(state.sigs).forEach(s => { if(s.status === 'ANALYSIS') s.status = 'EXEC'; });
            window.open("https://indodax.onelink.me/qyYY/referral?deep_link_value=page:register,id:marselsalmon", '_blank');
            save(); uUI();
        }

        function lOut() { localStorage.removeItem('t_sess'); location.reload(); }
        function exportExcel() { const ws = XLSX.utils.json_to_sheet(state.hist); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "History"); XLSX.writeFile(wb, "TITAN_V13_Report.xlsx"); }
        
        setInterval(() => {
            const idle = (Date.now() - lAct) / 1000;
            const rem = Math.max(0, 300 - Math.floor(idle));
            document.getElementById('idle-val').innerText = rem + "s";
            if (idle >= 300) lOut();
        }, 1000);

        window.onload = () => { if(localStorage.getItem('t_sess')) lgnOk(localStorage.getItem('t_sess')); };
    </script>
</body>
</html>
