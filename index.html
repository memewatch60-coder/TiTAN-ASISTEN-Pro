<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    
    <meta name="theme-color" content="#020308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; user-select: none; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Animasi Blink Eksekusi */
        .blink-execute { animation: blink-gold 2s infinite; border: 1px solid var(--gold) !important; }
        @keyframes blink-gold { 0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(255,215,0,0.2); } 50% { opacity: 0.7; box-shadow: 0 0 25px rgba(255,215,0,0.5); } }
        
        /* Custom Modal & Toast */
        .modal-overlay { position: fixed; inset: 0; z-index: 10002; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .toast-premium { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10001; background: rgba(10,10,18,0.95); border: 1px solid var(--gold); padding: 15px 25px; border-radius: 12px; animation: slideDown 0.4s ease; }
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }

        #face-video { width: 100%; height: 180px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <div class="w-24 h-24 glass-premium flex items-center justify-center border-2 border-yellow-500 mx-auto mb-6 shadow-[0_0_30px_rgba(255,215,0,0.2)]">
                <i class="fa-solid fa-crown text-5xl text-yellow-500"></i>
            </div>
            <h1 class="titan-font text-2xl text-yellow-500 mb-10 tracking-[5px] uppercase">Titan V.13</h1>
            
            <div id="auth-box" class="space-y-4">
                <input type="text" id="auth-phone" placeholder="NOMOR TELEGRAM" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none focus:border-yellow-500 text-white">
                <div id="biometric-mod" class="hidden">
                    <video id="face-video" class="hidden" autoplay muted playsinline></video>
                    <button onclick="startFaceScan()" class="w-full py-4 bg-blue-600 rounded-xl text-[10px] titan-font mb-4 uppercase shadow-lg">Scan Wajah (Biometric)</button>
                </div>
                <input type="password" id="auth-pass" placeholder="MASTER PASSWORD" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none focus:border-yellow-500 text-white">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="handleAuth()" class="py-4 bg-yellow-500 text-black rounded-xl titan-font font-black uppercase shadow-lg">Login</button>
                    <button onclick="toggleRegister()" class="py-4 bg-white/5 border border-white/10 text-white rounded-xl titan-font text-[10px] uppercase">Daftar</button>
                </div>
            </div>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-black border-b border-white/5 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="bg-white/5 p-2 px-4 rounded-2xl flex items-center gap-2 border border-white/10">
                <div id="mode-dot" class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <span id="mode-text" class="titan-font text-[9px] uppercase text-white">Standard Mode</span>
            </div>
            <button id="master-switch-btn" onclick="masterStatusToggle()" class="hidden bg-yellow-500/20 text-yellow-500 p-2 px-4 rounded-xl text-[9px] titan-font border border-yellow-500/30">MASTER SWITCH</button>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="showTutorial()"><i class="fa-solid fa-book-open text-xl text-yellow-500"></i></button>
            <button onclick="saveAndExit()"><i class="fa-solid fa-power-off text-xl text-rose-500"></i></button>
        </div>
    </header>

    <main class="h-full overflow-y-auto no-scrollbar pb-40">
        <section class="p-5">
            <div class="glass-premium p-6 relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-[8px] uppercase font-black opacity-40 tracking-widest text-white/50">Equity (Auto-Compound)</p>
                    <div id="roadmap-box" class="text-right hidden">
                        <p class="text-[7px] text-emerald-400 font-black titan-font uppercase">ROADMAP LEVEL 3</p>
                        <p id="expiry-timer" class="text-[8px] text-blue-400 font-bold titan-font">180 DAYS LEFT</p>
                    </div>
                </div>
                <h2 id="cap-main" class="titan-font text-4xl text-yellow-500 font-black mb-6 tracking-tighter elite-glow">Rp 0</h2>
                
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[6px] opacity-40 mb-1 uppercase text-white/50">Scalp (40%)</p>
                        <p id="b-scalp" class="text-[9px] font-black text-emerald-400 font-mono">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[6px] opacity-40 mb-1 uppercase text-white/50">Smart (40%)</p>
                        <p id="b-smart" class="text-[9px] font-black text-blue-400 font-mono">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[6px] opacity-40 mb-1 uppercase text-white/50">Moon (20%)</p>
                        <p id="b-moon" class="text-[9px] font-black text-violet-400 font-mono">Rp 0</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="px-5">
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <h3 class="titan-font text-[9px] text-yellow-500 mb-4 uppercase text-center font-black tracking-widest">Radar Mata Dewa</h3>
                    <div id="list-analysis" class="space-y-4"></div>
                </div>
                <div>
                    <h3 class="titan-font text-[9px] text-blue-500 mb-2 uppercase text-center font-black tracking-widest">Execution Room</h3>
                    <p id="slot-indicator" class="text-center text-[7px] opacity-40 titan-font mb-4">SLOTS: 0/10</p>
                    <div id="list-execution" class="space-y-4"></div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="titan-font text-[9px] text-emerald-500 uppercase font-black tracking-widest">History Vault</h3>
                        <button id="excel-btn" onclick="exportExcel()" class="hidden text-[7px] bg-emerald-500 text-black px-2 py-0.5 rounded font-black uppercase">XLSX</button>
                    </div>
                    <div id="list-history" class="space-y-3"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-5 bg-black border-t border-white/5 z-50">
        <div class="flex justify-around items-center max-w-md mx-auto relative">
            <button onclick="openExternal('IDX')" class="flex flex-col items-center gap-1"><i class="fa-solid fa-wallet text-xl text-yellow-500"></i><span class="text-[7px] font-black uppercase opacity-40">Indodax</span></button>
            <button onclick="openExternal('TG')" id="tg-btn" class="flex flex-col items-center gap-1 text-sky-400 opacity-30"><i class="fa-brands fa-telegram text-xl"></i><span class="text-[7px] font-black uppercase">Group</span></button>
            <div onclick="smartScanTrigger()" class="w-14 h-14 bg-yellow-500 rounded-full flex items-center justify-center -mt-10 shadow-[0_0_30px_rgba(255,215,0,0.4)] border-8 border-[#020308]"><i class="fa-solid fa-bolt-lightning text-black text-xl"></i></div>
            <button onclick="openExternal('JU')" class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-rocket text-xl"></i><span class="text-[7px] font-black uppercase">Jupiter</span></button>
            <button onclick="openExternal('GA')" class="flex flex-col items-center gap-1 text-blue-400"><i class="fa-solid fa-globe text-xl"></i><span class="text-[7px] font-black uppercase">Gate.io</span></button>
        </div>
    </footer>

    <div id="modal-vault" class="modal-overlay hidden">
        <div class="glass-premium p-10 w-full max-w-sm text-center">
            <i class="fa-solid fa-vault text-3xl text-yellow-500 mb-4"></i>
            <h3 class="titan-font text-xs text-yellow-500 mb-2 uppercase">Initial Capital Setup</h3>
            <p class="text-[8px] opacity-40 mb-6 text-white/50">Input modal riil dompet Indodax Anda (Satu kali sebulan untuk Elite)</p>
            <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-4 rounded-xl mb-6 titan-font text-xl text-center text-yellow-500 border border-white/10 outline-none">
            <button onclick="finalizeCapital()" class="w-full py-4 bg-yellow-500 text-black rounded-xl titan-font text-[10px] uppercase font-black">Aktivasi Engine</button>
        </div>
    </div>
</div>

<script>
(function() {
    // --- Master Encryption (Base64) ---
    const SECRETS = {
        BT: "ODI5NTYwNzcwNDpBQUZkeV9VOGJGTC14Mk9sOTBuOGYyS0RPSHp0eWJjdWo0",
        CI: "LTEwMDMyNTQzNzkzMzM=",
        MK: "TWFoYWRoYXJlVjEzTWFzdGVy",
        TG: "aHR0cHM6Ly90Lm1lLys4dUpmOFQ0VkRISmtPVEZs",
        JU: "aHR0cHM6Ly9qdW8uYWcvP3JlZklkPXl1ZjBkaDRpbDF4cw==",
        GA: "aHR0cHM6Ly9hcHAubWJtMDYuY29tL3JlZmVycmFsL2Vhcm4tdG9nZXRoZXIvaW52aXRlL0JGWkZWbFlY",
        IDX: "aHR0cHM6Ly9pbmRvZGF4Lm9uZWxpbmsubWUvcXlZWS9yZWZlcnJhbD9kZWVwX2xpbmtfdmFsdWU9cGFnZTpyZWdpc3RlcixpZDptYXJzZWxzYWxtb24="
    };
    function decode(k) { return atob(SECRETS[k]); }

    // --- State Management ---
    let saved = JSON.parse(localStorage.getItem('titan_v13_final_state'));
    let state = saved || {
        status: 'STANDART', initCap: 0, capProfit: 0, 
        streak: 0, lastLoginDate: null, cards: [], log: [], 
        isMaster: false, lastFomo: 0, quota: { elite: 0, standart: 0 },
        regDate: Date.now(), checklist: { idx: false, tg: false }
    };

    // --- Security: Anti-Hack Guard ---
    setInterval(() => {
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20%'>EMERGENCY LOCKDOWN: SECURITY BREACH</h1>";
            localStorage.clear();
        }
    }, 1000);

    // --- Logic 5 Menit Auto-Logout ---
    let logoutTimer;
    function resetLogoutTimer() {
        clearTimeout(logoutTimer);
        logoutTimer = setTimeout(() => { saveAndExit(); }, 300000); // 5 Menit
    }
    window.addEventListener('mousemove', resetLogoutTimer);
    window.addEventListener('keypress', resetLogoutTimer);

    // --- Auth Logic ---
    window.handleAuth = function() {
        const ph = document.getElementById('auth-phone').value;
        const ps = document.getElementById('auth-pass').value;
        if (ps === decode('MK')) { 
            state.isMaster = true; state.status = 'ELITE'; 
            localStorage.setItem('perm_master', 'true');
            return enterApp(); 
        }
        // Biometric Recovery Logic
        if (state.failedAttempts >= 3) {
            document.getElementById('biometric-mod').classList.remove('hidden');
            return customAlert("BIOMETRIC REQUIRED", "3x Kegagalan login. Gunakan Scan Wajah untuk pemulihan.");
        }
        // Standard Auth check
        if (ph === localStorage.getItem('user_ph') && ps === localStorage.getItem('user_ps')) return enterApp();
        state.failedAttempts = (state.failedAttempts || 0) + 1;
        saveData();
        smartNotif("Login Gagal. Percobaan: " + state.failedAttempts + "/3");
    }

    window.startFaceScan = async function() {
        const vid = document.getElementById('face-video'); vid.classList.remove('hidden');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            vid.srcObject = stream;
            smartNotif("Scanning Biometric Identitas...");
            setTimeout(() => {
                state.failedAttempts = 0; vid.classList.add('hidden');
                stream.getTracks().forEach(t => t.stop());
                customAlert("IDENTITY VERIFIED", "Pemulihan akun berhasil. Silakan login kembali.");
                saveData();
            }, 3000);
        } catch (e) { customAlert("SCAN FAILED", "Akses kamera ditolak atau gagal."); }
    }

    // --- Mata Dewa Engine (Dual API) ---
    async function startEngine() {
        try {
            // Indodax API for Core Coins
            const idxRes = await fetch('https://indodax.com/api/summaries');
            const idxData = await idxRes.json();
            
            // CoinGecko for Meme Coins
            const cgRes = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=50&sparkline=true');
            const cgData = await cgRes.json();
            
            processMarkets(idxData, cgData);
        } catch (e) { console.warn("Syncing Data..."); }
        setTimeout(startEngine, 8000);
    }

    function processMarkets(idx, cg) {
        cg.forEach(coin => {
            let card = state.cards.find(c => c.coinId === coin.id);
            if (card) {
                card.current = coin.current_price;
                card.sparkline = coin.sparkline_in_7d.price.slice(-10);
                if (card.current > card.high) card.high = card.current;
                
                // TSL Guard 2% (Elite Only)
                if (state.status === 'ELITE' && (card.high - card.current) / card.high >= 0.02) handleAction(card.id, "TSL");
            } else if (Math.random() > 0.92 && state.cards.length < 15) {
                const rsi = Math.floor(Math.random() * 50) + 15;
                state.cards.push({
                    id: Date.now() + Math.random(), coinId: coin.id, name: coin.symbol.toUpperCase(),
                    entry: coin.current_price, current: coin.current_price, high: coin.current_price,
                    img: coin.image, status: 'ANALYSIS', rsi: rsi, sparkline: coin.sparkline_in_7d.price.slice(-10),
                    strat: rsi < 25 ? 'MOONSHOT' : (Math.random() > 0.5 ? 'SCALP' : 'SMART')
                });
            }
        });
        renderUI();
    }

    // --- Trading Logic & Auto-Compound ---
    window.handleAction = function(id, trigger) {
        const card = state.cards.find(c => c.id === id);
        if (!card) return;

        if (card.status === 'ANALYSIS') {
            // Batasan Profit Harian
            const limit = (state.status === 'ELITE' ? 0.10 : 0.05);
            if (state.capProfit / (state.initCap || 1) >= limit) return customAlert("TARGET REACHED", `Target harian ${limit*100}% tercapai. Tombol Lock dimatikan.`);
            
            if (state.cards.filter(c => c.status === 'EXECUTION').length >= 10) return smartNotif("Slot Eksekusi Penuh (10/10)");
            
            card.status = 'EXECUTION';
            card.stake = state.initCap * 0.10; // Nominal Stake 10%
            notifyTelegram(`🛰 LOCK: $${card.name}\nStake: ${formatIDR(card.stake)}\nStatus: ${state.status}`, true);
        } else {
            const pnl = ((card.current / card.entry) - 1);
            const profit = card.stake * pnl;
            
            state.capProfit += profit;
            state.initCap += profit; // AUTO-COMPOUND
            state.log.push({ asset: card.name, profit: profit, time: new Date().toLocaleTimeString() });
            
            // Check Misi Elite (5% Streak)
            if (state.status === 'STANDART') checkEliteMissions(pnl);

            state.cards = state.cards.filter(c => c.id !== id);
            
            const msg = `🚨 EMERGENCY EXIT: $${card.name}\nProfit: ${formatIDR(profit)}\nStatus: ${trigger || 'MANUAL'}`;
            notifyTelegram(msg, true); // Group
            if(state.status === 'ELITE') notifyTelegram(msg, false); // DM Pribadi
        }
        saveData(); renderUI();
    }

    // --- Logic Misi & Checklist Aktivasi ---
    function checkEliteMissions(pnl) {
        const todayProfitPercent = state.capProfit / state.initCap;
        if (todayProfitPercent >= 0.05) {
            state.streak = (state.streak || 0) + 1;
            smartNotif(`MISI HARI KE-${state.streak} SELESAI!`);
            if (state.streak >= 7) showEliteChecklist();
        }
    }

    function showEliteChecklist() {
        const modal = document.createElement('div');
        modal.className = "modal-overlay";
        modal.innerHTML = `
            <div class="glass-premium p-10 w-full max-w-sm border-yellow-500/50 text-center animate-bounce-short">
                <h2 class="titan-font text-yellow-500 text-lg mb-4">SERTIFIKAT KELULUSAN DIGITAL</h2>
                <p class="text-[9px] opacity-60 mb-8">Anda telah menyelesaikan misi profit 5% selama 7 hari. Aktifkan status Elite Anda sekarang.</p>
                <div class="space-y-4 mb-10 text-left">
                    <label class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10 cursor-pointer">
                        <input type="checkbox" id="check-idx" class="accent-yellow-500 w-5 h-5">
                        <span class="text-[8px] uppercase">Buka Dompet Indodax (Link Reff Master)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-white/5 rounded-xl border border-white/10 cursor-pointer">
                        <input type="checkbox" id="check-tg" class="accent-yellow-500 w-5 h-5">
                        <span class="text-[8px] uppercase">Gabung Group Telegram Master</span>
                    </label>
                </div>
                <button onclick="activateEliteStatus()" class="w-full py-5 bg-yellow-500 text-black rounded-2xl titan-font text-[11px] uppercase font-black shadow-2xl">AKTIVASI MODE RIIL (ELITE)</button>
            </div>
        `;
        document.body.appendChild(modal);
    }

    window.activateEliteStatus = function() {
        if(!document.getElementById('check-idx').checked || !document.getElementById('check-tg').checked) {
            return smartNotif("Wajib checklist semua syarat aktivasi!");
        }
        state.status = 'ELITE';
        state.eliteJoinDate = Date.now();
        saveData(); location.reload();
    }

    // --- UI & Rendering ---
    function renderUI() {
        const isElite = (state.status === 'ELITE');
        document.getElementById('cap-main').innerText = formatIDR(state.capProfit);
        document.getElementById('b-scalp').innerText = formatIDR(state.initCap * 0.4);
        document.getElementById('b-smart').innerText = formatIDR(state.initCap * 0.4);
        document.getElementById('b-moon').innerText = formatIDR(state.initCap * 0.2);
        
        document.getElementById('mode-text').innerText = `${state.status} MODE`;
        document.getElementById('mode-dot').className = `w-2 h-2 rounded-full ${isElite ? 'bg-yellow-500 animate-pulse' : 'bg-emerald-500'}`;
        document.getElementById('excel-btn').classList.toggle('hidden', !isElite);
        document.getElementById('roadmap-box').classList.toggle('hidden', !isElite);
        document.getElementById('tg-btn').classList.toggle('opacity-100', isElite);
        document.getElementById('slot-indicator').innerText = `Slots: ${state.cards.filter(c => c.status === 'EXECUTION').length}/10`;

        const aDiv = document.getElementById('list-analysis');
        const eDiv = document.getElementById('list-execution');
        aDiv.innerHTML = ''; eDiv.innerHTML = '';

        state.cards.forEach(c => {
            const pnl = ((c.current / c.entry) - 1) * 100;
            const cardStyle = isElite ? 'glass-premium border-yellow-500/20' : 'bg-white/5 border-white/10';
            const html = `
                <div class="p-4 rounded-2xl border transition-all ${cardStyle} ${c.status === 'EXECUTION' ? 'blink-execute' : ''}">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-black text-[9px] uppercase tracking-tighter">${c.name}/IDR</span>
                        <img src="${c.img}" class="w-4 h-4 rounded-full">
                    </div>
                    <div class="text-center py-2">
                        <p class="${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'} font-black text-xs">${pnl.toFixed(2)}%</p>
                        <p class="text-[7px] opacity-40 uppercase">Stake: ${formatIDR(state.initCap * 0.1)}</p>
                    </div>
                    <button onclick="handleAction(${c.id})" class="w-full py-2.5 bg-yellow-500 text-black text-[8px] font-black rounded-xl uppercase active:scale-95 shadow-lg">
                        ${c.status === 'ANALYSIS' ? 'Lock Signal' : (isElite ? 'Secure Profit' : 'Release')}
                    </button>
                </div>`;
            if (c.status === 'ANALYSIS') aDiv.innerHTML += html; else eDiv.innerHTML += html;
        });

        const hDiv = document.getElementById('list-history');
        hDiv.innerHTML = '';
        state.log.slice(-10).reverse().forEach(l => {
            hDiv.innerHTML += `<div class="p-2 rounded-lg flex justify-between items-center text-[7px] mb-2 bg-white/5 border-l-2 ${l.profit>=0?'border-emerald-500':'border-rose-500'} font-black">
                <span>${l.asset}</span><span>${formatIDR(l.profit)}</span>
            </div>`;
        });
    }

    // --- Tutorial & Panduan ---
    window.showTutorial = function() {
        const isElite = (state.status === 'ELITE');
        const modal = document.createElement('div');
        modal.className = "modal-overlay";
        modal.innerHTML = `
            <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 text-left">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="titan-font text-yellow-500 text-sm">${isElite?'ELITE MASTER PROTOCOL':'STANDARD PROTOCOL'}</h3>
                    <i class="fa-solid fa-book-open text-yellow-500 opacity-50"></i>
                </div>
                <div class="space-y-4 text-[9px] uppercase tracking-widest leading-relaxed text-white/80">
                    <p><span class="text-yellow-500 font-black">1. ANALISIS:</span> Mata Dewa memindai Indodax & CoinGecko setiap 8 detik.</p>
                    <p><span class="text-yellow-500 font-black">2. ALOKASI MODAL:</span> Scalp (40%), Smart (40%), Moonshot (20%). Tiap kartu max 10% modal.</p>
                    <p><span class="text-yellow-500 font-black">3. ELITE TSL:</span> Profit aman otomatis jika harga drop 2% dari puncak.</p>
                    <p><span class="text-yellow-500 font-black">4. ROADMAP:</span> Elite Level 3 aktif selama 180 hari.</p>
                </div>
                <button onclick="this.parentElement.parentElement.remove()" class="w-full mt-8 py-3 bg-yellow-500 text-black font-black text-[10px] rounded-xl uppercase">SISTEM DIMENGERTI</button>
            </div>
        `;
        document.body.appendChild(modal);
    }

    // --- Notifikasi & Telegram ---
    window.smartNotif = function(t) {
        const el = document.createElement('div'); el.className = "toast-premium titan-font text-yellow-500 text-[9px] font-black uppercase";
        el.innerHTML = `<i class="fa-solid fa-shield-halved mr-2"></i> ${t}`;
        document.getElementById('notif-area').appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    window.customAlert = function(title, msg) {
        const modal = document.createElement('div'); modal.className = "modal-overlay";
        modal.innerHTML = `<div class="glass-premium p-8 w-64 text-center border-yellow-500/40"><h4 class="titan-font text-yellow-500 text-xs mb-4 uppercase">${title}</h4><p class="text-[9px] mb-6 opacity-60">${msg}</p><button onclick="this.parentElement.parentElement.remove()" class="w-full py-3 bg-white/10 text-white text-[9px] rounded-lg">OK</button></div>`;
        document.body.appendChild(modal);
    }

    window.notifyTelegram = function(text, group) {
        const chat = group ? decode('CI') : localStorage.getItem('user_ph');
        fetch(`https://api.telegram.org/bot${decode('BT')}/sendMessage?chat_id=${chat}&text=${encodeURIComponent(text)}`);
    }

    // --- Auth Extras ---
    window.enterApp = function() {
        document.getElementById('auth-screen').style.display = 'none';
        if (state.isMaster || localStorage.getItem('perm_master') === 'true') {
            document.getElementById('master-switch-btn').classList.remove('hidden');
        }
        if (state.initCap === 0) document.getElementById('modal-vault').classList.remove('hidden');
        startEngine(); resetLogoutTimer();
    }

    window.finalizeCapital = function() {
        const val = parseInt(document.getElementById('vault-input').value);
        if (val < 1000000) return smartNotif("Minimal Modal Rp 1.000.000");
        state.initCap = val; state.capProfit = 0;
        document.getElementById('modal-vault').classList.add('hidden');
        saveData(); renderUI();
    }

    window.openExternal = (k) => { 
        if(k === 'TG' && state.status !== 'ELITE') return customAlert("ACCESS LOCKED", "Syarat Join Group hanya untuk member Elite.");
        window.open(decode(k), '_blank'); 
    }
    
    window.saveData = () => localStorage.setItem('titan_v13_final_state', JSON.stringify(state));
    window.saveAndExit = () => { saveData(); location.reload(); };
    window.formatIDR = (v) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v || 0);

    if (localStorage.getItem('user_ph')) enterApp();
    renderUI();
})();
</script>
</body>
</html>
