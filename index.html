<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Layout Tiga Kolom V13 */
        .titan-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 0 10px;
        }
        .column-title { text-align: center; font-size: 8px; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; font-weight: 900; opacity: 0.6; }

        /* Animasi Hot Zone (V13 Update) */
        .hot-zone-pulse { animation: hot-pulse 0.8s infinite cubic-bezier(0.4, 0, 0.6, 1); border: 2px solid #ff4444 !important; }
        @keyframes hot-pulse { 0%, 100% { background: rgba(255, 68, 68, 0.1); box-shadow: 0 0 5px rgba(255, 68, 68, 0.2); } 50% { background: rgba(255, 68, 68, 0.3); box-shadow: 0 0 20px rgba(255, 68, 68, 0.5); } }

        .blink-execute { animation: blink-gold 1s infinite; }
        @keyframes blink-gold { 0%, 100% { border-color: rgba(255,215,0,0.1); } 50% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); } }
        
        .floating-msg { position: fixed; top: 110px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); max-width: 220px; font-size: 9px; animation: slideIn 0.3s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        #face-video { width: 100%; height: 180px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; }
        canvas.mini-chart { height: 50px !important; width: 100% !important; }
    </style>
</head>
<body>

    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] overflow-y-auto p-6 flex flex-col items-center">
        <div class="w-full max-w-sm text-center mt-8">
            <h1 class="titan-font text-3xl text-yellow-500 mb-1 tracking-tighter">TITAN V.13</h1>
            <p class="text-[8px] tracking-[4px] opacity-50 mb-8 uppercase font-black">Mahadhare Gold Security</p>
            
            <div id="auth-box" class="space-y-4">
                <input type="text" id="auth-phone" placeholder="NOMOR TELEPON TELEGRAM (MASTER)" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
                <div id="reg-extra" class="hidden space-y-4">
                    <video id="face-video" class="hidden" autoplay muted playsinline></video>
                    <button onclick="startFaceScan()" id="scan-btn" class="w-full py-3 bg-blue-600 rounded-xl text-[10px] titan-font shadow-lg">BIOMETRIC SYNC (4 DETIK)</button>
                </div>
                <input type="password" id="auth-pass" placeholder="PASSWORD KOMPLEKS" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="handleAuth('LOGIN')" id="login-btn" class="py-4 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase">Login</button>
                    <button onclick="toggleAuth()" id="toggle-btn" class="py-4 bg-white/5 border border-white/10 text-white titan-font text-[10px] rounded-xl uppercase">Daftar</button>
                </div>
                <button onclick="masterBypass()" class="w-full py-2 text-[8px] opacity-20 uppercase tracking-[3px]">Master Access Protocol</button>
            </div>
        </div>
    </div>

    <div id="custom-alert" class="fixed inset-0 z-[10001] flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-xl"></div>
        <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 relative text-center">
            <div class="w-16 h-16 bg-yellow-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-yellow-500/20 text-yellow-500">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h3 class="titan-font text-[11px] text-white mb-2 uppercase tracking-widest">TITAN V13 NOTIFICATION</h3>
            <div id="alert-content" class="text-[10px] text-white/70 mb-6 leading-relaxed"></div>
            <button onclick="closeAlert()" class="w-full py-3 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl">KONFIRMASI</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-black/80 border-b border-yellow-500/10 backdrop-blur-lg sticky top-0 z-50">
        <div onclick="showRealModeCheck()" class="cursor-pointer bg-white/5 p-2 px-3 rounded-2xl flex items-center gap-2 border border-white/10">
            <div id="mode-dot" class="w-2 h-2 rounded-full bg-emerald-500 pulse-live"></div>
            <span id="mode-text" class="titan-font text-[9px] font-black uppercase">Standard Member</span>
            <span id="rank-badge" class="text-[7px] bg-yellow-500 text-black px-2 py-0.5 rounded font-black ml-1">XP: 0</span>
        </div>
        <div class="flex items-center gap-2">
            <span id="btc-guard" class="hidden text-[8px] bg-rose-600 text-white px-2 py-1 rounded titan-font">BTC GUARD ACTIVE</span>
            <button onclick="toggleLang()" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-xs">
                <span id="ui-flag">🇮🇩</span>
            </button>
            <button onclick="showHowItWorks()" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-xs">
                <i class="fa-solid fa-circle-info"></i>
            </button>
            <button onclick="location.reload()" class="text-rose-500 bg-rose-500/10 w-8 h-8 rounded-lg border border-rose-500/20">
                <i class="fa-solid fa-power-off text-sm"></i>
            </button>
        </div>
    </header>

    <main class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
        <section class="p-5">
            <div class="glass-premium p-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-5"><i class="fa-solid fa-microchip text-5xl"></i></div>
                <div class="flex justify-between items-start mb-2">
                    <p class="text-[8px] uppercase font-black opacity-40 tracking-[2px]">Capital Management (<span id="perc-stat">0%</span>)</p>
                    <p id="target-info" class="text-[8px] text-yellow-500 font-bold uppercase"></p>
                </div>
                <h2 id="cap-main" class="titan-font text-3xl text-yellow-500 font-black mb-4 tracking-tighter">Rp 0</h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Scalp (40%)</p>
                        <p id="b-scalp" class="text-[9px] font-bold text-emerald-400">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Smart (39%)</p>
                        <p id="b-smart" class="text-[9px] font-bold text-blue-400">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Moonshot (21%)</p>
                        <p id="b-moon" class="text-[9px] font-bold text-violet-400">Rp 0</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="titan-grid-container mt-4">
            <div>
                <div class="column-title">Analysis</div>
                <div id="list-analysis" class="space-y-3"></div>
            </div>
            
            <div>
                <div class="column-title">Execution</div>
                <div id="list-execution" class="space-y-3"></div>
            </div>

            <div>
                <div class="column-title">History</div>
                <div class="flex justify-center mb-2">
                    <button onclick="exportExcel()" class="text-[6px] bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 px-2 py-0.5 rounded uppercase font-bold">XLSX</button>
                </div>
                <div id="list-history" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-4 bg-black/95 border-t border-white/5 z-50">
        <div class="flex justify-around items-center max-w-md mx-auto relative">
            <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-ranking-star"></i><span class="text-[8px]">LIVE</span></button>
            <button id="tg-group-btn" class="flex flex-col items-center gap-1 text-sky-400"><i class="fa-brands fa-telegram text-2xl"></i><span class="text-[8px]">GROUP</span></button>
            <div id="execute-all-container" class="w-14 h-14 bg-yellow-500 rounded-full flex items-center justify-center -mt-10 shadow-lg shadow-yellow-500/30 border-8 border-[#020308] cursor-pointer" onclick="massExecute()">
                <i class="fa-solid fa-bolt text-black text-xl"></i>
            </div>
            <button class="flex flex-col items-center gap-1 text-emerald-400" onclick="alert('Sentiment AI Roadmap V14: Scraping X Tren...')">
                <i class="fa-solid fa-brain"></i><span class="text-[8px]">AI SCAN</span>
            </button>
            <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-shield-check"></i><span class="text-[8px]">SECURE</span></button>
        </div>
    </footer>

    <div id="modal-vault" class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-8 hidden backdrop-blur-2xl">
        <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/40 text-center">
            <i class="fa-solid fa-vault text-3xl text-yellow-500 mb-4"></i>
            <h3 class="titan-font text-sm text-yellow-500 mb-1 uppercase tracking-widest">Initial Vault</h3>
            <p id="vault-range-info" class="text-[8px] opacity-40 mb-8 uppercase tracking-widest">Allocation Logic 40:39:21 Active</p>
            <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-4 rounded-xl mb-8 titan-font text-2xl text-center text-yellow-500 border border-white/10 outline-none">
            <button onclick="finalizeCapital()" class="w-full py-5 bg-yellow-500 text-black font-black rounded-xl titan-font text-[10px] uppercase shadow-lg tracking-widest">Initialize System</button>
        </div>
    </div>

    <script>
        // --- SECURE MASTER CONFIG (V13) ---
        const MASTER_CONFIG = {
            BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4",
            CI: "-1003254379333",
            MK: "MahadhareV13Master",
            ADMIN_PH: "081241955337",
            TG: "https://t.me/+8uJ78T4VDHJkOTRl",
            REFF: {
                IDX: "https://indodax.onelink.me/qyYY/referral?deep_link_value=page:register,id:marselsalmon",
                GA: "https://app.mbm06.com/referral/...",
                JU: "https://jup.ag/?refId=yuf0dh4il1xs"
            }
        };

        let dbUsers = JSON.parse(localStorage.getItem('titan_db')) || {};
        let state = {
            authMode: 'LOGIN', xp: 0, rank: 'Standard Member',
            failed: 0, blocked: false, face: false,
            mode: 'TRAINING', target: 0.10, hack: 0,
            initCap: 0, capProfit: 0, buckets: { scalp: 0, smart: 0, moon: 0 },
            cards: [], log: [], btcDrop: false, goalReached: false,
            lang: 'ID'
        };

        // --- ANTI-BREACH (GATEKEEPER) ---
        window.addEventListener('keydown', (e) => {
            if(e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74))) {
                state.hack++;
                if(state.hack >= 3) {
                    localStorage.clear();
                    document.body.innerHTML = "<div style='color:red; text-align:center; padding-top:20%; font-family:Orbitron;'>SECURITY BREACH: DATA SELF-DESTRUCTED.</div>";
                    notifyTelegram("🚨 *CRITICAL:* DevTools Attempt. Access Revoked.");
                }
            }
        });

        // --- AUTH & BIOMETRIC ---
        function toggleAuth() {
            state.authMode = (state.authMode === 'LOGIN') ? 'REG' : 'LOGIN';
            document.getElementById('reg-extra').classList.toggle('hidden', state.authMode === 'LOGIN');
            document.getElementById('toggle-btn').innerText = (state.authMode === 'LOGIN') ? 'DAFTAR' : 'LOGIN';
        }

        async function startFaceScan() {
            const vid = document.getElementById('face-video'); vid.classList.remove('hidden');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                vid.srcObject = stream; vid.play();
                smartNotif("Biometric Syncing (4s)...");
                setTimeout(() => {
                    state.face = true; 
                    vid.classList.add('hidden'); 
                    stream.getTracks().forEach(t => t.stop());
                    showCustomAlert("Identitas Wajah Diterima. Dual-Gate Authorized.");
                }, 4000);
            } catch (e) { showCustomAlert("Camera Required for V13 Protocol."); }
        }

        function handleAuth() {
            const ph = document.getElementById('auth-phone').value;
            const ps = document.getElementById('auth-pass').value;

            if (ph === MASTER_CONFIG.ADMIN_PH && ps === MASTER_CONFIG.MK) return autoEnter('Master');
            
            if (state.authMode === 'REG') {
                if (!state.face) return showCustomAlert("Biometric Sync Wajib!");
                dbUsers[ph] = { pass: ps, xp: 0 };
                localStorage.setItem('titan_db', JSON.stringify(dbUsers));
                showCustomAlert("Registrasi Berhasil. Silahkan Login."); toggleAuth();
            } else {
                if (dbUsers[ph] && dbUsers[ph].pass === ps) autoEnter(ph);
                else showCustomAlert("Akses Ditolak. Protokol Keamanan Aktif.");
            }
        }

        function masterBypass() {
            const ps = document.getElementById('auth-pass').value;
            if(ps === MASTER_CONFIG.MK) autoEnter('Master');
            else showCustomAlert("Master Key Salah.");
        }

        function autoEnter(u) {
            sessionStorage.setItem('titan_auth', 'true');
            document.getElementById('auth-screen').style.display = 'none';
            if(state.initCap === 0) document.getElementById('modal-vault').classList.remove('hidden');
            startEngine();
        }

        // --- ENGINE LOGIC ---
        function finalizeCapital() {
            const v = parseInt(document.getElementById('vault-input').value);
            state.initCap = v;
            state.buckets = { scalp: v*0.4, smart: v*0.39, moon: v*0.21 };
            document.getElementById('modal-vault').classList.add('hidden');
            renderUI();
        }

        async function startEngine() {
            try {
                const btcRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&include_24hr_change=true');
                const btcData = await btcRes.json();
                state.btcDrop = btcData.bitcoin.idr_24h_change < -2.0;
                document.getElementById('btc-guard').classList.toggle('hidden', !state.btcDrop);

                if (!state.btcDrop && !state.goalReached) {
                    const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=12&sparkline=true');
                    const data = await res.json();
                    processSignals(data);
                }
            } catch (e) { console.warn("API Sync Delay"); }
            setTimeout(startEngine, 10000);
        }

        function processSignals(coins) {
            coins.forEach(coin => {
                if(Math.random() > 0.85 && state.cards.length < 9) {
                    if(!state.cards.find(c => c.coinId === coin.id)) {
                        state.cards.push({
                            id: Date.now() + Math.random(), coinId: coin.id, name: coin.symbol.toUpperCase(),
                            entry: coin.current_price, current: coin.current_price, 
                            img: coin.image, spark: coin.sparkline_in_7d.price.slice(-20),
                            status: 'ANALYSIS', peak: coin.current_price,
                            strat: ['SCALP', 'SMART', 'MOONSHOT'][Math.floor(Math.random()*3)]
                        });
                        smartNotif(`Radar: Strong Buy ${coin.symbol.toUpperCase()}`);
                    }
                } else {
                    let card = state.cards.find(c => c.coinId === coin.id);
                    if(card) {
                        card.current = coin.current_price;
                        if(card.current > card.peak) card.peak = card.current;
                        if(card.status === 'EXECUTION' && (card.peak - card.current) / card.peak >= 0.015) {
                            handleCardAction(card.id, 'TP', true);
                        }
                    }
                }
            });
            renderUI();
        }

        function handleCardAction(id, type, auto = false) {
            const card = state.cards.find(c => c.id === id);
            if(!card) return;

            if(type === 'LOCK') {
                card.status = 'EXECUTION';
                smartNotif(`${card.name} Locked in Hot Zone`);
            } else {
                const win = type === 'TP';
                const pnlValue = win ? Math.random() * 50000 : -(Math.random() * 20000);
                state.capProfit += pnlValue;
                
                if(win) {
                    state.xp += 15;
                    if(state.xp >= 150) {
                        state.rank = "Elite Master";
                        document.getElementById('execute-all-container').style.boxShadow = "0 0 20px #ffd700";
                    }
                }

                state.log.push({...card, result: type, pnl: pnlValue, finalTime: new Date().toLocaleTimeString()});
                state.cards = state.cards.filter(c => c.id !== id);
                
                if((state.capProfit / state.initCap) >= 0.10) {
                    state.goalReached = true;
                    showCustomAlert("DAILY GOAL 10% TERKONFIRMASI. Profit Dikunci.");
                }
                if(auto) smartNotif(`Trailing Stop: ${card.name} Closed`);
            }
            renderUI();
        }

        function massExecute() {
            if(state.rank !== "Elite Master") return smartNotif("Hanya untuk Elite Master (150 XP)");
            state.cards.forEach(c => { if(c.status === 'EXECUTION') handleCardAction(c.id, 'TP'); });
            smartNotif("Elite Action: Mass Execution Complete");
        }

        // --- RENDER UI (TIGA KOLOM) ---
        function renderUI() {
            document.getElementById('cap-main').innerText = formatIDR(state.initCap + state.capProfit);
            document.getElementById('b-scalp').innerText = formatIDR(state.buckets.scalp);
            document.getElementById('b-smart').innerText = formatIDR(state.buckets.smart);
            document.getElementById('b-moon').innerText = formatIDR(state.buckets.moon);
            document.getElementById('rank-badge').innerText = `XP: ${state.xp}`;
            document.getElementById('mode-text').innerText = state.rank;

            const aDiv = document.getElementById('list-analysis');
            const eDiv = document.getElementById('list-execution');
            const hDiv = document.getElementById('list-history');
            
            aDiv.innerHTML = ''; eDiv.innerHTML = ''; hDiv.innerHTML = '';

            state.cards.forEach(c => {
                const pnl = ((c.current / c.entry) - 1) * 100;
                const isHot = pnl > 2.0 ? 'hot-zone-pulse' : '';
                
                const cardHtml = `
                    <div class="glass-premium p-3 flex flex-col gap-2 ${isHot} ${c.status === 'EXECUTION' ? 'blink-execute' : ''}" style="min-height: 140px;">
                        <div class="flex justify-between items-center">
                            <img src="${c.img}" class="w-5 h-5">
                            <span class="text-[8px] ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl.toFixed(2)}%</span>
                        </div>
                        <div class="titan-font text-[7px] text-center">${c.name}</div>
                        <canvas id="chart-${c.id}" class="mini-chart"></canvas>
                        <div class="flex justify-center mt-auto">
                            ${c.status === 'ANALYSIS' ? 
                            `<button onclick="handleCardAction(${c.id}, 'LOCK')" class="w-full py-1 bg-yellow-500 text-black text-[7px] font-black rounded uppercase">LOCK</button>` :
                            `<div class="flex gap-1 w-full">
                                <button onclick="handleCardAction(${c.id}, 'TP')" class="flex-1 py-1 bg-emerald-500 text-[6px] rounded">TP</button>
                                <button onclick="handleCardAction(${c.id}, 'SL')" class="flex-1 py-1 bg-rose-500 text-[6px] rounded">SL</button>
                            </div>`}
                        </div>
                    </div>`;

                if(c.status === 'ANALYSIS') aDiv.innerHTML += cardHtml;
                else eDiv.innerHTML += cardHtml;
                
                setTimeout(() => drawMiniChart(c.id, c.spark, pnl >= 0), 50);
            });

            state.log.slice(-5).reverse().forEach(l => {
                hDiv.innerHTML += `
                    <div class="bg-white/5 p-2 rounded-lg border border-white/5 text-center">
                        <div class="text-[7px] titan-font">${l.name}</div>
                        <div class="text-[6px] ${l.result === 'TP' ? 'text-emerald-400' : 'text-rose-400'}">${l.result}</div>
                    </div>`;
            });
        }

        // --- CORE UTILS ---
        function formatIDR(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v); }
        function showCustomAlert(c) { document.getElementById('alert-content').innerHTML = c; document.getElementById('custom-alert').classList.remove('hidden'); }
        function closeAlert() { document.getElementById('custom-alert').classList.add('hidden'); }
        function smartNotif(t) { const area = document.getElementById('notif-area'); const el = document.createElement('div'); el.className = "floating-msg titan-font text-yellow-500"; el.innerHTML = t; area.appendChild(el); setTimeout(()=>el.remove(), 4000); }
        function notifyTelegram(t) { fetch(`https://api.telegram.org/bot${MASTER_CONFIG.BT}/sendMessage?chat_id=${MASTER_CONFIG.CI}&text=${encodeURIComponent(t)}&parse_mode=Markdown`); }
        function drawMiniChart(id, data, p) {
            const canvas = document.getElementById(`chart-${id}`);
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            new Chart(ctx, { type: 'line', data: { labels: data.map((_,i)=>i), datasets: [{ data: data, borderColor: p?'#10b981':'#f43f5e', borderWidth: 1, fill: false, pointRadius: 0 }] }, options: { scales: { x:{display:false}, y:{display:false} }, plugins:{legend:{display:false}} } });
        }
        function exportExcel() { const ws = XLSX.utils.json_to_sheet(state.log); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Titan_Log"); XLSX.writeFile(wb, "TITAN_V13_Report.xlsx"); }
        function showHowItWorks() { showCustomAlert("<div class='text-left text-[8px] uppercase'><p class='text-yellow-500 font-black mb-2'>Logic V13:</p><p>1. Modal dibagi 40:39:21.</p><p>2. Mata Dewa Scan setiap 10 detik.</p><p>3. Trailing Stop otomatis di 1.5%.</p><p>4. Capai 150 XP untuk fitur Mass TP.</p></div>"); }
        function toggleLang() { state.lang = state.lang === 'ID' ? 'EN' : 'ID'; document.getElementById('ui-flag').innerText = state.lang === 'ID' ? '🇮🇩' : '🇺🇸'; smartNotif("Language Switched"); }

        // --- MIDNIGHT COMPOUNDING ---
        setInterval(() => {
            const now = new Date();
            if(now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 0) {
                const total = state.initCap + state.capProfit;
                state.initCap = total; state.capProfit = 0;
                state.buckets = { scalp: total*0.4, smart: total*0.39, moon: total*0.21 };
                state.goalReached = false;
                smartNotif("Cycle Reset: Profit Compounded.");
                renderUI();
            }
        }, 1000);

        document.getElementById('tg-group-btn').onclick = () => window.open(MASTER_CONFIG.TG);
        window.onload = () => { if(sessionStorage.getItem('titan_auth')) autoEnter('User'); };
    </script>
</body>
</html>
