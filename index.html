<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700;900&display=swap');
        :root { --bg: #010204; --glass: rgba(15, 23, 42, 0.95); --gold: #f59e0b; --accent: #8b5cf6; --emerald: #10b981; --rose: #f43f5e; }
        * { font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #e2e8f0; height: 100vh; margin: 0; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Glass & Gold Aesthetics */
        .glass-card { background: var(--glass); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.05); }
        .gold-grad { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .m-grad { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); }
        
        /* Tri-Grid Layout (Sejajar dalam 1 Layar) */
        .module-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; height: calc(100vh - 380px); padding: 0 20px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Modern Modals (Sembunyikan Link Web) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { width: 90%; max-width: 400px; padding: 40px; border-radius: 2.5rem; border: 1px solid rgba(245, 158, 11, 0.3); animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* Bottom Nav (Icon Petir) */
        .bottom-nav { height: 85px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; padding-bottom: 10px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0.5; transition: 0.3s; cursor: pointer; }
        .nav-item.active { opacity: 1; color: #f59e0b; }
        .flash-btn { width: 65px; height: 65px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -45px; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); border: 4px solid var(--bg); color: black; font-size: 24px; }
        
        .f-scan-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body onmousedown="resetInactivity()">

    <div id="toast-container" class="fixed top-8 right-8 z-[11000]"></div>

    <div id="master-modal" class="modal-overlay">
        <div class="glass-card modal-content text-center">
            <i class="fa-solid fa-crown text-5xl text-amber-500 mb-6 drop-shadow-[0_0_15px_#f59e0b]"></i>
            <h2 class="text-2xl font-black italic mb-2 text-white uppercase">Master Identity</h2>
            <p class="text-[9px] uppercase tracking-[0.4em] text-amber-500/60 font-black mb-8">Supreme Access Protocol</p>
            <input type="password" id="m-key" placeholder="Enter Protocol Code" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white text-center mb-8 focus:border-amber-500 transition-all">
            <div class="grid grid-cols-2 gap-4">
                <button onclick="closeModal('master-modal')" class="py-4 bg-white/5 rounded-2xl text-[10px] font-black uppercase opacity-40">Batal</button>
                <button onclick="checkMaster()" class="py-4 gold-grad rounded-2xl text-[10px] font-black uppercase text-black font-bold">Confirm</button>
            </div>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[5000] bg-black flex items-center justify-center p-8">
        <div class="w-full max-w-md glass-card p-12 rounded-[3.5rem] border-amber-500/20 text-center shadow-2xl">
            <i class="fa-solid fa-shield-halved text-7xl text-amber-500 mb-8 drop-shadow-[0_0_20px_rgba(245,158,11,0.3)]"></i>
            <h2 class="text-4xl font-black italic tracking-tighter mb-12 uppercase">Titan <span class="text-amber-500">V13</span></h2>
            <div class="space-y-5">
                <input type="tel" id="u-phone" placeholder="Phone (Telegram)" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white font-bold">
                <input type="password" id="u-pass" placeholder="Password (A-a-1)" class="w-full bg-white/5 border border-white/10 p-5 rounded-2xl text-white font-bold">
                <button onclick="login()" class="w-full py-6 gold-grad rounded-2xl font-black text-xs uppercase text-black shadow-xl tracking-widest active:scale-95 transition-all">Initialize Access</button>
                <div class="flex justify-between px-4 mt-8">
                    <button onclick="showModal('master-modal')" class="text-[9px] text-amber-500 font-black uppercase tracking-widest">Master Identity</button>
                    <button onclick="startFaceScan()" class="text-[9px] text-white/20 font-black uppercase tracking-widest">Face Recovery</button>
                </div>
            </div>
        </div>
    </div>

    <div id="app" class="hidden h-full flex flex-col">
        <header class="p-5 flex justify-between items-center bg-black/50 border-b border-white/5">
            <div class="px-4 py-1.5 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                <span id="mode-badge" class="text-[9px] font-black text-emerald-500 uppercase tracking-widest">Training Mode</span>
            </div>
            <div class="flex gap-5 items-center">
                <i class="fa-solid fa-book text-amber-500 text-lg cursor-pointer" title="Tutorial" onclick="showTutorial()"></i>
                <button onclick="toggleLang()" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 text-[10px] font-bold">🇮🇩</button>
                <i class="fa-solid fa-power-off text-rose-500 text-lg cursor-pointer" onclick="location.reload()"></i>
            </div>
        </header>

        <div class="p-6">
            <div class="glass-card p-7 rounded-[2.5rem] relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-[8px] opacity-40 uppercase font-black tracking-widest">Capital Management (0.00%)</p>
                    <span class="text-[9px] font-black text-amber-500/50 uppercase">Goal: 10%</span>
                </div>
                <h2 id="total-cap" class="text-4xl font-black text-amber-500 italic mb-8">Rp 1.000.000</h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-40 uppercase mb-1">Scalp (40%)</p>
                        <p id="cap-scalp" class="text-[10px] font-black text-emerald-400">Rp 400.000</p>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-40 uppercase mb-1">Smart (39%)</p>
                        <p id="cap-smart" class="text-[10px] font-black text-sky-400">Rp 390.000</p>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-40 uppercase mb-1">Moon (21%)</p>
                        <p id="cap-moon" class="text-[10px] font-black text-violet-400">Rp 210.000</p>
                    </div>
                </div>
            </div>
        </div>

        <main class="module-grid">
            <section class="flex flex-col gap-3">
                <h2 class="text-[10px] font-black uppercase tracking-[0.3em] opacity-40 text-amber-500 px-2">Analysis</h2>
                <div id="list-analysis" class="flex-1 overflow-y-auto space-y-4 no-scrollbar pb-10"></div>
            </section>
            
            <section class="flex flex-col gap-3">
                <h2 class="text-[10px] font-black uppercase tracking-[0.3em] opacity-40 text-sky-400 px-2">Execution</h2>
                <div id="list-execution" class="flex-1 overflow-y-auto space-y-4 no-scrollbar pb-10"></div>
            </section>
            
            <section class="flex flex-col gap-3">
                <div class="flex justify-between items-center px-2">
                    <h2 class="text-[10px] font-black uppercase tracking-[0.3em] opacity-40 text-emerald-400">History</h2>
                    <i class="fa-solid fa-file-excel text-emerald-500 text-xs cursor-pointer" onclick="exportToExcel()"></i>
                </div>
                <div id="list-history" class="flex-1 overflow-y-auto space-y-4 no-scrollbar pb-10"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item"><i class="fa-solid fa-chart-line text-xl"></i><span class="text-[8px] font-black uppercase">Live</span></div>
            <div class="nav-item active" onclick="window.open('https://t.me/+8uJ78T4VDHJkOTRl', '_blank')"><i class="fa-brands fa-telegram text-xl"></i><span class="text-[8px] font-black uppercase">Group</span></div>
            <div class="flash-btn" onclick="refreshSignals()"><i class="fa-solid fa-bolt"></i></div>
            <div class="nav-item"><i class="fa-solid fa-brain text-xl text-emerald-500"></i><span class="text-[8px] font-black uppercase text-emerald-500">AI Scan</span></div>
            <div class="nav-item"><i class="fa-solid fa-shield-halved text-xl"></i><span class="text-[8px] font-black uppercase">Secure</span></div>
        </nav>
    </div>

    <script>
        /* CORE DATA & CONSTANTS */
        const MASTER_PROTOCOL = "MahadhareV13Master";
        const BOT_TOKEN = "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4";
        const CHAT_ID = "-1003254379333";

        let state = {
            modal: 1000000, profit: 0, 
            buckets: { scalp: 400000, smart: 390000, moon: 210000 },
            analysis: [], execution: [], history: [], 
            hackAttempts: 0, isMaster: false
        };

        /* 1. SECURITY & AUTH */
        function checkMaster() {
            const key = document.getElementById('m-key').value;
            if (key === MASTER_PROTOCOL) {
                state.isMaster = true; state.modal = 1000000;
                closeModal('master-modal'); login();
                toast("Master Protocol Accepted");
            } else {
                state.hackAttempts++;
                if(state.hackAttempts >= 5) triggerSelfDestruct();
                toast(`Invalid Protocol (${state.hackAttempts}/5)`, true);
            }
        }

        function triggerSelfDestruct() {
            localStorage.clear();
            document.body.innerHTML = "<div class='h-screen flex items-center justify-center bg-black text-rose-600 font-black text-3xl uppercase text-center p-10'>Self-Destruct Triggered. Access Permanently Revoked.</div>";
        }

        function login() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            calculateBuckets(); refreshSignals();
        }

        /* 2. CORE ENGINE: BUCKET & SIGNALS */
        function calculateBuckets() {
            state.buckets.scalp = state.modal * 0.40;
            state.buckets.smart = state.modal * 0.39;
            state.buckets.moon = state.modal * 0.21;
            updateUI();
        }

        function updateUI() {
            document.getElementById('total-cap').innerText = "Rp " + Math.floor(state.modal).toLocaleString();
            document.getElementById('cap-scalp').innerText = "Rp " + Math.floor(state.buckets.scalp).toLocaleString();
            document.getElementById('cap-smart').innerText = "Rp " + Math.floor(state.buckets.smart).toLocaleString();
            document.getElementById('cap-moon').innerText = "Rp " + Math.floor(state.buckets.moon).toLocaleString();
        }

        function refreshSignals() {
            const coins = ['BTC/IDR', 'ETH/IDR', 'SOL/IDR', 'XRP/IDR', 'ADA/IDR', 'PEPE/IDR', 'SUI/IDR'];
            state.analysis = coins.map(s => ({
                id: Math.random().toString(36).substr(2, 9),
                sym: s, 
                type: Math.random() > 0.6 ? 'SCALP' : (Math.random() > 0.4 ? 'SMART' : 'MOON'),
                pnl: (Math.random() * -0.08).toFixed(2)
            }));
            render();
        }

        /* 3. TRANSACTION LOGIC */
        function lockSignal(id) {
            const item = state.analysis.find(x => x.id === id);
            let cost = 0;
            if (item.type === 'SCALP') { cost = state.buckets.scalp * 0.1; state.buckets.scalp -= cost; }
            else if (item.type === 'SMART') { cost = state.buckets.smart * 0.1; state.buckets.smart -= cost; }
            else { cost = state.buckets.moon * 0.1; state.buckets.moon -= cost; }

            state.execution.push({ ...item, cost, pnl: 0 });
            state.analysis = state.analysis.filter(x => x.id !== id);
            render();
            toast(`${item.sym} Locked to ${item.type} Bucket`);
        }

        function executeProfit(id) {
            const item = state.execution.find(x => x.id === id);
            const profitValue = item.cost * (item.pnl / 100);
            state.modal += (item.cost + profitValue);
            state.history.unshift({ ...item, final: item.pnl, time: new Date().toLocaleTimeString() });
            state.execution = state.execution.filter(x => x.id !== id);
            calculateBuckets(); render();
            toast(item.pnl >= 0 ? "Profit Secured! 💰" : "Strategic Exit", item.pnl < 0);
        }

        /* 4. RENDERER & UI UTILS */
        function render() {
            // Render Analysis
            const aCont = document.getElementById('list-analysis'); aCont.innerHTML = '';
            state.analysis.forEach(c => {
                aCont.innerHTML += `
                    <div class="bg-white/[0.03] border border-white/5 p-5 rounded-[2rem] hover:border-amber-500/30 transition-all">
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-[7px] px-2 py-0.5 rounded bg-amber-500/20 text-amber-500 font-black uppercase">${c.type}</span>
                            <span class="text-[9px] font-bold text-rose-500">${c.pnl}% PNL</span>
                        </div>
                        <h3 class="text-sm font-black italic mb-4 uppercase">${c.sym}</h3>
                        <div class="h-10 w-full mb-5 bg-gradient-to-r from-rose-500/10 to-transparent rounded-full overflow-hidden">
                            <div class="h-full bg-rose-500/20 w-3/4 animate-pulse"></div>
                        </div>
                        <button onclick="lockSignal('${c.id}')" class="w-full py-3 gold-grad rounded-xl text-black font-black uppercase text-[9px] tracking-widest">Lock</button>
                    </div>`;
            });

            // Render Execution
            const eCont = document.getElementById('list-execution'); eCont.innerHTML = '';
            state.execution.forEach(c => {
                const isUrgent = c.pnl > 1.5 || c.pnl < -0.8;
                eCont.innerHTML += `
                    <div class="bg-white/[0.05] border border-sky-500/30 p-5 rounded-[2.2rem] ${isUrgent ? 'animate-pulse border-rose-500 shadow-[0_0_15px_rgba(244,63,94,0.2)]' : ''}">
                        <div class="flex justify-between items-center mb-4">
                            <p class="text-[10px] font-black italic uppercase">${c.sym}</p>
                            <p class="text-[11px] font-black ${c.pnl >= 0 ? 'text-emerald-400' : 'text-rose-500'}">${c.pnl}%</p>
                        </div>
                        <button onclick="executeProfit('${c.id}')" class="w-full py-3 bg-sky-500 rounded-xl text-white font-black uppercase text-[9px] tracking-widest">Execute</button>
                    </div>`;
            });

            // Render History
            const hCont = document.getElementById('list-history'); hCont.innerHTML = '';
            state.history.forEach(h => {
                hCont.innerHTML += `
                    <div class="bg-white/5 p-4 rounded-2xl flex justify-between items-center mb-2 border border-white/5">
                        <div><p class="text-[9px] font-black italic uppercase">${h.sym}</p><p class="text-[6px] opacity-30 font-bold tracking-widest">${h.time}</p></div>
                        <p class="text-[10px] font-black ${h.final >= 0 ? 'text-emerald-400' : 'text-rose-500'}">${h.final}%</p>
                    </div>`;
            });
        }

        function toast(m, u = false) {
            const t = document.createElement('div');
            t.className = `p-5 glass-card rounded-[1.5rem] border-white/10 text-[8px] font-black uppercase mb-3 shadow-2xl animate-bounce ${u ? 'text-rose-500' : 'text-emerald-400'}`;
            t.innerHTML = `<i class="fa-solid ${u?'fa-triangle-exclamation':'fa-circle-check'} mr-3"></i> ${m}`;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        function exportToExcel() {
            const ws = XLSX.utils.json_to_sheet(state.history);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "TITAN_V13_LOG");
            XLSX.writeFile(wb, "Titan_V13_History.xlsx");
        }

        function showTutorial() { alert("PANDUAN STRATEGI:\n1. Pantau Sinyal di Kolom Analysis\n2. Klik LOCK untuk memasukkan modal ke Bucket (40:39:21)\n3. Monitor di Kolom Execution\n4. Klik EXECUTE saat PNL Hijau untuk amankan Profit!"); }
        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function resetInactivity() {}

        /* LIVE PNL SIMULATION (EVERY 4 SEC) */
        setInterval(() => {
            state.execution.forEach(c => { c.pnl = (Math.random() * 5 - 1.8).toFixed(2); });
            render();
        }, 4000);
    </script>
</body>
</html>
