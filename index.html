<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 1.5s infinite; }
        @keyframes blink-gold { 50% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); } }
        #face-video { width: 100%; height: 160px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; }
        .grid-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; height: 100%; }
        .mod-col { display: flex; flex-direction: column; overflow: hidden; }
        .rank-item { background: linear-gradient(90deg, rgba(255,215,0,0.1) 0%, rgba(0,0,0,0) 100%); border-left: 2px solid var(--gold); }
    </style>
</head>
<body>

    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] overflow-y-auto p-6 flex flex-col items-center">
        <div class="w-full max-w-sm text-center mt-4">
            <div class="w-32 h-32 mx-auto mb-4 bg-zinc-900 rounded-2xl border border-yellow-500/30 flex items-center justify-center shadow-2xl">
                <i class="fa-solid fa-microchip text-4xl text-yellow-500"></i>
            </div>
            <h1 class="titan-font text-3xl text-yellow-500 mb-1">TITAN V.13 AI</h1>
            <p class="text-[8px] tracking-[4px] opacity-50 mb-8 uppercase font-black text-white" data-id="brand-tag">Mahadhare Hybrid Core</p>
            <div class="space-y-4">
                <input type="text" id="auth-phone" placeholder="NO TELEPON" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
                <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs">
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="enterSystem(false)" class="py-4 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase">Masuk</button>
                    <button onclick="alert('Gunakan Verifikasi Wajah untuk Daftar')" class="py-4 bg-white/5 border border-white/10 text-white titan-font text-[10px] rounded-xl uppercase">Daftar</button>
                </div>
                <div class="mt-10 pt-6 border-t border-white/5">
                    <button onclick="enterSystem(true)" class="w-full py-4 bg-yellow-600/20 border border-yellow-500/50 text-yellow-500 titan-font text-[12px] font-black rounded-xl uppercase">VERIFY IDENTITY</button>
                    <p class="text-[7px] text-white/30 italic mt-2 tracking-[2px]">LOG: ENCRYPTED ACCESS ONLY</p>
                </div>
            </div>
        </div>
    </div>

    <div id="real-mode-modal" class="fixed inset-0 z-[25000] bg-black/95 backdrop-blur-xl hidden flex items-center justify-center p-6">
        <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 text-center">
            <h3 class="titan-font text-yellow-500 text-[11px] mb-6 uppercase">Aktivasi Real Mode</h3>
            <div class="space-y-3 mb-8">
                <div onclick="verifyReq('tg')" class="flex justify-between items-center p-4 bg-white/5 rounded-xl border border-white/10 cursor-pointer">
                    <span class="text-[9px]"><i class="fa-brands fa-telegram mr-2"></i> Join Group Telegram</span>
                    <i id="check-tg" class="fa-solid fa-circle-dot opacity-20"></i>
                </div>
                <div onclick="verifyReq('idx')" class="flex justify-between items-center p-4 bg-white/5 rounded-xl border border-white/10 cursor-pointer">
                    <span class="text-[9px]"><i class="fa-solid fa-link mr-2"></i> Register Indodax (Reff)</span>
                    <i id="check-idx" class="fa-solid fa-circle-dot opacity-20"></i>
                </div>
                <div class="flex justify-between items-center p-4 bg-white/5 rounded-xl border border-white/10">
                    <span class="text-[9px]"><i class="fa-solid fa-calendar-check mr-2"></i> Misi 7 Hari (10%/Hari)</span>
                    <i id="check-mis" class="fa-solid fa-circle-check text-emerald-500"></i>
                </div>
            </div>
            <button id="activate-real-btn" onclick="activateRealMode()" class="w-full py-4 bg-zinc-800 text-white/30 titan-font text-[10px] rounded-xl uppercase" disabled>Aktivasi Gagal</button>
            <button onclick="closeRealModal()" class="mt-4 text-[9px] opacity-40 uppercase">Kembali</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-black/80 border-b border-yellow-500/10 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <button onclick="openTutorial()" class="w-9 h-9 bg-white/5 rounded-full flex items-center justify-center border border-yellow-500/30 text-yellow-500"><i class="fa-solid fa-book"></i></button>
            <div onclick="triggerModeTransition()" class="cursor-pointer bg-white/5 p-2 px-3 rounded-2xl flex items-center gap-2 border border-white/10 active:scale-95 transition-all">
                <div id="mode-dot" class="w-2 h-2 rounded-full bg-emerald-500"></div>
                <span id="mode-text" class="titan-font text-[9px] font-black uppercase text-white">Training Mode</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleCurrencyAndLang()" class="w-10 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-lg" id="lang-btn"><span id="flag-icon">🇮🇩</span></button>
            <button onclick="location.reload()" class="text-rose-500 bg-rose-500/10 w-8 h-8 rounded-lg border border-rose-500/20 flex items-center justify-center"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main id="main-content" class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar hidden">
        <section class="p-5">
            <div class="glass-premium p-6">
                <p class="text-[8px] uppercase font-black opacity-40 text-white" data-id="ui-cap-title">Capital Management</p>
                <h2 id="cap-main" class="titan-font text-3xl text-yellow-500 font-black mb-4">Rp 0</h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-3 rounded-xl text-center"><p class="text-[7px] opacity-50 uppercase mb-1 text-white" data-id="ui-scalp">Scalp</p><p id="b-scalp" class="text-[9px] font-bold text-emerald-400">0</p></div>
                    <div class="bg-white/5 p-3 rounded-xl text-center"><p class="text-[7px] opacity-50 uppercase mb-1 text-white" data-id="ui-smart">Smart</p><p id="b-smart" class="text-[9px] font-bold text-blue-400">0</p></div>
                    <div class="bg-white/5 p-3 rounded-xl text-center"><p class="text-[7px] opacity-50 uppercase mb-1 text-white" data-id="ui-moon">Moon</p><p id="b-moon" class="text-[9px] font-bold text-violet-400">0</p></div>
                </div>
            </div>
        </section>

        <section class="px-5 mb-10 h-[45vh] grid grid-cols-3 gap-3">
            <div class="mod-col"><h3 class="titan-font text-[9px] text-yellow-500 mb-4 uppercase text-center font-black" data-id="ui-analysis">Analysis</h3><div id="list-analysis" class="space-y-4 overflow-y-auto no-scrollbar"></div></div>
            <div class="mod-col"><h3 class="titan-font text-[9px] text-blue-500 mb-4 uppercase text-center font-black" data-id="ui-execution">Execution</h3><div id="list-execution" class="space-y-4 overflow-y-auto no-scrollbar"></div></div>
            <div class="mod-col"><h3 class="titan-font text-[9px] text-emerald-500 mb-4 uppercase text-center font-black" data-id="ui-history">History</h3><div id="list-history" class="space-y-2 overflow-y-auto no-scrollbar"></div></div>
        </section>

        <section id="rank-section" class="px-5 mb-10 hidden">
            <h3 class="titan-font text-[10px] text-yellow-500 mb-4 uppercase font-black">Live Ranking</h3>
            <div class="space-y-2" id="rank-list"></div>
        </section>
    </main>

    <footer id="footer-nav" class="fixed bottom-0 left-0 right-0 p-4 bg-black/95 border-t border-white/5 z-50 hidden">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button onclick="toggleRank()" class="flex flex-col items-center gap-1 text-yellow-500"><i class="fa-solid fa-ranking-star text-lg"></i><span class="text-[8px]">LIVE</span></button>
            <button onclick="window.open('https://t.me/+8uJ78T4VDHJkOTRl')" class="flex flex-col items-center gap-1 text-sky-400"><i class="fa-brands fa-telegram text-2xl"></i><span class="text-[8px]">GROUP</span></button>
            <div onclick="smartScanTrigger()" class="w-14 h-14 bg-yellow-500 rounded-full flex items-center justify-center -mt-10 shadow-lg border-8 border-[#020308] cursor-pointer"><i class="fa-solid fa-bolt text-black text-xl"></i></div>
            <button class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-brain text-lg"></i><span class="text-[8px]">AI SCAN</span></button>
        </div>
    </footer>

    <script>
        const MASTER = { BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4", CI: "-1003254379333", IDX: "https://indodax.onelink.me/qyYY/referral?deep_link_value=page:register,id:marselsalmon" };
        let state = {
            lang: 'ID', usdRate: 16000, mode: 'TRAINING', profit: 0, 
            buckets: { scalp: 400000, smart: 390000, moon: 210000 },
            cards: [], log: [], checklist: { tg: false, idx: false, mis: true }
        };

        const TRANSLATIONS = {
            ID: { brand: "Mahadhare Hybrid Core", cap: "Capital Management", scalp: "Scalp", smart: "Smart", moon: "Moon", analysis: "Analysis", execution: "Execution", history: "History" },
            EN: { brand: "Mahadhare Hybrid Global", cap: "Global Portfolio", scalp: "Day Trade", smart: "Mid-Term", moon: "Long-Term", analysis: "AI Analysis", execution: "Active Trades", history: "Trade Logs" }
        };

        function triggerModeTransition() {
            if (state.mode === 'REAL') return;
            document.getElementById('real-mode-modal').classList.remove('hidden');
        }

        function verifyReq(type) {
            if (type === 'tg') { window.open("https://t.me/+8uJ78T4VDHJkOTRl"); state.checklist.tg = true; document.getElementById('check-tg').className = "fa-solid fa-circle-check text-emerald-500"; }
            if (type === 'idx') { window.open(MASTER.IDX); state.checklist.idx = true; document.getElementById('check-idx').className = "fa-solid fa-circle-check text-emerald-500"; }
            if (state.checklist.tg && state.checklist.idx) {
                const b = document.getElementById('activate-real-btn');
                b.disabled = false; b.innerText = "AKTIVASI REAL MODE";
                b.className = "w-full py-4 bg-emerald-500 text-black titan-font text-[10px] rounded-xl font-black uppercase";
            }
        }

        function activateRealMode() {
            state.mode = 'REAL';
            document.getElementById('mode-text').innerText = "Real Mode";
            document.getElementById('mode-dot').className = "w-2 h-2 rounded-full bg-rose-500 animate-pulse";
            document.getElementById('real-mode-modal').classList.add('hidden');
            renderUI();
        }

        function closeRealModal() { document.getElementById('real-mode-modal').classList.add('hidden'); }

        function enterSystem(m) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-content').classList.remove('hidden');
            document.getElementById('footer-nav').classList.remove('hidden');
            if(m) activateRealMode();
            renderUI();
        }

        function toggleCurrencyAndLang() {
            state.lang = state.lang === 'ID' ? 'EN' : 'ID';
            document.getElementById('flag-icon').innerText = state.lang === 'ID' ? '🇮🇩' : '🇺🇸';
            const t = TRANSLATIONS[state.lang];
            document.querySelector('[data-id="brand-tag"]').innerText = t.brand;
            document.querySelector('[data-id="ui-cap-title"]').innerText = t.cap;
            document.querySelector('[data-id="ui-scalp"]').innerText = t.scalp;
            document.querySelector('[data-id="ui-smart"]').innerText = t.smart;
            document.querySelector('[data-id="ui-moon"]').innerText = t.moon;
            document.querySelector('[data-id="ui-analysis"]').innerText = t.analysis;
            document.querySelector('[data-id="ui-execution"]').innerText = t.execution;
            document.querySelector('[data-id="ui-history"]').innerText = t.history;
            renderUI();
        }

        function formatVal(v) { return state.lang === 'ID' ? "Rp " + Math.floor(v).toLocaleString('id-ID') : "$" + (v / state.usdRate).toFixed(2); }

        function renderUI() {
            document.getElementById('cap-main').innerText = formatVal(state.profit);
            document.getElementById('b-scalp').innerText = formatVal(state.buckets.scalp);
            document.getElementById('b-smart').innerText = formatVal(state.buckets.smart);
            document.getElementById('b-moon').innerText = formatVal(state.buckets.moon);
            // Tetap Training Mode jika belum Real
            if(state.mode === 'TRAINING') document.getElementById('mode-text').innerText = "Training Mode";
            else document.getElementById('mode-text').innerText = "Real Mode";
        }

        async function smartScanTrigger() {
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&per_page=6');
            const data = await res.json();
            const list = document.getElementById('list-analysis');
            list.innerHTML = '';
            data.forEach(c => {
                list.innerHTML += `<div class="bg-white/5 border border-white/10 p-3 rounded-2xl">
                    <p class="text-[9px] titan-font text-center">${c.symbol.toUpperCase()}</p>
                    <button class="w-full mt-2 py-2 bg-yellow-500 text-black text-[8px] font-black rounded-lg uppercase">LOCK</button>
                </div>`;
            });
        }

        function toggleRank() {
            if(state.mode !== 'REAL') return alert("Hanya di Real Mode!");
            document.getElementById('rank-section').classList.toggle('hidden');
        }

        function openTutorial() { document.getElementById('tutorial-modal').classList.remove('hidden'); }
        function closeTutorial() { document.getElementById('tutorial-modal').classList.add('hidden'); }
    </script>
</body>
</html>
