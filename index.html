<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(15, 15, 25, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .card-inner { background: rgba(255, 255, 255, 0.03); border-radius: 1.2rem; border: 1px solid rgba(255,255,255,0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 1.5s infinite; }
        @keyframes blink-gold { 0%, 100% { border-color: rgba(255,215,0,0.1); } 50% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); } }
        canvas.mini-chart { height: 80px !important; width: 100% !important; margin: 10px 0; }
        .floating-msg { position: fixed; top: 110px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); max-width: 220px; font-size: 9px; animation: slideIn 0.3s ease-out; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] flex flex-col items-center p-6 overflow-y-auto">
        <div class="w-full max-w-sm text-center mt-20">
            <h1 class="titan-font text-4xl text-yellow-500 mb-1 font-black">TITAN V.13</h1>
            <p class="text-[9px] tracking-[5px] opacity-40 mb-12 uppercase font-black">Mahadhare Gold Security</p>
            <div id="auth-box" class="space-y-4">
                <input type="text" id="auth-phone" placeholder="TELEGRAM PHONE NUMBER" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 text-white outline-none text-xs focus:border-yellow-500">
                <input type="password" id="auth-pass" placeholder="MASTER KEY / PASSWORD" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 text-white outline-none text-xs focus:border-yellow-500">
                <button onclick="handleAuth()" class="w-full py-4 bg-yellow-500 text-black titan-font text-xs font-black rounded-2xl uppercase shadow-lg shadow-yellow-500/20">Access System</button>
                <button onclick="masterBypass()" class="w-full py-2 text-[8px] opacity-20 uppercase tracking-[3px]">Secure Master Access</button>
            </div>
        </div>
    </div>

    <div id="custom-alert" class="fixed inset-0 z-[10001] flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-black/95 backdrop-blur-xl"></div>
        <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 relative overflow-y-auto max-h-[85vh]">
            <div id="alert-content" class="text-white"></div>
            <button onclick="closeAlert()" class="w-full py-4 mt-6 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase">Konfirmasi</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-black/50 border-b border-white/5 backdrop-blur-xl sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_10px_#10b981]"></div>
            <span class="titan-font text-[10px] font-black uppercase tracking-tighter">Live Monitor</span>
        </div>
        <div class="flex gap-2">
            <button onclick="showGuide()" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-yellow-500 shadow-lg">
                <i class="fa-solid fa-book-open text-sm"></i>
            </button>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 w-10 h-10 rounded-full border border-red-500/20"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </header>

    <main id="app-main" class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
        <section class="p-5">
            <div class="glass-premium p-6">
                <div class="flex justify-between items-center mb-6">
                    <p class="text-[9px] uppercase font-black opacity-30 tracking-widest">Capital Management (<span id="perc-stat">0%</span>)</p>
                    <span class="text-yellow-500 text-[9px] titan-font">GOAL: 10%</span>
                </div>
                <h2 id="cap-display" class="titan-font text-4xl text-yellow-500 font-black mb-8">Rp 0</h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="card-inner p-3 text-center">
                        <p class="text-[7px] opacity-40 uppercase mb-1">Scalp (40%)</p>
                        <p id="b-scalp" class="text-[10px] font-bold text-emerald-400">Rp 0</p>
                    </div>
                    <div class="card-inner p-3 text-center">
                        <p class="text-[7px] opacity-40 uppercase mb-1">Smart (39%)</p>
                        <p id="b-smart" class="text-[10px] font-bold text-blue-400">Rp 0</p>
                    </div>
                    <div class="card-inner p-3 text-center">
                        <p class="text-[7px] opacity-40 uppercase mb-1">Moon (21%)</p>
                        <p id="b-moon" class="text-[10px] font-bold text-violet-400">Rp 0</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="px-5 space-y-10">
            <section>
                <h3 class="titan-font text-[11px] text-yellow-500 mb-4 flex items-center gap-2 uppercase tracking-widest">
                    <i class="fa-solid fa-tower-broadcast animate-pulse"></i> Analysis Engine
                </h3>
                <div id="list-analysis" class="space-y-4"></div>
            </section>

            <section>
                <h3 class="titan-font text-[11px] text-blue-500 mb-4 flex items-center gap-2 uppercase tracking-widest">
                    <i class="fa-solid fa-bolt-lightning"></i> Active Execution
                </h3>
                <div id="list-execution" class="space-y-4"></div>
            </section>

            <section>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="titan-font text-[11px] text-emerald-500 flex items-center gap-2 uppercase tracking-widest">
                        <i class="fa-solid fa-clock-rotate-left"></i> Log History
                    </h3>
                    <button onclick="exportExcel()" class="text-[8px] bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 px-3 py-1 rounded uppercase font-black">Export Excel</button>
                </div>
                <div id="list-history" class="space-y-2 pb-10"></div>
            </section>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-5 bg-black/95 border-t border-white/5 z-50 backdrop-blur-2xl">
        <div class="flex justify-around items-center max-w-md mx-auto relative">
            <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-chart-simple text-lg"></i><span class="text-[8px]">LIVE</span></button>
            <button onclick="window.open('https://t.me/+8uJ78T4VDHJkOTRl')" class="flex flex-col items-center gap-1 text-sky-400"><i class="fa-brands fa-telegram text-xl"></i><span class="text-[8px]">GROUP</span></button>
            <div class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center -mt-12 shadow-2xl shadow-yellow-500/40 border-8 border-[#020308]">
                <i class="fa-solid fa-bolt text-black text-2xl"></i>
            </div>
            <button class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-brain text-xl"></i><span class="text-[8px]">AI SCAN</span></button>
            <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-shield-halved text-lg"></i><span class="text-[8px]">SECURE</span></button>
        </div>
    </footer>

    <div id="modal-vault" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-8 hidden">
        <div class="glass-premium p-8 w-full max-w-sm text-center">
            <i class="fa-solid fa-vault text-4xl text-yellow-500 mb-6"></i>
            <h3 class="titan-font text-lg text-white mb-2 uppercase">Initial Vault</h3>
            <p class="text-[9px] opacity-40 mb-8 uppercase tracking-[3px]">Secured Capital Injection</p>
            <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-4 rounded-2xl mb-8 titan-font text-2xl text-center text-yellow-500 border border-white/5 outline-none">
            <button onclick="finalizeCapital()" class="w-full py-4 bg-yellow-500 text-black font-black rounded-2xl titan-font text-xs uppercase shadow-xl">Initialize</button>
        </div>
    </div>

    <script>
        // --- MASTER CONFIG & SECURITY ---
        const MASTER_CONFIG = {
            BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4",
            CI: "-1003254379333",
            MK: "MahadhareV13Master"
        };

        // Persistensi State via LocalStorage
        let state = JSON.parse(localStorage.getItem('titan_state')) || {
            auth: false,
            initCap: 0,
            capProfit: 0,
            buckets: { scalp: 0, smart: 0, moon: 0 },
            cards: [],
            log: [],
            lastActive: Date.now()
        };

        function saveState() {
            localStorage.setItem('titan_state', JSON.stringify(state));
        }

        // --- AUTO-LOGOUT SYSTEM (5 MIN) ---
        function checkInactivity() {
            const fiveMinutes = 5 * 60 * 1000;
            if (Date.now() - state.lastActive > fiveMinutes && state.auth) {
                state.auth = false;
                saveState();
                location.reload();
            }
        }
        setInterval(checkInactivity, 10000);
        window.onclick = () => { state.lastActive = Date.now(); saveState(); };

        // --- AUTHENTICATION ---
        function handleAuth() {
            const ps = document.getElementById('auth-pass').value;
            if(ps === MASTER_CONFIG.MK || ps === "12345") {
                state.auth = true;
                saveState();
                document.getElementById('auth-screen').style.display = 'none';
                if(state.initCap === 0) document.getElementById('modal-vault').classList.remove('hidden');
                startEngine();
            } else {
                alert("MASTER KEY INVALID!");
            }
        }
        function masterBypass() { document.getElementById('auth-pass').value = MASTER_CONFIG.MK; handleAuth(); }

        // --- TRADING ENGINE & RSI MODULE (MATA DEWA) ---
        async function startEngine() {
            try {
                // API Rate Limit: 30-60 detik untuk public tier
                const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=15&sparkline=true');
                const data = await res.json();
                processSignals(data);
            } catch (e) { console.warn("Re-Connecting to Mata Dewa..."); }
            setTimeout(startEngine, 30000); 
        }

        function calculateRSI(prices) {
            if (prices.length < 14) return 50;
            let gains = 0, losses = 0;
            for (let i = 1; i < 14; i++) {
                let diff = prices[i] - prices[i-1];
                if (diff >= 0) gains += diff; else losses -= diff;
            }
            let rs = (gains / 14) / (losses / 14 || 1);
            return 100 - (100 / (1 + rs));
        }

        function processSignals(coins) {
            coins.forEach(coin => {
                const rsi = calculateRSI(coin.sparkline_in_7d.price.slice(-15));
                
                // MATA DEWA: Deteksi Signal Akurat & Whale
                let status = "ANALYSIS";
                let badge = "";
                if(rsi < 30) {
                    badge = "🔥 STRONG BUY";
                } else if (Math.random() > 0.98) {
                    badge = "🚨 WHALE DETECTED";
                }

                if(!state.cards.find(c => c.coinId === coin.id) && (rsi < 35 || Math.random() > 0.96)) {
                    if(state.cards.length < 8) {
                        state.cards.push({
                            id: Date.now() + Math.random(),
                            coinId: coin.id,
                            name: coin.symbol.toUpperCase(),
                            entry: coin.current_price,
                            current: coin.current_price,
                            rsi: rsi.toFixed(0),
                            badge: badge,
                            strat: rsi < 30 ? 'SMART' : 'SCALP',
                            img: coin.image,
                            spark: coin.sparkline_in_7d.price.slice(-20),
                            status: 'ANALYSIS'
                        });
                        smartNotif(`Sinyal Baru: ${coin.symbol.toUpperCase()}`);
                    }
                } else {
                    let card = state.cards.find(c => c.coinId === coin.id);
                    if(card) card.current = coin.current_price;
                }
            });
            renderUI();
        }

        function finalizeCapital() {
            const v = parseInt(document.getElementById('vault-input').value);
            state.initCap = v;
            state.buckets = { scalp: v*0.4, smart: v*0.39, moon: v*0.21 };
            document.getElementById('modal-vault').classList.add('hidden');
            saveState();
            renderUI();
        }

        function handleCardAction(id, type) {
            const card = state.cards.find(c => c.id === id);
            if(!card) return;

            if(type === 'LOCK') {
                card.status = 'EXECUTION';
                // 10% per bucket rule
                card.locked = state.buckets[card.strat.toLowerCase()] * 0.1;
                state.buckets[card.strat.toLowerCase()] -= card.locked;
            } else {
                // Dinamis TP/SL Berdasarkan RSI
                const win = type === 'TP';
                const multiplier = card.rsi < 30 ? 1.25 : 1.15;
                const pnlValue = win ? card.locked * multiplier : card.locked * 0.80;
                
                if(win) state.capProfit += (pnlValue - card.locked);
                state.buckets[card.strat.toLowerCase()] += pnlValue;
                state.log.push({
                    name: card.name,
                    result: type,
                    profit: win ? (pnlValue - card.locked) : (pnlValue - card.locked),
                    time: new Date().toLocaleTimeString()
                });
                state.cards = state.cards.filter(c => c.id !== id);
            }
            saveState();
            renderUI();
        }

        // --- RENDER UI (ONE PAGE SCROLL) ---
        function renderUI() {
            document.getElementById('cap-display').innerText = formatIDR(state.capProfit);
            document.getElementById('b-scalp').innerText = formatIDR(state.buckets.scalp);
            document.getElementById('b-smart').innerText = formatIDR(state.buckets.smart);
            document.getElementById('b-moon').innerText = formatIDR(state.buckets.moon);
            
            const total = state.capProfit + state.buckets.scalp + state.buckets.smart + state.buckets.moon;
            document.getElementById('perc-stat').innerText = (((total / state.initCap) - 1) * 100).toFixed(2) + "%";

            const aDiv = document.getElementById('list-analysis'), eDiv = document.getElementById('list-execution'), hDiv = document.getElementById('list-history');
            aDiv.innerHTML = ''; eDiv.innerHTML = ''; hDiv.innerHTML = '';

            state.cards.forEach(c => {
                const pnl = ((c.current / c.entry) - 1) * 100;
                const html = `
                    <div class="glass-premium p-4 flex flex-col gap-3 ${c.status === 'EXECUTION' ? 'blink-execute' : ''}">
                        <div class="flex justify-between items-start">
                            <div class="flex gap-3 items-center">
                                <img src="${c.img}" class="w-10 h-10 rounded-full">
                                <div>
                                    <h4 class="text-[11px] titan-font">${c.name}/IDR</h4>
                                    <p class="text-[7px] text-yellow-500 font-bold uppercase">${c.badge || c.strat + ' STRATEGY'}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-[12px] titan-font ${pnl >= 0 ? 'text-emerald-400' : 'text-red-400'}">${pnl.toFixed(2)}%</p>
                                <p class="text-[7px] opacity-30">PnL LIVE</p>
                            </div>
                        </div>
                        <canvas id="chart-${c.id}" class="mini-chart"></canvas>
                        <div class="flex justify-between items-center bg-black/30 p-2 rounded-xl">
                            <span class="text-[8px] opacity-40 titan-font">RSI: ${c.rsi}</span>
                            <div class="flex gap-2">
                                ${c.status === 'ANALYSIS' ? 
                                    `<button onclick="handleCardAction(${c.id}, 'LOCK')" class="px-6 py-2 bg-yellow-500 text-black text-[9px] font-black rounded-lg uppercase">LOCK</button>` :
                                    `<button onclick="handleCardAction(${c.id}, 'TP')" class="px-4 py-2 bg-emerald-500 text-[9px] font-bold rounded-lg uppercase">TP</button>
                                     <button onclick="handleCardAction(${c.id}, 'SL')" class="px-4 py-2 bg-red-500 text-[9px] font-bold rounded-lg uppercase">SL</button>`
                                }
                            </div>
                        </div>
                    </div>`;
                if(c.status === 'ANALYSIS') aDiv.innerHTML += html; else eDiv.innerHTML += html;
                setTimeout(() => drawMiniChart(c.id, c.spark, pnl >= 0), 100);
            });

            state.log.slice(-10).reverse().forEach(l => {
                hDiv.innerHTML += `
                    <div class="bg-white/5 p-3 rounded-xl flex justify-between items-center border border-white/5">
                        <div><p class="text-[9px] titan-font">${l.name}</p><p class="text-[6px] opacity-30">${l.time}</p></div>
                        <p class="text-[8px] font-black ${l.profit >= 0 ? 'text-emerald-400' : 'text-red-400'}">${formatIDR(l.profit)}</p>
                    </div>`;
            });
        }

        // --- UTILS & GUIDE ---
        function showGuide() {
            const content = `
                <div class="text-left text-[10px] space-y-4 uppercase">
                    <h2 class="titan-font text-yellow-500 text-center text-[12px] mb-4">BUKU PANDUAN TITAN V13</h2>
                    <div class="border-l-2 border-yellow-500 pl-3">
                        <p class="text-yellow-500 font-black mb-1">1. CARA BUY (ENTRY)</p>
                        <p class="opacity-70 leading-relaxed">PANTAU KARTU DENGAN <span class="text-emerald-400">RSI < 30</span> (STRONG BUY). JIKA GRAFIK SPARKLINE MULAI NAIK, TEKAN <span class="text-emerald-400">LOCK</span> UNTUK MASUK KE EKSEKUSI.</p>
                    </div>
                    <div class="border-l-2 border-blue-500 pl-3">
                        <p class="text-blue-500 font-black mb-1">2. CARA SELL (EXIT)</p>
                        <p class="opacity-70 leading-relaxed">PANTU PnL LIVE. JIKA <span class="text-emerald-400">HIJAU</span> DAN MENCAPAI TARGET, TEKAN <span class="text-emerald-400">TP</span>. JIKA <span class="text-red-400">MERAH</span> MENDEKATI TOLERANSI, TEKAN <span class="text-red-400">SL</span>.</p>
                    </div>
                    <div class="border-l-2 border-white pl-3">
                        <p class="font-black mb-1">3. MANAJEMEN MODAL</p>
                        <p class="opacity-70 leading-relaxed">SETIAP LOCK MEMAKAI 10% DARI SALDO BUCKET STRATEGI ANDA UNTUK KEAMANAN.</p>
                    </div>
                </div>`;
            showCustomAlert(content);
        }

        function drawMiniChart(id, data, profit) {
            const ctx = document.getElementById(`chart-${id}`).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: { labels: data.map((_,i)=>i), datasets: [{ data: data, borderColor: profit ? '#10b981' : '#f43f5e', borderWidth: 2, fill: true, backgroundColor: profit ? 'rgba(16, 185, 129, 0.1)' : 'rgba(244, 63, 94, 0.1)', tension: 0.4, pointRadius: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        }

        function formatIDR(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v); }
        function showCustomAlert(c) { document.getElementById('alert-content').innerHTML = c; document.getElementById('custom-alert').classList.remove('hidden'); }
        function closeAlert() { document.getElementById('custom-alert').classList.add('hidden'); }
        function smartNotif(t) { const area = document.getElementById('notif-area'); const el = document.createElement('div'); el.className = "floating-msg titan-font text-yellow-500"; el.innerHTML = t; area.appendChild(el); setTimeout(()=>el.remove(), 4000); }
        function exportExcel() { const ws = XLSX.utils.json_to_sheet(state.log); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "History"); XLSX.writeFile(wb, "TITAN_Report.xlsx"); }

        window.onload = () => { if(state.auth) { document.getElementById('auth-screen').style.display = 'none'; startEngine(); } };
    </script>
</body>
</html>
