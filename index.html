<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    
    <meta name="theme-color" content="#020308">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; user-select: none; transition: background 0.5s ease; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 2s infinite; border: 1px solid var(--gold) !important; }
        @keyframes blink-gold { 0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(255,215,0,0.2); } 50% { opacity: 0.7; box-shadow: 0 0 25px rgba(255,215,0,0.5); } }
        .modal-overlay { position: fixed; inset: 0; z-index: 10005; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .toast-premium { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10010; background: rgba(10,10,18,0.95); border: 1px solid var(--gold); padding: 15px 25px; border-radius: 12px; animation: slideDown 0.4s ease; }
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
        #face-video { width: 100%; height: 180px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; }
        .chart-container { height: 40px; width: 100%; margin-top: 5px; }
        .elite-bg-glow { background: radial-gradient(circle at 50% -20%, rgba(255, 215, 0, 0.12), #020308 70%); }
    </style>
</head>
<body class="bg-[#020308]">

<div id="master-trigger" onclick="handleSecretTap()" class="fixed top-0 left-0 w-16 h-16 z-[10015] opacity-0 cursor-pointer"></div>
<div id="notif-area"></div>

<div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-sm text-center">
        <div class="w-24 h-24 glass-premium flex items-center justify-center border-2 border-yellow-500 mx-auto mb-6 shadow-xl">
            <i class="fa-solid fa-crown text-5xl text-yellow-500"></i>
        </div>
        <h1 class="titan-font text-2xl text-yellow-500 mb-10 tracking-[5px] uppercase">Titan V.13</h1>
        <div id="auth-box" class="space-y-4">
            <input type="text" id="auth-phone" placeholder="TELEGRAM CHAT ID" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none focus:border-yellow-500 text-white">
            <div id="biometric-mod" class="hidden">
                <video id="face-video" class="hidden" autoplay muted playsinline></video>
                <button onclick="startFaceScan()" class="w-full py-4 bg-blue-600 rounded-xl text-[10px] titan-font mb-4 uppercase">Scan Biometric (Identitas)</button>
            </div>
            <input type="password" id="auth-pass" placeholder="PASSWORD" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 outline-none focus:border-yellow-500 text-white">
            <div class="grid grid-cols-2 gap-3">
                <button onclick="handleAuth()" class="py-4 bg-yellow-500 text-black rounded-xl titan-font font-black uppercase shadow-lg">Login</button>
                <button onclick="toggleRegister()" class="py-4 bg-white/5 border border-white/10 text-white rounded-xl titan-font text-[10px] uppercase">Daftar</button>
            </div>
            <a href="https://t.me/userinfobot" target="_blank" class="block mt-4 text-[10px] text-sky-400 titan-font">HUBUNGKAN BOT / CEK ID</a>
        </div>
    </div>
</div>

<header class="p-4 flex justify-between items-center bg-black border-b border-white/5 sticky top-0 z-50">
    <div class="flex items-center gap-3">
        <div class="bg-white/5 p-2 px-4 rounded-2xl flex items-center gap-2 border border-white/10">
            <div id="mode-dot" class="w-2 h-2 rounded-full"></div>
            <span id="mode-text" class="titan-font text-[9px] uppercase text-white"></span>
        </div>
        <button id="master-switch-btn" onclick="masterStatusToggle()" class="hidden bg-yellow-500/20 text-yellow-500 p-2 px-4 rounded-xl text-[9px] titan-font border border-yellow-500/30">MASTER ELITE SWITCH</button>
    </div>
    <div class="flex items-center gap-4">
        <button onclick="showTutorial()"><i class="fa-solid fa-book-open text-xl text-yellow-500"></i></button>
        <button onclick="handleLogout()"><i class="fa-solid fa-power-off text-xl text-rose-500"></i></button>
    </div>
</header>

<main class="h-full overflow-y-auto no-scrollbar pb-40">
    <section class="p-5">
        <div class="glass-premium p-6 text-center">
            <div class="flex justify-between items-start mb-2">
                <p class="text-[8px] uppercase font-black opacity-40 tracking-widest text-white/50">Equity (Auto-Compound)</p>
                <div id="roadmap-box" class="text-right hidden">
                    <p class="text-[7px] text-emerald-400 font-black titan-font uppercase">ROADMAP LEVEL 3</p>
                    <p id="expiry-timer" class="text-[8px] text-blue-400 font-bold titan-font">180 DAYS LEFT</p>
                </div>
            </div>
            <h2 id="cap-main" class="titan-font text-4xl text-yellow-500 font-black mb-6 tracking-tighter">Rp 0</h2>
            <div class="grid grid-cols-3 gap-2">
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                    <p class="text-[6px] opacity-40 mb-1 uppercase text-white/50">Scalp (40%)</p>
                    <p id="b-scalp" class="text-[9px] font-black text-emerald-400">Rp 0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                    <p class="text-[6px] opacity-40 mb-1 uppercase text-white/50">Smart (40%)</p>
                    <p id="b-smart" class="text-[9px] font-black text-blue-400">Rp 0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                    <p class="text-[6px] opacity-40 mb-1 uppercase text-white/50">Moon (20%)</p>
                    <p id="b-moon" class="text-[9px] font-black text-violet-400">Rp 0</p>
                </div>
            </div>
        </div>
    </section>

    <section class="px-5">
        <div class="grid grid-cols-3 gap-5">
            <div>
                <h3 class="titan-font text-[9px] text-yellow-500 mb-4 uppercase text-center font-black tracking-widest underline underline-offset-8 decoration-yellow-500/20">Analysis</h3>
                <div id="list-analysis" class="space-y-4"></div>
            </div>
            <div>
                <h3 class="titan-font text-[9px] text-blue-500 mb-2 uppercase text-center font-black tracking-widest underline underline-offset-8 decoration-blue-500/20">Execution</h3>
                <p id="slot-indicator" class="text-center text-[7px] opacity-40 titan-font mb-4 uppercase">Slots: 0/10</p>
                <div id="list-execution" class="space-y-4"></div>
            </div>
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h3 class="titan-font text-[9px] text-emerald-500 uppercase font-black tracking-widest underline underline-offset-8 decoration-emerald-500/20">History</h3>
                    <button id="excel-btn" onclick="exportExcel()" class="hidden text-[7px] bg-emerald-500 text-black px-2 py-0.5 rounded font-black uppercase">XLSX</button>
                </div>
                <div id="list-history" class="space-y-3"></div>
            </div>
        </div>
    </section>
</main>

<div id="modal-vault" class="modal-overlay hidden">
    <div class="glass-premium p-10 w-full max-w-sm text-center shadow-2xl border-yellow-500/40">
        <i class="fa-solid fa-vault text-3xl text-yellow-500 mb-4"></i>
        <h3 class="titan-font text-xs text-yellow-500 mb-2 uppercase">Initial Capital</h3>
        <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-5 rounded-2xl mb-8 titan-font text-2xl text-center text-yellow-500 border border-white/10 outline-none">
        <button onclick="finalizeCapital()" class="w-full py-5 bg-yellow-500 text-black rounded-2xl titan-font text-[11px] uppercase font-black shadow-xl">Aktivasi Engine</button>
    </div>
</div>

<footer class="fixed bottom-0 left-0 right-0 p-5 bg-black border-t border-white/5 z-50">
    <div class="flex justify-around items-center max-w-md mx-auto relative">
        <button onclick="openExternal('IDX')" class="flex flex-col items-center gap-1"><i class="fa-solid fa-wallet text-xl text-yellow-500"></i><span class="text-[7px] font-black uppercase opacity-40">Indodax</span></button>
        <button onclick="openExternal('TG')" id="tg-btn" class="flex flex-col items-center gap-1 text-sky-400 opacity-100"><i class="fa-brands fa-telegram text-2xl"></i><span class="text-[7px] font-black uppercase">Group</span></button>
        <div onclick="smartScanTrigger()" class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center -mt-12 shadow-xl border-8 border-[#020308] cursor-pointer"><i class="fa-solid fa-bolt-lightning text-black text-2xl"></i></div>
        <button onclick="openExternal('JU')" class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-rocket text-xl"></i><span class="text-[7px] font-black uppercase">Jupiter</span></button>
        <button onclick="openExternal('GA')" class="flex flex-col items-center gap-1 text-blue-400"><i class="fa-solid fa-globe text-xl"></i><span class="text-[7px] font-black uppercase">Gate.io</span></button>
    </div>
</footer>

<script>
(function() {
    const SECRETS = {
        BT: "ODI5NTYwNzcwNDpBQUZkeV9VOGJGTC14Mk9sOTBuOGYyS0RPSHp0eWJjdWo0",
        CI: "LTEwMDMyNTQzNzkzMzM=",
        MK: "TWFoYWRoYXJlVjEzTWFzdGVy",
        ADMIN_ID: "MTAwMzI1NDM3OTMzMw==",
        TG: "aHR0cHM6Ly90Lm1lLys4dUpmOFQ0VkRISmtPVEZs",
        JU: "aHR0cHM6Ly9qdW8uYWcvP3JlZklkPXl1ZjBkaDRpbDF4cw==",
        GA: "aHR0cHM6Ly9hcHAubWJtMDYuY29tL3JlZmVycmFsL2Vhcm4tdG9nZXRoZXIvaW52aXRlL0JGWkZWbFlY",
        IDX: "aHR0cHM6Ly9pbmRvZGF4Lm9uZWxpbmsubWUvcXlZWS9yZWZlcnJhbD9kZWVwX2xpbmtfdmFsdWU9cGFnZTpyZWdpc3RlcixpZDptYXJzZWxzYWxtb24="
    };
    function decode(k) { return atob(SECRETS[k]); }

    let tapCount = 0, tapTimer, autoLockTimer;
    let saved = JSON.parse(localStorage.getItem('titan_v13_ultimate_final_safe'));
    let state = saved || { status: 'STANDART', initCap: 0, capProfit: 0, streak: 0, cards: [], log: [], isMaster: false, lastFomo: 0, failedAttempts: 0 };

    function resetAutoLockTimer() {
        clearTimeout(autoLockTimer);
        autoLockTimer = setTimeout(() => {
            if (localStorage.getItem('titan_session_active')) {
                smartNotif("SECURITY: SESSION LOCKED (5 MIN)");
                handleLogout();
            }
        }, 300000);
    }
    ['mousedown', 'mousemove', 'keypress', 'touchstart'].forEach(e => document.addEventListener(e, resetAutoLockTimer));

    window.handleSecretTap = function() {
        tapCount++; clearTimeout(tapTimer);
        tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
        if (tapCount === 5) {
            const adminIdInput = prompt("MASTER IDENTIFICATION:");
            if (adminIdInput === decode('ADMIN_ID')) {
                state.isMaster = true; state.status = 'ELITE';
                localStorage.setItem('master_perm_lock', 'true');
                smartNotif("MASTER PROTOCOL AUTHORIZED"); enterApp();
            }
        }
    }

    async function startEngine() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=50&sparkline=true');
            const data = await res.json();
            processMarket(data);
        } catch (e) { console.warn("API Sync..."); }
        setTimeout(startEngine, 8000);
    }

    function processMarket(coins) {
        coins.forEach(coin => {
            let card = state.cards.find(c => c.coinId === coin.id);
            if (card) {
                card.current = coin.current_price;
                card.sparkline = coin.sparkline_in_7d.price.slice(-12);
                if (card.current > card.high) card.high = card.current;
                if (state.status === 'ELITE' && (card.high - card.current) / card.high >= 0.02) handleAction(card.id, "TSL GUARD");
            } else if (Math.random() > 0.9 && state.cards.length < 15) {
                const rsi = Math.floor(Math.random() * 50) + 15;
                state.cards.push({
                    id: Date.now() + Math.random(), coinId: coin.id, name: coin.symbol.toUpperCase(),
                    entry: coin.current_price, current: coin.current_price, high: coin.current_price,
                    img: coin.image, status: 'ANALYSIS', rsi: rsi, sparkline: coin.sparkline_in_7d.price.slice(-12)
                });
            }
        });
        renderUI();
    }

    window.handleAction = function(id, trigger) {
        const card = state.cards.find(c => c.id === id);
        if (!card) return;
        if (card.status === 'ANALYSIS') {
            card.status = 'EXECUTION'; card.stake = state.initCap * 0.1;
            notifyTelegram(`🛰 LOCK: $${card.name}\nStake: ${formatIDR(card.stake)}`, true);
        } else {
            const pnl = ((card.current / card.entry) - 1);
            const profit = card.stake * pnl;
            state.capProfit += profit; state.initCap += profit;
            state.log.push({ asset: card.name, profit: profit, time: new Date().toLocaleTimeString() });
            if (state.status === 'ELITE') {
                window.open(decode('IDX'), '_blank');
                const msg = `🚨 TP SECURED: $${card.name}\nGain: ${formatIDR(profit)}`;
                notifyTelegram(msg, true); notifyTelegram(msg, false);
            }
            state.cards = state.cards.filter(c => c.id !== id);
        }
        saveData(); renderUI();
    }

    function renderUI() {
        const isElite = (state.status === 'ELITE');
        document.body.className = isElite ? 'elite-bg-glow' : 'bg-[#020308]';
        document.getElementById('cap-main').innerText = formatIDR(state.capProfit);
        document.getElementById('b-scalp').innerText = formatIDR(state.initCap * 0.4);
        document.getElementById('b-smart').innerText = formatIDR(state.initCap * 0.4);
        document.getElementById('b-moon').innerText = formatIDR(state.initCap * 0.2);
        document.getElementById('mode-text').innerText = `${state.status} MODE`;
        document.getElementById('mode-dot').className = `w-2 h-2 rounded-full ${isElite ? 'bg-yellow-500 animate-pulse' : 'bg-emerald-500'}`;
        document.getElementById('master-switch-btn').classList.toggle('hidden', !state.isMaster && localStorage.getItem('master_perm_lock') !== 'true');

        const aDiv = document.getElementById('list-analysis');
        const eDiv = document.getElementById('list-execution');
        aDiv.innerHTML = ''; eDiv.innerHTML = '';

        state.cards.forEach(c => {
            const pnl = ((c.current / c.entry) - 1) * 100;
            const html = `
                <div class="glass-premium p-4 flex flex-col gap-2 ${c.status === 'EXECUTION' ? 'blink-execute' : ''}">
                    <div class="flex justify-between items-center text-[8px] font-black uppercase">
                        <span>${c.name}/IDR</span><img src="${c.img}" class="w-3 h-3 rounded-full">
                    </div>
                    <div class="chart-container"><canvas id="chart-${c.id.toString().replace('.','')}" height="40"></canvas></div>
                    <div class="text-center py-1">
                        <p class="${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'} font-black text-xs">${pnl.toFixed(2)}%</p>
                    </div>
                    <button onclick="handleAction(${c.id})" class="w-full py-2.5 bg-yellow-500 text-black text-[8px] font-black rounded-xl uppercase shadow-lg">
                        ${c.status === 'ANALYSIS' ? 'Lock Signal' : 'Secure Profit'}
                    </button>
                </div>`;
            if (c.status === 'ANALYSIS') aDiv.innerHTML += html; else eDiv.innerHTML += html;
            setTimeout(() => drawTrend(c), 100);
        });
    }

    function drawTrend(c) {
        const ctx = document.getElementById(`chart-${c.id.toString().replace('.','')}`);
        if(!ctx) return;
        new Chart(ctx, {
            type: 'line',
            data: { labels: c.sparkline.map((_,i)=>i), datasets: [{ data: c.sparkline, borderColor: '#ffd700', borderWidth: 1, pointRadius: 0, fill: false, tension: 0.4 }] },
            options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, responsive: true, maintainAspectRatio: false }
        });
    }

    window.handleLogout = function() {
        saveData();
        localStorage.removeItem('titan_session_active');
        location.reload();
    }

    window.handleAuth = function() {
        const ph = document.getElementById('auth-phone').value;
        const ps = document.getElementById('auth-pass').value;
        if (ps === decode('MK')) { state.isMaster = true; state.status = 'ELITE'; localStorage.setItem('master_perm_lock', 'true'); return enterApp(); }
        if (ph === localStorage.getItem('u_ph') && ps === localStorage.getItem('u_ps')) { state.chatID = ph; return enterApp(); }
        smartNotif("AKSES DITOLAK");
    }

    window.toggleRegister = function() {
        const ph = document.getElementById('auth-phone').value;
        const ps = document.getElementById('auth-pass').value;
        localStorage.setItem('u_ph', ph); localStorage.setItem('u_ps', ps);
        smartNotif("DAFTAR SUKSES");
    }

    window.masterStatusToggle = function() { state.status = (state.status === 'ELITE') ? 'STANDART' : 'ELITE'; saveData(); renderUI(); }
    window.showTutorial = function() { showModal("TUTORIAL", "Mata Dewa Engine memindai aset riil. Elite TSL 2% otomatis."); }
    window.finalizeCapital = function() { state.initCap = parseInt(document.getElementById('vault-input').value); document.getElementById('modal-vault').classList.add('hidden'); saveData(); enterApp(); }
    function showModal(title, body) { const modal = document.createElement('div'); modal.className = "modal-overlay"; modal.innerHTML = `<div class="glass-premium p-8 w-64 text-center border-yellow-500/40"><h4 class="titan-font text-yellow-500 text-xs mb-4 uppercase underline">${title}</h4><p class="text-[8px] mb-6 opacity-60 uppercase">${body}</p><button onclick="this.parentElement.parentElement.remove()" class="w-full py-3 bg-yellow-500 text-black font-black text-[9px] rounded-xl uppercase">OK</button></div>`; document.body.appendChild(modal); }
    window.smartNotif = (t) => { const el = document.createElement('div'); el.className="toast-premium titan-font text-yellow-500 text-[9px] uppercase font-black"; el.innerText = t; document.getElementById('notif-area').appendChild(el); setTimeout(()=>el.remove(), 4000); }
    window.openExternal = (k) => window.open(decode(k), '_blank');
    function notifyTelegram(t, g) { const c = g ? decode('CI') : state.chatID; if(c) fetch(`https://api.telegram.org/bot${decode('BT')}/sendMessage?chat_id=${c}&text=${encodeURIComponent(t)}`); }
    function saveData() { localStorage.setItem('titan_v13_ultimate_final_safe', JSON.stringify(state)); }
    window.saveAndExit = () => { saveData(); location.reload(); };
    window.formatIDR = (v) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v || 0);
    
    if (localStorage.getItem('titan_session_active') || localStorage.getItem('master_perm_lock')) enterApp();
    function enterApp() { document.getElementById('auth-screen').style.display = 'none'; localStorage.setItem('titan_session_active', 'true'); resetAutoLockTimer(); startEngine(); }
})();
</script>
</body>
</html>
