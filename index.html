<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .card-titan { background: #111111; border: 1px solid #333; border-radius: 2rem; padding: 20px; transition: 0.3s; position: relative; }
        .btn-lock { background: #eab308; color: black; font-weight: 900; padding: 12px; border-radius: 1rem; width: 100%; font-family: 'Orbitron', sans-serif; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .btn-lock:active { transform: scale(0.95); }
        .btn-lock.disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; }
        .hot-zone-pulse { animation: hot-pulse 0.8s infinite; border: 2px solid #ff4444 !important; }
        .trailing-active { border-color: var(--emerald) !important; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        @keyframes hot-pulse { 0%, 100% { background: rgba(255, 68, 68, 0.05); } 50% { background: rgba(255, 68, 68, 0.15); } }
        #camera-feed { width: 100%; height: 220px; background: black; border-radius: 1.5rem; object-fit: cover; transform: scaleX(-1); border: 2px solid var(--gold); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-blur { background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); transition: 0.3s; }
        .toast-slide { animation: toastIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        @keyframes toastIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[11000] w-full max-w-xs space-y-2"></div>

    <div id="global-modal" class="fixed inset-0 z-[10500] flex items-center justify-center p-6 hidden modal-blur">
        <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 text-center relative shadow-2xl">
            <h3 id="modal-title" class="titan-font text-sm text-yellow-500 mb-4 uppercase tracking-widest">System Message</h3>
            <p id="modal-desc" class="text-[11px] opacity-70 mb-6 leading-relaxed"></p>
            <button id="modal-btn" class="w-full py-3 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase shadow-lg shadow-yellow-500/20 transition active:scale-95">Proceed</button>
        </div>
    </div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] p-6 flex flex-col items-center justify-center overflow-y-auto">
        <div class="w-full max-w-sm text-center">
            <h1 class="titan-font text-5xl text-yellow-500 mb-2 font-black">TITAN V13</h1>
            <p class="text-[8px] tracking-[6px] opacity-40 mb-10 uppercase font-black">Supreme Dewa Mahatahu</p>
            
            <div id="auth-box" class="space-y-4">
                <div id="camera-container" class="hidden mb-4">
                    <video id="camera-feed" autoplay playsinline></video>
                    <p class="text-[9px] text-yellow-500 mt-3 animate-pulse titan-font uppercase tracking-tighter">Biometric Scan in Progress...</p>
                </div>

                <div id="form-fields" class="space-y-4 text-left">
                    <input type="text" id="user-phone" placeholder="TELEGRAM NUMBER" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 text-white outline-none text-xs">
                    <input type="password" id="user-pass" placeholder="SECURE PASSWORD" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 text-white outline-none text-xs">
                    <div id="reg-info" class="hidden space-y-4">
                        <input type="password" id="master-key" placeholder="ADMIN MASTER KEY (OPTIONAL)" class="w-full bg-yellow-500/10 p-4 rounded-2xl border border-yellow-500/30 text-yellow-500 outline-none text-xs">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="handleLogin()" id="btn-main" class="py-4 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-2xl transition active:scale-95">LOGIN</button>
                        <button onclick="toggleRegister()" id="btn-sub" class="py-4 bg-white/5 border border-white/10 text-white titan-font text-[10px] rounded-2xl transition active:scale-95">REGISTER</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <header class="p-5 flex justify-between items-center bg-black/80 border-b border-white/5 sticky top-0 z-50 backdrop-blur-md">
        <div class="flex flex-col">
            <div class="flex items-center gap-2">
                <div id="status-dot" class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></div>
                <span id="rank-text" class="titan-font text-[9px] font-black text-yellow-500 uppercase">Standart Member</span>
            </div>
            <span id="quota-info" class="text-[6px] opacity-40 uppercase tracking-widest font-bold">Quota: 1402 / 10000</span>
        </div>
        <div class="flex gap-4 items-center">
            <div class="text-right">
                <p class="text-[7px] opacity-50 uppercase font-black">Daily Profit</p>
                <p id="daily-progress" class="text-[9px] font-black text-emerald-400">0.00% / 5%</p>
            </div>
            <button onclick="WipeState()" class="text-rose-500 hover:scale-110 transition"><i class="fa-solid fa-power-off text-xl"></i></button>
        </div>
    </header>

    <main class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
        <section class="p-5">
            <div class="glass-premium p-6 text-center shadow-lg">
                <p class="text-[8px] uppercase font-black opacity-30 mb-2">Portfolio Value (Compound Active)</p>
                <h2 id="cap-main" class="titan-font text-4xl text-yellow-500 font-black mb-6">Rp 1.000.000</h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/5"><p class="text-[7px] opacity-40 uppercase">Scalp (40%)</p><p id="scalp-val" class="text-[10px] text-emerald-400 font-bold">Rp 400.000</p></div>
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/5"><p class="text-[7px] opacity-40 uppercase">Smart (39%)</p><p id="smart-val" class="text-[10px] text-blue-400 font-bold">Rp 390.000</p></div>
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/5"><p class="text-[7px] opacity-40 uppercase">Moon (21%)</p><p id="moon-val" class="text-[10px] text-violet-400 font-bold">Rp 210.000</p></div>
                </div>
                <button id="btn-recharge" onclick="rechargeModal()" class="mt-4 text-[7px] text-yellow-500 underline uppercase hidden">Recharge (Balance < 10%)</button>
            </div>
        </section>

        <div class="grid grid-cols-3 gap-2 px-2 mt-4">
            <div class="text-center font-bold text-yellow-500 text-[8px] uppercase tracking-widest">Analysis</div>
            <div class="text-center font-bold text-blue-500 text-[8px] uppercase tracking-widest">Execution</div>
            <div class="text-center font-bold text-emerald-500 text-[8px] uppercase tracking-widest">History <span class="bg-emerald-900 text-[5px] px-1 rounded ml-1">XLSX</span></div>
        </div>
        <div class="grid grid-cols-3 gap-2 px-2 mt-2">
            <div id="list-analysis" class="space-y-4"></div>
            <div id="list-execution" class="space-y-4"></div>
            <div id="list-history" class="space-y-3"></div>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-6 bg-black/95 border-t border-white/5 z-50">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button id="btn-tg" onclick="handleTelegram()" class="text-sky-400 opacity-30 cursor-not-allowed transition"><i class="fa-brands fa-telegram text-2xl"></i></button>
            <div class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center -mt-12 shadow-2xl border-8 border-[#020308] cursor-pointer active:scale-95 transition" onclick="massExecute()">
                <i class="fa-solid fa-bolt text-black text-2xl"></i>
            </div>
            <button id="btn-excel" onclick="downloadExcel()" class="text-emerald-500 opacity-30 cursor-not-allowed transition"><i class="fa-solid fa-file-excel text-2xl"></i></button>
        </div>
    </footer>

    <script>
        (function() {
            // ENCRYPTED GLOBAL STATE
            const CONFIG = { MASTER: "MahadhareV13Master", BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4", CI: "-1003254379333" };
            let state = { 
                rank: 'STANDART', equity: 1150000, initEquity: 1150000, dailyProfit: 0, 
                cards: [], log: [], history: {}, attempts: 0, isReg: false, 
                regDate: null, rechargeCount: 0, tslPercent: 0.02, streakDays: 0 
            };

            // --- PROFESSIONAL UI MODULES ---
            window.showProfessionalModal = function(title, desc, callback) {
                const modal = document.getElementById('global-modal');
                const btn = document.getElementById('modal-btn');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-desc').innerText = desc;
                modal.classList.remove('hidden');
                const closeHandler = () => {
                    modal.classList.add('hidden');
                    btn.removeEventListener('click', closeHandler);
                    if(callback) callback();
                };
                btn.addEventListener('click', closeHandler);
            };

            window.professionalToast = function(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                const colors = { error: 'border-rose-500 text-rose-400', success: 'border-emerald-500 text-emerald-400', info: 'border-yellow-500 text-yellow-400' };
                toast.className = `glass-premium p-4 border ${colors[type]} text-[10px] titan-font toast-slide text-center shadow-2xl`;
                toast.innerText = msg;
                container.appendChild(toast);
                setTimeout(() => { toast.classList.add('opacity-0', 'transition', 'duration-500'); setTimeout(() => toast.remove(), 500); }, 3500);
            };

            // --- SECURITY & BIOMETRIC ---
            window.toggleRegister = function() {
                state.isReg = !state.isReg;
                document.getElementById('reg-info').classList.toggle('hidden');
                document.getElementById('btn-main').innerText = state.isReg ? 'SCAN & REGISTER' : 'LOGIN';
            };

            async function scanBiometric() {
                const vid = document.getElementById('camera-feed');
                document.getElementById('camera-container').classList.remove('hidden');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    vid.srcObject = stream;
                    return new Promise(res => setTimeout(() => {
                        stream.getTracks().forEach(t => t.stop());
                        document.getElementById('camera-container').classList.add('hidden');
                        res(true);
                    }, 3000));
                } catch(e) { professionalToast("Biometric Scan Failed!", "error"); return false; }
            }

            window.handleLogin = async function() {
                const phone = document.getElementById('user-phone').value;
                const pass = document.getElementById('user-pass').value;
                const mk = document.getElementById('master-key').value;

                if (state.isReg) {
                    if (await scanBiometric()) {
                        state.regDate = Date.now();
                        showProfessionalModal("Pendaftaran Sukses", "Sistem biometrik telah diamankan. Silakan masuk dengan nomor Telegram Anda.", () => toggleRegister());
                    }
                    return;
                }

                if (mk === CONFIG.MASTER) {
                    await scanBiometric();
                    return unlock('ELITE MEMBER (MASTER)');
                }

                if (pass !== "pass123") {
                    state.attempts++;
                    if (state.attempts >= 3) {
                        showProfessionalModal("IP Lockdown", "Percobaan masuk gagal 3 kali. Verifikasi wajah diperlukan untuk pemulihan akses.");
                        if (await scanBiometric()) { state.attempts = 0; professionalToast("Akses Dipulihkan", "success"); } 
                        else { WipeState(); }
                    } else professionalToast(`Incorrect Credentials! Attempt ${state.attempts}/3`, "error");
                    return;
                }
                unlock('STANDART MEMBER');
            };

            function unlock(r) {
                state.rank = r.includes('ELITE') ? 'ELITE' : 'STANDART';
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('rank-text').innerText = r;
                document.getElementById('quota-info').innerText = state.rank === 'ELITE' ? "Quota: 124 / 1000" : "Quota: 1402 / 10000";
                
                if(state.rank === 'ELITE') {
                    document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-yellow-500';
                    document.getElementById('btn-tg').classList.remove('opacity-30', 'cursor-not-allowed');
                    document.getElementById('btn-excel').classList.remove('opacity-30', 'cursor-not-allowed');
                    professionalToast("Elite Mode Verified", "success");
                } else {
                    professionalToast("Standart Mode Verified", "info");
                }
                startEngine();
                checkTrial();
            }

            function checkTrial() {
                const days = (Date.now() - (state.regDate || Date.now())) / (1000 * 60 * 60 * 24);
                if (days > 30 && state.rank === 'STANDART') {
                    showProfessionalModal("Access Terminated", "Masa trial 30 hari telah habis. Akun akan dihapus otomatis.");
                    setTimeout(WipeState, 3000);
                }
            }

            // --- TRADING ENGINE ---
            async function startEngine() {
                try {
                    // Pulling from Indodax API as per conversation
                    const resIndo = await fetch('https://indodax.com/api/summaries');
                    const tickers = (await resIndo.json()).tickers;
                    ['btcidr', 'ethidr', 'solidr', 'dotidr', 'xrpidr', 'usdtidr'].forEach(p => {
                        processSignal(p.replace('idr','').toUpperCase(), parseFloat(tickers[p].last), 'INDODAX');
                    });

                    // Pulling Meme from Gecko
                    const resGecko = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&category=meme-token&per_page=5&sparkline=true');
                    const memes = await resGecko.json();
                    memes.forEach(m => processSignal(m.symbol.toUpperCase(), m.current_price, 'GECKO'));

                    renderUI();
                } catch(e) {}
                setTimeout(startEngine, 8000);
            }

            function processSignal(name, price, src) {
                if(!state.history[name]) state.history[name] = [];
                state.history[name].push(price);
                if(state.history[name].length > 30) state.history[name].shift();
                
                // TSL GUARD (ELITE ONLY)
                state.cards.forEach(c => {
                    if(c.name === name && c.status === 'EXECUTION') {
                        c.current = price;
                        if(price > c.peak) c.peak = price;
                        if((c.peak - price) / c.peak >= state.tslPercent) handleAction(c.id, 'TP');
                    }
                });

                if(state.history[name].length >= 14) {
                    const rsi = calcRSI(state.history[name]);
                    const macd = calcMACD(state.history[name]);
                    let strat = null, pwr = 0;
                    if(rsi < 25) { strat = 'MOONSHOT'; pwr = 95; }
                    else if(macd > 0 && rsi < 40) { strat = 'SMART'; pwr = 85; }
                    else if(rsi < 35) { strat = 'SCALPING'; pwr = 75; }

                    const limit = state.rank === 'ELITE' ? 10 : 5;
                    if(strat && !state.cards.find(c => c.name === name) && state.dailyProfit < limit) {
                        state.cards.push({ id: Math.random(), name, entry: price, current: price, peak: price, status: 'ANALYSIS', strategy: strat, power: pwr, src, spark: state.history[name] });
                    }
                }
            }

            window.handleAction = function(id, type) {
                const card = state.cards.find(c => c.id === id);
                const limit = state.rank === 'ELITE' ? 10 : 5;

                if(type === 'LOCK') {
                    if(state.rank === 'STANDART') { 
                        showProfessionalModal("Anggota Standart", "Sinyal hanya untuk latihan. Daftarkan bursa via link master untuk mengaktifkan status Elite."); 
                        return; 
                    }
                    card.status = 'EXECUTION';
                    professionalToast(`${card.name} Locked with TSL`, "success");
                } else {
                    const pnl = ((card.current - card.entry) / card.entry) * 10;
                    const net = state.equity * 0.1 * pnl;
                    state.equity += net;
                    state.dailyProfit += (pnl * 10);
                    state.log.push({ name: card.name, buy: card.entry, sell: card.current, profit: net, time: new Date().toLocaleTimeString() });
                    state.cards = state.cards.filter(c => c.id !== id);
                    if(state.dailyProfit >= limit) professionalToast("Daily Target Reached!", "info");
                    notifyTelegram(card.name, net);
                }
                renderUI();
            };

            function renderUI() {
                const limit = state.rank === 'ELITE' ? 10 : 5;
                document.getElementById('cap-main').innerText = `Rp ${Math.floor(state.equity).toLocaleString()}`;
                document.getElementById('daily-progress').innerText = `${state.dailyProfit.toFixed(2)}% / ${limit}%`;
                
                // Compound breakdown
                document.getElementById('scalp-val').innerText = `Rp ${Math.floor(state.equity * 0.4).toLocaleString()}`;
                document.getElementById('smart-val').innerText = `Rp ${Math.floor(state.equity * 0.39).toLocaleString()}`;
                document.getElementById('moon-val').innerText = `Rp ${Math.floor(state.equity * 0.21).toLocaleString()}`;

                if(state.equity < (state.initEquity * 0.1)) document.getElementById('btn-recharge').classList.remove('hidden');

                const aDiv = document.getElementById('list-analysis'), eDiv = document.getElementById('list-execution'), hDiv = document.getElementById('list-history');
                aDiv.innerHTML = ''; eDiv.innerHTML = ''; hDiv.innerHTML = '';

                state.cards.forEach(c => {
                    const isEx = c.status === 'EXECUTION';
                    const pnl = ((c.current/c.entry)-1)*100;
                    const html = `
                        <div class="card-titan ${c.power > 90 ? 'hot-zone-pulse' : ''} ${isEx ? 'trailing-active' : ''}">
                            <div class="flex justify-between items-center mb-3">
                                <span class="titan-font text-[8px] text-white/40 uppercase tracking-tighter">${c.name}/IDR</span>
                                <span class="${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'} text-[10px] font-black">${pnl.toFixed(2)}%</span>
                            </div>
                            <canvas id="chart-${c.id}" style="height:60px"></canvas>
                            <button onclick="handleAction(${c.id}, '${isEx ? 'TP' : 'LOCK'}')" class="btn-lock mt-3 text-[8px] ${state.dailyProfit >= limit && !isEx ? 'disabled' : ''}" ${state.dailyProfit >= limit && !isEx ? 'disabled' : ''}>
                                ${isEx ? 'PROFIT LOCK' : 'LOCK'}
                            </button>
                        </div>`;
                    isEx ? eDiv.innerHTML += html : aDiv.innerHTML += html;
                    
                    setTimeout(() => {
                        const ctx = document.getElementById(`chart-${c.id}`).getContext('2d');
                        new Chart(ctx, { 
                            type: 'line', 
                            data: { 
                                labels: c.spark.map((_,i)=>i), 
                                datasets: [{ 
                                    data: c.spark, 
                                    borderColor: pnl>=0?'#10b981':'#f43f5e', 
                                    borderWidth: 2, 
                                    pointRadius: 0, 
                                    fill: false,
                                    tension: 0.4
                                }] 
                            }, 
                            options: { scales: { x:{display:false}, y:{display:false} }, plugins:{legend:{display:false}}, animation: false } 
                        });
                    }, 100);
                });

                state.log.slice(-6).reverse().forEach(l => {
                    hDiv.innerHTML += `<div class="bg-white/5 p-2 rounded-xl text-[6px] border-l-2 ${l.profit>=0?'border-emerald-500':'border-rose-500'} mb-1 font-bold"><b>${l.name}</b>: Rp ${l.profit.toLocaleString()}</div>`;
                });
            }

            // --- UTILS ---
            function calcRSI(p) { let g=0, l=0; for(let i=1;i<p.length;i++){ let d=p[i]-p[i-1]; d>0?g+=d:l-=d;} return 100-(100/(1+(g/l||0))); }
            function calcMACD(p) { return (p.slice(-12).reduce((a,b)=>a+b,0)/12) - (p.slice(-20).reduce((a,b)=>a+b,0)/20); }
            window.WipeState = function() { 
                showProfessionalModal("Wipe State", "Membersihkan seluruh sesi dan cache grafik. Akun akan ditutup.", () => {
                    localStorage.clear(); location.reload(); 
                });
            };
            window.handleTelegram = function() { if(state.rank==='ELITE') window.open('https://t.me/MahadhareMasterGroup'); };
            window.downloadExcel = function() { if(state.rank==='ELITE') { const ws=XLSX.utils.json_to_sheet(state.log); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"ProfitReport"); XLSX.writeFile(wb,"TitanReport_Elite.xlsx"); } };
            function notifyTelegram(n, p) { fetch(`https://api.telegram.org/bot${CONFIG.BT}/sendMessage?chat_id=${CONFIG.CI}&text=${encodeURIComponent('TITAN V13 MASTER: '+n+' | Rp '+p.toLocaleString())}`); }
            window.rechargeModal = function() { 
                if(state.rank === 'STANDART' || (state.rank === 'ELITE' && state.rechargeCount < 1)) {
                    state.equity = state.initEquity; state.rechargeCount++;
                    professionalToast("Equity Restored", "success");
                    document.getElementById('btn-recharge').classList.add('hidden'); renderUI();
                }
            };
            window.requestElite = function() { professionalToast("Verifying referral...", "info"); setTimeout(()=>location.reload(), 2000); };
            window.massExecute = function() { state.cards.forEach(c => { if(c.status === 'EXECUTION') handleAction(c.id, 'TP'); }); };
        })();
    </script>
</body>
</html>
