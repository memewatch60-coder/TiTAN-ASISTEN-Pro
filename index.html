<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN V13 - MAHADHARE GOLD ULTIMATE AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 1.5s infinite; }
        @keyframes blink-gold { 0%, 100% { border-color: rgba(255,215,0,0.1); } 50% { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); } }
        .floating-msg { position: fixed; top: 110px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 12px; border: 1px solid var(--gold); max-width: 220px; font-size: 9px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        canvas.mini-chart { height: 60px !important; width: 100% !important; }
        .grid-dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; height: 100%; }
        .mod-col { display: flex; flex-direction: column; overflow: hidden; }
    </style>
</head>
<body>

    <div id="notif-area"></div>

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] overflow-y-auto p-6 flex flex-col items-center">
        <div class="w-full max-w-sm text-center mt-4">
            <img src="https://i.ibb.co/9H0pL7H/94672.png" alt="LOGO" class="w-32 h-32 mx-auto mb-4 rounded-2xl border border-white/10 shadow-2xl">
            <h1 class="titan-font text-3xl text-yellow-500 mb-1">TITAN V.13 AI</h1>
            <p class="text-[8px] tracking-[4px] opacity-50 mb-8 uppercase font-black">Mahadhare Hybrid Core</p>
            <div id="auth-box" class="space-y-4">
                <input type="password" id="auth-pass" placeholder="PASSWORD MASTER" class="w-full bg-white/5 p-4 rounded-xl border border-white/10 text-white outline-none text-xs text-center">
                <button onclick="handleAuth()" class="w-full py-4 bg-yellow-500 text-black titan-font text-[10px] font-black rounded-xl uppercase">Masuk System</button>
            </div>
        </div>
    </div>

    <div id="modal-vault" class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-8 hidden backdrop-blur-2xl">
        <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/40 text-center">
            <i class="fa-solid fa-vault text-3xl text-yellow-500 mb-4"></i>
            <h3 class="titan-font text-sm text-yellow-500 mb-1 uppercase font-black">Initialize Vault</h3>
            <p class="text-[8px] opacity-40 mb-8 uppercase tracking-widest">REAL MODE HYBRID ACTIVE</p>
            <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-4 rounded-xl mb-8 titan-font text-2xl text-center text-yellow-500 border border-white/10 outline-none">
            <button onclick="finalizeCapital()" class="w-full py-5 bg-yellow-500 text-black font-black rounded-xl titan-font text-[10px] uppercase shadow-lg">Activate Machine</button>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center bg-black/80 border-b border-yellow-500/10 sticky top-0 z-50">
        <div class="bg-white/5 p-2 px-3 rounded-2xl flex items-center gap-2 border border-white/10">
            <div id="mode-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span id="ai-status-text" class="titan-font text-[9px] font-black uppercase text-emerald-500">Neural Active</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="exportExcel()" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center text-[10px] text-emerald-500"><i class="fa-solid fa-file-excel"></i></button>
            <button onclick="location.reload()" class="text-rose-500 bg-rose-500/10 w-8 h-8 rounded-lg border border-rose-500/20"><i class="fa-solid fa-power-off text-sm"></i></button>
        </div>
    </header>

    <main class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
        <section class="p-5">
            <div class="glass-premium p-6 relative">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-[8px] uppercase font-black opacity-40 italic" id="ai-learning-tag">AI Learning Mode</p>
                    <p class="text-[8px] text-yellow-500 font-bold uppercase">Real Mode</p>
                </div>
                <h2 id="cap-main" class="titan-font text-3xl text-yellow-500 font-black mb-4 tracking-tighter">Rp 0</h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Scalp (40%)</p>
                        <p id="b-scalp" class="text-[9px] font-bold text-emerald-400">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Smart (39%)</p>
                        <p id="b-smart" class="text-[9px] font-bold text-blue-400">Rp 0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/5 text-center">
                        <p class="text-[7px] opacity-50 uppercase mb-1">Moon (21%)</p>
                        <p id="b-moon" class="text-[9px] font-bold text-violet-400">Rp 0</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="px-5 mb-10 h-[60vh]">
            <div class="grid-dashboard">
                <div class="mod-col">
                    <h3 class="titan-font text-[9px] text-yellow-500 mb-4 uppercase text-center font-black">Analysis</h3>
                    <div id="list-analysis" class="flex-1 overflow-y-auto no-scrollbar space-y-4"></div>
                </div>
                <div class="mod-col">
                    <h3 class="titan-font text-[9px] text-blue-500 mb-4 uppercase text-center font-black text-emerald-400">Execution</h3>
                    <div id="list-execution" class="flex-1 overflow-y-auto no-scrollbar space-y-4"></div>
                </div>
                <div class="mod-col">
                    <h3 class="titan-font text-[9px] text-emerald-500 mb-4 uppercase text-center font-black opacity-30">History</h3>
                    <div id="list-history" class="flex-1 overflow-y-auto no-scrollbar space-y-2 opacity-40"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 p-4 bg-black/95 border-t border-white/5 z-50">
        <div class="flex justify-around items-center max-w-md mx-auto relative">
            <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-ranking-star text-lg"></i><span class="text-[8px]">LIVE</span></button>
            <button onclick="window.open('https://t.me/+8uJ78T4VDHJkOTRl')" class="flex flex-col items-center gap-1 text-sky-400"><i class="fa-brands fa-telegram text-2xl"></i><span class="text-[8px]">GROUP</span></button>
            <div onclick="smartScanTrigger()" id="main-bolt" class="w-14 h-14 bg-yellow-500 rounded-full flex items-center justify-center -mt-10 shadow-lg shadow-yellow-500/30 border-8 border-[#020308] cursor-pointer active:scale-90 transition-all"><i class="fa-solid fa-bolt text-black text-xl"></i></div>
            <button class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-brain text-lg"></i><span class="text-[8px]">AI SCAN</span></button>
            <button class="flex flex-col items-center gap-1 opacity-40"><i class="fa-solid fa-shield-check text-lg"></i><span class="text-[8px]">SECURE</span></button>
        </div>
    </footer>

    <script>
        // --- MASTER DATA & BRAIN INJECTION ---
        let brain;
        let state = {
            balance: 0, profit: 0, buckets: { scalp: 0, smart: 0, moon: 0 },
            cards: [], log: [], totalTrades: 0, wins: 0
        };

        const MASTER = {
            KEY: "MAHADHARE",
            BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4",
            CI: "-1003254379333"
        };

        // 1. NEURAL NETWORK INIT
        async function initAI() {
            brain = tf.sequential();
            brain.add(tf.layers.dense({units: 16, inputShape: [5], activation: 'relu'}));
            brain.add(tf.layers.dense({units: 1, activation: 'sigmoid'}));
            brain.compile({optimizer: tf.train.adam(0.01), loss: 'meanSquaredError'});
        }

        // 2. AUTH & VAULT (POSISI PERSIS APK 1)
        function handleAuth() {
            if(document.getElementById('auth-pass').value === MASTER.KEY) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('modal-vault').classList.remove('hidden');
                initAI();
            } else { alert("MASTER KEY SALAH"); }
        }

        function finalizeCapital() {
            const v = parseInt(document.getElementById('vault-input').value);
            if(v < 1000000) return alert("Minimal 1JT");
            state.balance = v;
            state.buckets = { scalp: v*0.4, smart: v*0.39, moon: v*0.21 };
            document.getElementById('modal-vault').classList.add('hidden');
            renderUI();
            smartNotif("System Hybrid Ready");
        }

        // 3. REAL MARKET SCAN (SUNTIKAN DATA ASLI)
        async function smartScanTrigger() {
            document.getElementById('main-bolt').classList.add('animate-spin');
            smartNotif("Neural Scanning Real Market...");
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=12&sparkline=true');
                const coins = await res.json();
                processHybrid(coins);
            } catch (e) { smartNotif("Connection Error"); }
            setTimeout(() => document.getElementById('main-bolt').classList.remove('animate-spin'), 2000);
        }

        async function processHybrid(coins) {
            for(let coin of coins) {
                const spark = coin.sparkline_in_7d.price.slice(-5);
                const input = tf.tensor2d([spark.map(v => (v - Math.min(...spark)) / (Math.max(...spark) - Math.min(...spark) || 1))]);
                const prediction = await brain.predict(input).data();
                const score = prediction[0];

                // Expert System Rule: Only Confidence > 85% & Check Duplicate
                if(score > 0.85 && !state.cards.find(c => c.coinId === coin.id)) {
                    state.cards.push({
                        id: Date.now() + Math.random(), coinId: coin.id, name: coin.symbol.toUpperCase(),
                        entry: coin.current_price, current: coin.current_price, score: (score*100).toFixed(1),
                        status: 'ANALYSIS', img: coin.image, spark: spark, lastInput: spark
                    });
                }
                input.dispose();
            }
            renderUI();
        }

        // 4. FEEDBACK LOOP LOGIC (KECERDASAN KE-3)
        async function closeTrade(id, win) {
            const card = state.cards.find(c => c.id === id);
            
            // FEEDBACK LOOP: Belajar dari Win/Loss
            document.getElementById('ai-learning-tag').innerText = "AI Learning...";
            const label = win ? [1] : [0]; 
            const trainingData = tf.tensor2d([card.lastInput.map(v => (v - Math.min(...card.lastInput)) / (Math.max(...card.lastInput) - Math.min(...card.lastInput) || 1))]);
            const target = tf.tensor2d([label]);
            await brain.fit(trainingData, target, { epochs: 3 }); 
            trainingData.dispose(); target.dispose();
            document.getElementById('ai-learning-tag').innerText = "Knowledge Updated";

            // Settle Balance
            const stake = card.lockedStake || 0;
            const pnl = win ? stake * 1.15 : stake * 0.85;
            state.balance += pnl;
            state.buckets.scalp += pnl; // Asumsi masuk ke scalp bucket
            state.profit += (pnl - stake);
            
            state.log.push({name: card.name, res: win?'TP':'SL', time: new Date().toLocaleTimeString()});
            state.cards = state.cards.filter(c => c.id !== id);
            renderUI();
        }

        function lockTrade(id) {
            const card = state.cards.find(c => c.id === id);
            const stake = state.buckets.scalp * 0.1; // Expert Rule: 10% dari bucket
            state.buckets.scalp -= stake;
            state.balance -= stake;
            card.status = 'EXECUTION';
            card.lockedStake = stake;
            renderUI();
        }

        // 5. UI RENDERER (SAMA PERSIS APK 1)
        function renderUI() {
            document.getElementById('cap-main').innerText = formatIDR(state.profit);
            document.getElementById('b-scalp').innerText = formatIDR(state.buckets.scalp);
            document.getElementById('b-smart').innerText = formatIDR(state.buckets.smart);
            document.getElementById('b-moon').innerText = formatIDR(state.buckets.moon);

            const aDiv = document.getElementById('list-analysis');
            const eDiv = document.getElementById('list-execution');
            const hDiv = document.getElementById('list-history');
            aDiv.innerHTML = ''; eDiv.innerHTML = ''; hDiv.innerHTML = '';

            state.cards.forEach(c => {
                const html = `
                    <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col gap-2 ${c.status === 'EXECUTION' ? 'blink-execute' : ''}">
                        <div class="flex justify-between items-center">
                            <img src="${c.img}" class="w-5 h-5 rounded-full">
                            <span class="text-[7px] titan-font text-emerald-400">${c.score}% AI</span>
                        </div>
                        <p class="text-[9px] titan-font text-center">${c.name}/IDR</p>
                        ${c.status === 'ANALYSIS' ? 
                            `<button onclick="lockTrade(${c.id})" class="w-full py-2 bg-yellow-500 text-black text-[8px] font-black rounded-lg uppercase">Lock</button>` :
                            `<div class="flex gap-1"><button onclick="closeTrade(${c.id}, true)" class="flex-1 py-2 bg-emerald-500 text-[8px] font-bold rounded-lg">TP</button><button onclick="closeTrade(${c.id}, false)" class="flex-1 py-2 bg-rose-500 text-[8px] font-bold rounded-lg">SL</button></div>`
                        }
                    </div>`;
                if(c.status === 'ANALYSIS') aDiv.innerHTML += html; else eDiv.innerHTML += html;
            });

            state.log.slice(-10).forEach(l => {
                hDiv.innerHTML += `<div class="bg-white/5 p-2 rounded-xl border border-white/10 text-[7px] flex justify-between"><span>${l.name}</span><span class="${l.res==='TP'?'text-emerald-400':'text-rose-400'}">${l.res}</span></div>`;
            });
        }

        function formatIDR(v) { return "Rp " + Math.floor(v).toLocaleString('id-ID'); }
        function smartNotif(t) {
            const area = document.getElementById('notif-area');
            const el = document.createElement('div');
            el.className = "floating-msg titan-font text-yellow-500";
            el.innerText = t;
            area.appendChild(el);
            setTimeout(()=>el.remove(), 3000);
        }
        function exportExcel() {
            const ws = XLSX.utils.json_to_sheet(state.log);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Titan_Log");
            XLSX.writeFile(wb, "TITAN_AI_Report.xlsx");
        }
    </script>
</body>
</html>
