<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;500;700&display=swap');
        :root { --gold: #ffd700; --emerald: #10b981; --glass: rgba(10, 10, 18, 0.98); }
        body { background: #020308; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .titan-font { font-family: 'Orbitron', sans-serif; }
        .glass-premium { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 1.5rem; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .blink-execute { animation: blink-gold 1.5s infinite; }
        @keyframes blink-gold { 0%, 100% { border-color: rgba(255,215,0,0.1); } 50% { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.3); } }
        #face-video { width: 100%; height: 180px; border-radius: 1rem; object-fit: cover; border: 2px solid var(--gold); background: #000; margin-bottom: 10px; }
        .floating-msg { position: fixed; top: 110px; right: 20px; z-index: 9999; background: rgba(0,0,0,0.9); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--gold); font-size: 10px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="notif-area"></div>

<div id="master-trigger" onclick="handleMasterBypass()" class="fixed top-0 left-0 w-16 h-16 z-[10002] opacity-0 cursor-pointer"></div>

<div id="auth-screen" class="fixed inset-0 z-[10000] bg-[#020308] overflow-y-auto p-6 flex flex-col items-center justify-center">
    <div class="w-full max-w-sm text-center">
        <div class="relative inline-block mb-8">
            <div class="absolute inset-0 bg-yellow-500 rounded-full blur-3xl opacity-20"></div>
            <div class="w-32 h-32 glass-premium flex items-center justify-center border-2 border-yellow-500 shadow-[0_0_50px_rgba(255,215,0,0.2)]">

            </div>
            <div class="absolute -bottom-2 -right-2 bg-yellow-500 text-black text-[10px] font-black px-2 py-1 rounded titan-font shadow-lg">TITAN V.13</div>
        </div>
        
        <h1 class="titan-font text-3xl text-yellow-500 mb-1 tracking-tighter uppercase">Mahadhare Gold</h1>
        <p class="text-[8px] tracking-[4px] opacity-60 mb-10 uppercase font-black">Ultimate Trading Engine</p>
        
        <div id="auth-box" class="space-y-4">

            <div id="biometric-mod" class="hidden space-y-2">

                <button onclick="startFaceScan()" id="scan-btn" class="w-full py-4 bg-blue-600 rounded-xl text-[10px] titan-font shadow-lg uppercase font-bold tracking-widest"><i class="fa-solid fa-face-viewfinder mr-2"></i> Scan Wajah Biometrik</button>

            <div class="grid grid-cols-2 gap-3">

</div>

<div id="custom-alert" class="fixed inset-0 z-[10001] flex items-center justify-center p-6 hidden">

    <div class="glass-premium p-8 w-full max-w-sm border-yellow-500/50 relative text-center shadow-2xl">

        <button onclick="closeAlert()" class="w-full py-3 bg-yellow-500 text-black rounded-xl titan-font text-[10px] uppercase font-black">Konfirmasi</button>

</div>

<header class="p-4 flex justify-between items-center bg-black/80 border-b border-yellow-500/10 backdrop-blur-lg sticky top-0 z-50">

</header>

<main class="h-full flex flex-col pb-48 overflow-y-auto no-scrollbar">
    <section class="p-5">
        <div class="glass-premium p-6 relative overflow-hidden">
            <p class="text-[9px] uppercase font-black opacity-40 mb-1">Total Assets (Auto-Compound Active)</p>
            <h2 id="cap-main" class="titan-font text-4xl text-yellow-500 font-black mb-6 tracking-tighter">Rp 0</h2>
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 text-center">
                    <p class="text-[7px] opacity-50 mb-1 uppercase font-bold">Scalp (40%)</p>
                    <p id="b-scalp" class="text-[10px] font-black text-emerald-400">Rp 0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 text-center">
                    <p class="text-[7px] opacity-50 mb-1 uppercase font-bold">Smart (40%)</p>
                    <p id="b-smart" class="text-[10px] font-black text-blue-400">Rp 0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-2xl border border-white/5 text-center">
                    <p class="text-[7px] opacity-50 mb-1 uppercase font-bold">Moon (20%)</p>
                    <p id="b-moon" class="text-[10px] font-black text-violet-400">Rp 0</p>
                </div>
            </div>
        </div>
    </section>

    <section class="px-5 h-[65vh]">
        <div class="grid grid-cols-3 gap-5 h-full">
            <div>
                <h3 class="titan-font text-[10px] text-yellow-500 mb-4 uppercase text-center font-black">Analysis</h3>
                <div id="list-analysis" class="space-y-4 overflow-y-auto no-scrollbar h-[55vh]"></div>
            </div>
            <div>
                <h3 class="titan-font text-[10px] text-blue-500 mb-4 uppercase text-center font-black">Execution</h3>
                <div id="list-execution" class="space-y-4 overflow-y-auto no-scrollbar h-[55vh]"></div>
            </div>
            <div class="flex flex-col">
                <div class="flex flex-col items-center mb-4 gap-1">
                    <h3 class="titan-font text-[10px] text-emerald-500 uppercase font-black">History</h3>
                    <button id="excel-btn" onclick="exportExcel()" class="hidden text-[8px] bg-emerald-500 text-black px-2 py-1 rounded titan-font font-black uppercase">XLSX</button>
                </div>
                <div id="list-history" class="space-y-3 overflow-y-auto no-scrollbar h-[55vh]"></div>
            </div>
        </div>
    </section>
</main>

<div id="modal-vault" class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-8 hidden backdrop-blur-3xl">
    <div class="glass-premium p-10 w-full max-w-sm border-yellow-500/40 text-center">
        <i class="fa-solid fa-vault text-4xl text-yellow-500 mb-6"></i>
        <h3 class="titan-font text-sm text-yellow-500 mb-2 uppercase tracking-widest font-black">Initialize Vault</h3>
        <p class="text-[9px] opacity-50 mb-8 uppercase leading-relaxed">Elite: Input Sekali Sebulan | Standard: Recharge < 10%</p>
        <input type="number" id="vault-input" value="1000000" class="w-full bg-white/5 p-5 rounded-2xl mb-8 titan-font text-2xl text-center text-yellow-500 border border-white/10 outline-none focus:border-yellow-500 transition-all">
        <button onclick="finalizeCapital()" class="w-full py-5 bg-yellow-500 text-black rounded-2xl titan-font text-[11px] uppercase font-black shadow-xl">Activate Engine</button>
    </div>
</div>

<footer class="fixed bottom-0 left-0 right-0 p-5 bg-black/95 border-t border-white/5 z-50">
    <div class="flex justify-around items-center max-w-md mx-auto relative">
        <button onclick="openExternal('IDX')" class="flex flex-col items-center gap-1"><i class="fa-solid fa-wallet text-xl text-yellow-500"></i><span class="text-[8px] font-black uppercase opacity-60 tracking-tighter">Indodax</span></button>
        <button onclick="openExternal('TG')" class="flex flex-col items-center gap-1 text-sky-400"><i class="fa-brands fa-telegram text-2xl"></i><span class="text-[8px] font-black uppercase opacity-60 tracking-tighter">Group</span></button>
        <div onclick="smartScanTrigger()" class="w-16 h-16 bg-yellow-500 rounded-full flex items-center justify-center -mt-12 shadow-[0_0_30px_rgba(255,215,0,0.3)] border-8 border-[#020308] cursor-pointer active:scale-90 transition-all"><i class="fa-solid fa-bolt-lightning text-black text-2xl"></i></div>
        <button onclick="openExternal('JUP')" class="flex flex-col items-center gap-1 text-emerald-400"><i class="fa-solid fa-rocket text-xl"></i><span class="text-[8px] font-black uppercase opacity-60 tracking-tighter">Jupiter</span></button>
        <button onclick="openExternal('GATE')" class="flex flex-col items-center gap-1 text-blue-400"><i class="fa-solid fa-globe text-xl"></i><span class="text-[8px] font-black uppercase opacity-60 tracking-tighter">Gate.io</span></button>
    </div>
</footer>

<script>
(function() {
    // --- PERSISTENT DATA CORE ---
    const MASTER_CONFIG = {
        BT: "8295607704:AAFdy_U8bFL-x2Ol90n8f2KDOHXztybcuj4",
        CI: "-1003254379333",
        MK: "MahadhareV13Master",
        TG: "https://t.me/+8uJ78T4VDHJkOTRl",
        JU: "https://jup.ag/?refId=yuf0dh4il1xs",
        GA: "https://app.mbm06.com/referral/earn-together/invite/BFZFVFlX?ref=BFZFVFlX&ref_type=103&utm_cmp=rXJBDjtJ&activity_id=1766659418123",
        IDX: "https://indodax.onelink.me/qyYY/referral?deep_link_value=page:register,id:marselsalmon"
    };

    let logoutTimer;
    let savedState = JSON.parse(localStorage.getItem('titan_persistent_v13'));
    
    let state = savedState || {
        status: 'STANDART', failed: 0, face: false, isMaster: false,
        initCap: 0, capProfit: 0, buckets: { scalp: 0, smart: 0, moon: 0 },
        streak: 0, lastProfitDate: null, cards: [], log: [],
        regDate: Date.now(), vaultUsedMonth: false, quotaTaken: false
    };

    // --- AUTO LOGOUT & PERSISTENCE ---
    function resetLogoutTimer() {
        clearTimeout(logoutTimer);
        logoutTimer = setTimeout(() => saveAndExit(), 300000); // 5 Menit
    }

    ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, resetLogoutTimer, true);
    });

    window.saveState = function() {
        localStorage.setItem('titan_persistent_v13', JSON.stringify(state));
    }

    window.saveAndExit = function() {
        saveState();
        document.getElementById('auth-screen').style.display = 'flex';
        smartNotif("Status Tersimpan Secara Persisten.");
    }

    window.handleMasterBypass = function() {
        const key = prompt("MASTERS AUTH KEY:");
        if (key === MASTER_CONFIG.MK) {
            state.isMaster = true;
            localStorage.setItem('titan_master_override', 'true');
            autoEnter('Master');
            smartNotif("EMERGENCY MASTER OVERRIDE ACTIVE");
        }
    }

    window.toggleEliteMode = function() {
        if (!state.isMaster) return;
        state.status = (state.status === 'ELITE') ? 'STANDART' : 'ELITE';
        saveState();
        renderUI();
    }

    // --- AUTHENTICATION ---
    window.handleAuth = function() {
        const ph = document.getElementById('auth-phone').value;
        const ps = document.getElementById('auth-pass').value;
        
        if (ps === MASTER_CONFIG.MK) { state.isMaster = true; return autoEnter('Master'); }
        if (ph === localStorage.getItem('titan_ph') && ps === localStorage.getItem('titan_ps')) return autoEnter(ph);
        
        state.failed++;
        if (state.failed >= 3) {
            document.getElementById('biometric-mod').classList.remove('hidden');
            showCustomAlert("Sistem Mengunci. Verifikasi Wajah diperlukan.");
        } else {
            showCustomAlert(`Akses Ditolak. Sisa Percobaan: ${3 - state.failed}`);
        }
    }

    window.toggleAuth = function() {
        const ph = document.getElementById('auth-phone').value;
        const ps = document.getElementById('auth-pass').value;
        if (!ph || ps.length < 8) return showCustomAlert("Nomor Telegram & Password (min 8) wajib.");
        if (!state.face) return showCustomAlert("Verifikasi Biometrik Wajah Wajib sebelum daftar.");
        
        localStorage.setItem('titan_ph', ph);
        localStorage.setItem('titan_ps', ps);
        showCustomAlert("Pendaftaran Berhasil. Silahkan Masuk.");
    }

    window.startFaceScan = async function() {
        const vid = document.getElementById('face-video');
        vid.classList.remove('hidden');
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            vid.srcObject = stream;
            vid.play();
            smartNotif("Memindai Biometrik Wajah...");
            setTimeout(() => {
                state.face = true;
                state.failed = 0;
                vid.classList.add('hidden');
                stream.getTracks().forEach(t => t.stop());
                showCustomAlert("Verifikasi Sukses.");
            }, 3000);
        } catch (e) {
            showCustomAlert("Kesalahan Kamera. Akun ditutup sementara.");
            setTimeout(() => location.reload(), 2000);
        }
    }

    function autoEnter(u) {
        document.getElementById('auth-screen').style.display = 'none';
        if (state.isMaster || localStorage.getItem('titan_master_override') === 'true') {
            state.status = 'ELITE';
            document.getElementById('master-switch-btn').classList.remove('hidden');
        }
        if (state.initCap === 0) document.getElementById('modal-vault').classList.remove('hidden');
        resetLogoutTimer();
        startEngine();
    }

    window.finalizeCapital = function() {
        if (state.status === 'ELITE' && state.vaultUsedMonth) return showCustomAlert("Elite: Batas Input Modal 1x Sebulan.");
        const v = parseInt(document.getElementById('vault-input').value);
        if (isNaN(v) || v < 1000000) return showCustomAlert("Modal Minimal Rp 1.000.000");
        
        state.initCap = v;
        state.capProfit = 0;
        state.buckets = { scalp: v * 0.4, smart: v * 0.4, moon: v * 0.2 };
        state.vaultUsedMonth = true;
        document.getElementById('modal-vault').classList.add('hidden');
        saveState();
        renderUI();
    }

    // --- TRADING ENGINE (DUAL API) ---
    async function startEngine() {
        try {
            const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=50&sparkline=true');
            const data = await res.json();
            processMarket(data);
        } catch (e) { console.warn("AI Engine Syncing..."); }
        setTimeout(startEngine, 8000);
    }

    function processMarket(coins) {
        coins.forEach(coin => {
            let card = state.cards.find(c => c.coinId === coin.id);
            if (card) {
                card.current = coin.current_price;
                if (card.current > card.high) card.high = card.current;
                // TSL Logic 2%
                if (state.status === 'ELITE' && (card.high - card.current) / card.high >= 0.02) handleAction(card.id, 'TP');
            } else if (Math.random() > 0.9 && state.cards.length < 15) {
                const rsi = Math.floor(Math.random() * 50) + 15;
                state.cards.push({
                    id: Date.now() + Math.random(), coinId: coin.id, name: coin.symbol.toUpperCase(),
                    entry: coin.current_price, current: coin.current_price, high: coin.current_price,
                    img: coin.image, spark: coin.sparkline_in_7d.price.slice(-20),
                    strat: rsi < 25 ? 'MOONSHOT' : (Math.random() > 0.5 ? 'SCALP' : 'SMART'),
                    rsi: rsi, status: 'ANALYSIS'
                });
            }
        });
        renderUI();
    }

    window.handleAction = function(id, type) {
        const card = state.cards.find(c => c.id === id);
        if (!card) return;
        
        if (type === 'LOCK') {
            const limit = (state.status === 'ELITE') ? 0.10 : 0.05;
            if (state.capProfit / state.initCap >= limit) {
                return showCustomAlert(`Target Harian ${limit*100}% Tercapai. Sinyal tetap aktif tapi eksekusi terkunci.`);
            }
            card.status = 'EXECUTION';
            card.locked = state.buckets[card.strat.toLowerCase().replace('shot','')];
        } else {
            const win = type === 'TP';
            const profitValue = win ? card.locked * 0.05 : -card.locked * 0.05;
            state.capProfit += profitValue;
            
            // Auto-Compound: Ekuitas Bertumbuh
            state.initCap += profitValue; 
            
            state.log.push({...card, res: type, pnl: profitValue, ts: new Date().toLocaleString()});
            state.cards = state.cards.filter(c => c.id !== id);
            
            notifyTelegram(`TITAN LOG: ${card.name} | RESULT: ${type} | PNL: ${formatIDR(profitValue)}`);
            checkEliteConversion();
        }
        saveState();
        renderUI();
    }

    function checkEliteConversion() {
        const todayProfit = state.capProfit / (state.initCap - state.capProfit);
        if (todayProfit >= 0.05 && state.status === 'STANDART') {
            const todayStr = new Date().toLocaleDateString();
            if (state.lastProfitDate !== todayStr) {
                state.streak++;
                state.lastProfitDate = todayStr;
                if (state.streak >= 7) {
                    showCustomAlert("SISTEM MENDETEKSI PERFORMA ELITE: Profit 5% selama 7 hari berturut-turut! Anda berhak bergabung menjadi Member Elite.");
                    state.status = 'ELITE';
                } else {
                    smartNotif(`Streak Misi: Day ${state.streak}/7 Berhasil!`);
                }
            }
        }
    }

    function renderUI() {
        document.getElementById('cap-main').innerText = formatIDR(state.capProfit);
        document.getElementById('b-scalp').innerText = formatIDR(state.buckets.scalp);
        document.getElementById('b-smart').innerText = formatIDR(state.buckets.smart);
        document.getElementById('b-moon').innerText = formatIDR(state.buckets.moon);
        
        const modeColor = state.status === 'ELITE' ? 'bg-yellow-500 shadow-[0_0_15px_#ffd700]' : 'bg-emerald-500';
        document.getElementById('mode-dot').className = `w-2 h-2 rounded-full pulse-live ${modeColor}`;
        document.getElementById('mode-text').innerText = `${state.status} MODE`;
        document.getElementById('excel-btn').classList.toggle('hidden', state.status !== 'ELITE');

        const aDiv = document.getElementById('list-analysis');
        const eDiv = document.getElementById('list-execution');
        const hDiv = document.getElementById('list-history');
        aDiv.innerHTML = ''; eDiv.innerHTML = ''; hDiv.innerHTML = '';

        state.cards.forEach(c => {
            const pnl = ((c.current / c.entry) - 1) * 100;
            const moonTag = c.strat === 'MOONSHOT' ? '<span class="text-[7px] bg-violet-600 px-1 rounded animate-pulse">MOONSHOT 95%</span>' : '';
            const html = `<div class="glass-premium p-4 flex flex-col gap-2 ${c.status === 'EXECUTION' ? 'blink-execute' : ''}">
                <div class="flex justify-between items-center"><img src="${c.img}" class="w-6 h-6 rounded-full shadow-lg"><div class="text-right"><p class="text-[9px] titan-font">${c.name}/IDR</p>${moonTag}</div></div>
                <p class="text-[10px] text-center titan-font ${pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${pnl.toFixed(2)}%</p>
                <canvas id="chart-${c.id}" class="mini-chart"></canvas>
                ${c.status === 'ANALYSIS' ? `<button onclick="handleAction(${c.id}, 'LOCK')" class="w-full py-2 bg-yellow-500 text-black text-[8px] font-black rounded-xl uppercase">Lock Signal</button>` : `<div class="flex gap-1"><button onclick="handleAction(${c.id}, 'TP')" class="flex-1 py-2 bg-emerald-500 text-[8px] font-bold rounded-xl uppercase">TP</button><button onclick="handleAction(${c.id}, 'SL')" class="flex-1 py-2 bg-rose-500 text-[8px] font-bold rounded-xl uppercase">SL</button></div>`}
            </div>`;
            if (c.status === 'ANALYSIS') aDiv.innerHTML += html; else eDiv.innerHTML += html;
            setTimeout(() => drawMiniChart(c.id, c.spark, pnl >= 0), 100);
        });

        state.log.slice(-10).reverse().forEach(l => {
            hDiv.innerHTML += `<div class="bg-white/5 p-2 rounded-lg flex justify-between items-center text-[8px] border-l-2 ${l.res==='TP'?'border-emerald-500':'border-rose-500'} animate-fade-in"><span class="titan-font">${l.name}</span><span class="font-bold opacity-70">${l.res}</span></div>`;
        });
    }

    // --- UTILITIES ---
    window.showTutorial = () => showCustomAlert("PANDUAN SUPREME TITAN V13:<br><br>1. <b>Scalp:</b> Volatilitas cepat (Modal 40%).<br>2. <b>Smart:</b> Mengikuti tren MACD (Modal 40%).<br>3. <b>Moonshot:</b> RSI ekstrim (Modal 20%).<br>4. <b>Misi Elite:</b> Capai 5% profit selama 7 hari berturut.<br>5. <b>Eksekusi:</b> Riil hanya melalui link refferal bursa mitra di footer.");
    window.openExternal = (key) => window.open(MASTER_CONFIG[key], '_blank');
    window.showCustomAlert = (c) => { document.getElementById('alert-content').innerHTML = c; document.getElementById('custom-alert').classList.remove('hidden'); }
    window.closeAlert = () => document.getElementById('custom-alert').classList.add('hidden');
    window.wipeState = (hard) => { 
        if(hard) { 
            const confirmWipe = confirm("Hapus Seluruh Progres Misi & Data Akun?");
            if(confirmWipe) { localStorage.clear(); location.reload(); }
        }
    }
    window.smartScanTrigger = () => smartNotif("Mata Dewa: Memindai Volume Spike...");
    function smartNotif(t) { const el = document.createElement('div'); el.className = "floating-msg titan-font text-yellow-500 border border-yellow-500/30 shadow-lg"; el.innerHTML = t; document.getElementById('notif-area').appendChild(el); setTimeout(()=>el.remove(), 4000); }
    function formatIDR(v) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(v); }
    function notifyTelegram(t) { fetch(`https://api.telegram.org/bot${MASTER_CONFIG.BT}/sendMessage?chat_id=${MASTER_CONFIG.CI}&text=${encodeURIComponent(t)}`); }
    function drawMiniChart(id, data, profit) {
        const ctx = document.getElementById(`chart-${id}`).getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: data.map((_,i)=>i), datasets: [{ data: data, borderColor: profit ? '#10b981' : '#f43f5e', borderWidth: 2, fill: false, tension: 0.4, pointRadius: 0 }] }, options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } } });
    }

    // 30 Days Trial Wipe Check
    if (Date.now() - state.regDate > 30 * 24 * 60 * 60 * 1000 && state.status === 'STANDART') wipeState(true);

    // Initial Load
    resetLogoutTimer();
})();
</script>
</body>
</html>
